function ymdParse(v) {

  var st = t.dateStart || t.date || '';
  var en = t.dateEnd || t.date || st;
  if (!st) return { start: '', end: '' };
  if (en < st) en = st;
  return { start: st, end: en };

function taskDays(t) {
  var w = taskWindow(t);
  var a = ymdParse(w.start), b = ymdParse(w.end);

  if (t.open === false) return { key: 'closed', label: '已关闭', cls: 'b-gray', hint: '老师已关闭该任务' };

}
function codeUpper(s) {
  return String(s || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
}

/* ===== 会话标识存取（安全加固 v2） =====
   会话标识只存 sessionStorage：不进网址、不进历史记录、不进 Referer，
   复制地址栏分享给别人不会再带走登录态；关闭标签页即失效。
   兼容旧链接：若地址栏残留 #s=，读一次、搬进 sessionStorage，然后立刻从地址抹掉。 */
var SID_KEY = 'df.sid.v2';
function _hashSid() {
  var m = /(?:^|[#&])s=([a-z0-9]{8,40})/.exec(location.hash || '');
  return m ? m[1] : '';
}
function scrubHashSid() {
  /* 只负责把地址栏的旧 #s= 抹掉，不参与登录态判定 */
  try {
    var h = location.hash || '';
    if (!/(?:^|[#&])s=[a-z0-9]{8,40}/.test(h)) return;
    var clean = h.replace(/[#&]?s=[a-z0-9]{8,40}/g, '');
    history.replaceState(null, '', location.pathname + location.search + (clean === '#' || !clean ? '' : clean));
  } catch (e) {}
}
function readSid() {
  var sid = '';
  try { sid = sessionStorage.getItem(SID_KEY) || ''; } catch (e) { sid = ''; }
  if (sid) return sid;
  /* 旧版分享链接：#s= 迁移一次后立即清除 */
  var legacy = _hashSid();
  if (legacy) {
    try { sessionStorage.setItem(SID_KEY, legacy); } catch (e) {}
    scrubHashSid();
    return legacy;
  }
  return '';
}
function writeSid(sid) {
  try { sessionStorage.setItem(SID_KEY, sid); } catch (e) {}
  /* 兜底：无论哪条旧代码路径写过 #s=，这里都清掉，网址始终干净 */
  scrubHashSid();
}
function clearSid() {
  try { sessionStorage.removeItem(SID_KEY); } catch (e) {}
  scrubHashSid();
}

function hashPass(pass, salt) {
  return CLD.sha256('df:' + salt + ':' + pass);
}

/* 用户桶：以学习代号为键，全小写 */
function userBucket(code) {
  return 'user:' + String(code || '').trim().toLowerCase();
}

function loadUser(code) {
  return CLD.get(userBucket(code));
}

function saveUser(u) {
  var loadedId = u.__cloudId;
  return CLD.getRaw(userBucket(u.code)).then(function (current) {
    if (loadedId && (!current || current.__cloudId !== loadedId)) throw new Error('账号已被其他操作更新，请刷新后重试');
    if (!loadedId && current && current.status !== 'deleted') throw new Error('该账号已经注册，请直接登录或联系老师');
    u.__v = ((current && current.__v) || u.__v || 0) + 1;
    u.upd = nowStr();
    return CLD.putVerified(userBucket(u.code), u, ['code', 'role', 'status', 'salt', 'hash', 'name', 'cls', 'pwAt', 'accountId']);
  });
}

/* ================= 全局学生索引（用于发现「已注册但未加入任何班级」的账号）=================
   为什么需要它：CLD.rows(bucket) 只能按【精确 userid】列出（没有前缀枚举接口），
   因此无法「列出所有 user:*」。这里自己维护一份学生代号索引：
   · 按代号第 5-6 位（班级号）分片写入 idx:students:<班号>，把并发写分散开，
     避免整班同时注册时挤在同一个桶里丢更新；
   · 另用 idx:students:shards 记录已存在哪些分片，供教师端枚举。
   索引只用于「发现账号」，权限判定仍逐个读取 user 记录本身。 */
var STU_IDX = 'idx:students';
function stuShardOf(code) {
  var s = String(code || '');
  if (/^\d{8}$/.test(s)) return s.slice(4, 6);
  return 'xx';
}
function idxAddStudent(code) {
  var low = String(code || '').trim().toLowerCase();
  if (!low) return Promise.resolve();
  var sh = stuShardOf(code);
  return CLD.update(STU_IDX + ':' + sh, function (cur) {
    var idx = cur || { codes: [], __v: 0 };
    idx.codes = idx.codes || [];
    var has = idx.codes.some(function (x) { return String(x).toLowerCase() === low; });
    if (!has) idx.codes.push(code);
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  }).then(function () {
    return CLD.update(STU_IDX + ':shards', function (cur) {
      var s = cur || { shards: [], __v: 0 };
      s.shards = s.shards || [];
      if (s.shards.indexOf(sh) < 0) s.shards.push(sh);
      s.__v = (s.__v || 0) + 1;
      return s;
    });
  }).catch(function () { /* 索引写失败不能阻断注册本身 */ });
}
function idxRemoveStudent(code) {
  var low = String(code || '').trim().toLowerCase();
  if (!low) return Promise.resolve();
  return CLD.update(STU_IDX + ':' + stuShardOf(code), function (cur) {
    var idx = cur || { codes: [], __v: 0 };
    idx.codes = (idx.codes || []).filter(function (x) { return String(x).toLowerCase() !== low; });
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  }).catch(function () {});
}
/* 读出索引里的全部学生代号（去重） */
function idxReadStudents() {
  return CLD.get(STU_IDX + ':shards').then(function (s) {
    var shards = (s && s.shards) || [];
    if (!shards.length) return [];
    return Promise.all(shards.map(function (x) {
      return CLD.get(STU_IDX + ':' + x).catch(function () { return null; });
    })).then(function (arr) {
      var seen = {}, out = [];
      arr.forEach(function (ix) {
        ((ix && ix.codes) || []).forEach(function (c) {
          var k = String(c).toLowerCase();
          if (!k || seen[k]) return;
          seen[k] = 1; out.push(c);
        });
      });
      return out;
    });
  });
}

/* 学生代号规则：2024 + 班级号（2 位）+ 学号（2 位），共 8 位数字 */
var CODE_PREFIX = '2024';
function pad2(v) {
  var s = String(v == null ? '' : v).replace(/[^0-9]/g, '').slice(0, 2);
  if (s.length === 1) s = '0' + s;
  return s;
}
function stuCode() {
  var c = pad2($('rgClsNo') ? $('rgClsNo').value : '');
  var n = pad2($('rgStuNo') ? $('rgStuNo').value : '');
  if (c.length === 2 && n.length === 2) return CODE_PREFIX + c + n;
  return '';
}
function previewCode() {

  } else {

  }
}

  for (i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}

function registerAccount() {
  var role = $('rgRole').value;
  var name = $('rgName').value.trim();
  var code;
  if (role === 'student') {
    var c2 = pad2($('rgClsNo').value), n2 = pad2($('rgStuNo').value);
    if (c2.length !== 2) { setMsg('rgMsg', '请填写 2 位班级号（如 01 表示 1 班）', 'err'); return; }
    if (n2.length !== 2) { setMsg('rgMsg', '请填写 2 位学号（如 03 表示 3 号）', 'err'); return; }
    var entryYear=selectedEntryYear();if(!entryYear){setMsg('rgMsg','请选择有效的入学年份。','err');return;}
    code = entryYear + c2 + n2;
  } else {
    code = $('rgUser').value.trim();
  }
  var invite = codeUpper($('rgClass').value);
  var p1 = $('rgPass').value, p2 = $('rgPass2').value;
  setMsg('rgMsg', '');

  if (!name) { setMsg('rgMsg', role === 'student' ? '请填写你的真实姓名（老师核对班级名单用）' : '请填写姓名或昵称', 'err'); return; }
  if (role === 'student') {
    var okName = (function (s) {
      if (!s || s.length < 2 || s.length > 10) return false;
      for (var i = 0; i < s.length; i++) {
        var cc = s.charCodeAt(i);
        if (cc === 0x00b7) continue;
        if (cc < 0x4e00 || cc > 0x9fa5) return false;
      }
      return true;
    })(name);
    if (!okName) { setMsg('rgMsg', '姓名请填写真实中文姓名（2-10 个汉字），不要填昵称、字母或数字', 'err'); return; }
  }
  if (!code) { setMsg('rgMsg', '请填写学习代号' + (role === 'teacher' ? '（教师账号）' : ''), 'err'); return; }
  if (code.length < 3) { setMsg('rgMsg', '代号至少 3 个字符', 'err'); return; }
  if (p1.length < 6) { setMsg('rgMsg', '密码至少 6 位', 'err'); return; }
  if (p1 !== p2) { setMsg('rgMsg', '两次输入的密码不一致', 'err'); return; }
  if (role === 'student' && !invite) { setMsg('rgMsg', '请填写老师给的班级邀请码', 'err'); return; }

  setMsg('rgMsg', '正在注册，请稍候…', 'info');

  return loadUser(code).then(function (exist) {
    /* 已被老师删除的账号不占用代号：允许同代号重新注册（覆盖旧删除记录） */
    if (exist && exist.status === 'deleted') exist = null;
    if (exist) {
      if (role !== 'student' || exist.role !== 'student' || exist.status !== 'active' || exist.cls !== invite || exist.name !== name) throw new Error('该学习代号已被使用，请联系老师');
      return hashPass(p1, exist.salt).then(function (h) {
        if (h !== exist.hash) throw new Error('该学习代号已注册，密码不一致，请登录或联系老师重置密码');
        return CLD.get('class:' + invite);
      }).then(function (c) { return finishStudentRegistration(exist, c); });
    }
    if (role === 'student') {
      return CLD.get('class:' + invite).then(function (cls) {
        if (!cls) throw new Error('邀请码无效，请向老师确认');
        /* 老师已删除的班级：邀请码立即失效，不允许再有人加进来 */
        if (cls.deleted) throw new Error('该班级已被老师删除，邀请码已失效，请向老师索取新的邀请码');
        if (cls.allowReg === false) throw new Error('该班级已关闭注册，请联系老师');
        return createUser(role, name, code, p1, invite, cls);
      });
    }
    return createUser(role, name, code, p1, '', null);
  }).then(function () { enterApp(); }).catch(function (e) {
    setMsg('rgMsg', e.message || '注册失败，请稍后重试', 'err');
  });
}

function createUser(role, name, code, pass, invite, cls) {
  var salt = CLD.rnd(16);
  return hashPass(pass, salt).then(function (h) {
    var u = {
      code: code, name: name, role: role, salt: salt, hash: h,
      cls: invite || '', status: 'active', at: nowStr(), pwAt: CLD.rnd(32), accountId: CLD.rnd(32), __v: 0
    };
    return saveUser(u).then(function () { return u; });
  }).then(function (u) {
    if (role === 'student') {
      return CLD.get('class:' + invite).then(function (currentClass) {
        if (!currentClass || currentClass.deleted || currentClass.allowReg === false) throw new Error('账号已保存，但班级已关闭，请联系老师分配班级');
        return CLD.setMember(invite, code, true);
      }).then(function () { return idxAddStudent(code); }).then(function () { return u; });
    }
    if (role === 'teacher') {
      /* 教师注册后自动建一个默认班级，方便立即使用 */
      var ic = genInvite();
      return CLD.get('class:' + ic).then(function (taken) {
        if (taken) return createUser(role, name, code, pass, invite, cls);
        var c = {
          code: ic, name: name + '的班级', teacher: code,
          allowReg: true, members: [], at: nowStr(), __v: 1
        };
        return CLD.put('class:' + ic, c).then(function () {
          return CLD.update('idx:teacher:' + code, function (cur) {
            var idx = cur || { codes: [], __v: 0 };
            if (idx.codes.indexOf(ic) < 0) idx.codes.push(ic);
            idx.__v = (idx.__v || 0) + 1;
            return idx;
          }).then(function () { return u; });
        });
      });
    }
    return u;
  }).then(function (u) {
    return openSession(u);
  });
}

var SESS_HOURS = 12;
function openSession(u) {
  var sid = CLD.rnd(24);
  var sess = {
    sid: sid, code: u.code, role: u.role, at: nowStr(),
    exp: Date.now() + SESS_HOURS * 3600 * 1000, pwAt: u.pwAt || '', accountId: u.accountId || '', __v: 1
  };
  if (u.role === 'student') {
    /* 学生每次登录都已用云端账号记录核对密码，无需再上传会话文件。
       只保留本页内存状态；刷新后重新输入密码。 */
    clearSid();
    sess.localOnly = true;
    S.session = sess;
    S.me = u;
    return Promise.resolve(u);
  }
  return CLD.put('sess:' + sid, sess).then(function () {
    writeSid(sid);
    S.session = sess;
    S.me = u;
    return u;
  });
}

    if (u.status === 'disabled') throw new Error('该账号已被老师停用，请联系老师');
    return hashPass(pass, u.salt).then(function (h) {

      return openSession(u);
    });

function doLogout() {
  GROWTH.view++; GROWTH.current=null; GROWTH.teacher=null; GROWTH.rows=[]; closeGrowthToast();
  /* 顺序很重要：先取出 sid，再撤销服务器会话，最后才清本地与网址。
     旧版先 scrubHashSid() 再 readSid()，sid 已被抹掉 → 读到空串 →
     服务器会话从未被撤销，旧链接在有效期内仍可恢复登录。 */
  var sid = readSid();
  S.me = null; S.session = null; S.cls = null; S.cache = {};
  clearSid();
  $('authView').className = '';
  $('appView').className = 'hide';
  if (!sid) return Promise.resolve(false);
  return CLD.update('sess:' + sid, function (cur) {
    var ss = cur || { __v: 0 };
    ss.revoked = true;
    ss.revokedAt = nowStr();
    ss.__v = (ss.__v || 0) + 1;
    return ss;
  }).then(function () {
    return true;
  }).catch(function () {
    /* 网络失败也要让本地立刻登出；提示用户会话可能未在服务器撤销 */
    try { setMsg('lgMsg', '已退出本机。网络异常，服务器会话可能未撤销，建议稍后再次点击退出或修改密码。', 'warn'); } catch (e) {}
    return false;
  });
}

function restoreSession() {
  var sid = readSid();
  if (!sid) return Promise.resolve(false);
  return CLD.get('sess:' + sid).then(function (sess) {
    if (!sess || sess.revoked) { clearSid(); return false; }
    /* 有效期校验：过期会话直接失效 */
    if (sess.exp && Date.now() > sess.exp) { clearSid(); return false; }
    return loadUser(sess.code).then(function (u) {
      if (!u || u.status === 'disabled' || u.status === 'deleted') { clearSid(); return false; }
      /* 密码重置后旧会话失效：旧版写成 sess.pwAt && u.pwAt && 比较，
         首次重置密码前签发的会话 pwAt 为空串，条件被短路 → 旧会话不失效。
         改为任一不一致即失效，且空串与空串相等（未重置过则继续有效）。 */
      if (String(sess.accountId || '') !== String(u.accountId || '') || String(sess.pwAt || '') !== String(u.pwAt || '')) { clearSid(); return false; }
      S.session = sess; S.me = u;
      return true;
    });
  }).catch(function () { return false; });
}

const libraryCategories = ['答题技巧','知识清单','好题积累'];
const libraryTags = ['审题方法','答题模板','核心概念','易混易错','典型例题','考前复习'];
const libraryChunkSize = 192 * 1024;
const libraryIds = new WeakMap();

async function libraryOwner(user) {
  if (!user || S.me !== user) throw Error('请重新登录');
  if (user.role === 'teacher') return user.code;
  const cls = user.cls && await CLD.get('class:'+user.cls);
  if (!cls || cls.deleted || !cls.teacher || !cls.members.some(code=>String(code).toLowerCase()===String(user.code).toLowerCase()))
    throw Error('请先加入有效班级，再查看本班教师的资料。');
  return cls.teacher;
}

async function libraryWrite(file, owner, category, tags, progress, check) {
  let id = libraryIds.get(file);
  if (!id) { id = newId(24); libraryIds.set(file,id); }
  const count = Math.ceil(file.size / libraryChunkSize);
  for (let i=0;i<count;i++) {
    check();
    progress('正在上传 '+file.name+'（'+(i+1)+'/'+count+'）');
    const slice = file.slice(i*libraryChunkSize,(i+1)*libraryChunkSize);
    const bytes = new Uint8Array(await slice.arrayBuffer());
    let binary = '';
    for (let j=0;j<bytes.length;j+=8192) binary += String.fromCharCode(...bytes.subarray(j,j+8192));
    await CLD.putVerified('library-part:'+id+':'+i,{data:btoa(binary)},['data']);
  }
  check();
  const entry = {id,name:file.name,size:file.size,type:file.type,category,tags,at:Date.now(),count};
  return CLD.update('library:'+owner,cur=>{
    cur = cur || {files:[]};
    cur.files = [entry,...cur.files.filter(item=>item.id!==id)];
    cur.__v = (cur.__v||0)+1;
    return cur;
  });
}

async function libraryBlob(item,check) {
  const parts = [];
  for (let i=0;i<item.count;i++) {
    check();
    const chunk = await CLD.get('library-part:'+item.id+':'+i);
    if (!chunk || typeof chunk.data!=='string') throw Error('文件未读完整，请重试。');
    parts.push(Uint8Array.from(atob(chunk.data),c=>c.charCodeAt(0)));
  }
  check();
  const blob = new Blob(parts,{type:'application/octet-stream'});
  if (blob.size!==item.size) throw Error('文件大小校验失败，请重新下载。');
  return blob;
}

function librarySave(blob,name) {
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob); link.download=name;
  document.body.append(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}

function libraryPrintType(name) {
  const ext=name.toLowerCase().split('.').pop();
  return new Map([['pdf','application/pdf'],['png','image/png'],['jpg','image/jpeg'],['jpeg','image/jpeg'],['webp','image/webp'],['gif','image/gif'],['txt','text/plain']]).get(ext);
}

async function libraryPrint(win,blob,type,name) {
  if (win.closed) return;
  const doc=win.document;
  doc.title=name; doc.body.replaceChildren();
  if (type==='application/pdf') {
    const url=win.URL.createObjectURL(blob.slice(0,blob.size,type));
    const frame=doc.createElement('iframe');
    frame.title=name; frame.src=url;
    frame.style='position:fixed;inset:0;width:100%;height:100%;border:0';
    doc.body.append(frame); return;
  }
  if (type==='text/plain') {
    const pre=doc.createElement('pre'); pre.style='white-space:pre-wrap;overflow-wrap:anywhere';
    pre.textContent=await blob.text(); doc.body.append(pre);
  } else {
    const img=doc.createElement('img');img.alt=name;img.style='max-width:100%;max-height:95vh;object-fit:contain';
    img.src=win.URL.createObjectURL(blob.slice(0,blob.size,type));
    doc.body.append(img); await img.decode();
  }
  win.focus(); win.print();
}

    const find=s=>root.querySelector(s), status=find('.lib-status'), list=find('.lib-list'), cat=find('.by-category'), tag=find('.by-tag');
    function refreshTags(){

      const prev=tag.value;
      tag.innerHTML='<option value="">全部标签</option>'+options(all);tag.value=prev;
      if(teacher)find('.tag-options').innerHTML=all.map(t=>'<label><input type="checkbox" value="'+esc(t)+'"> '+esc(t)+'</label>').join('');
    }
    function paint(){
      list.replaceChildren();
      const files=catalog.files.filter(f=>(!cat.value||f.category===cat.value)&&(!tag.value||f.tags.includes(tag.value)));
      if(!files.length){list.textContent=catalog.files.length?'当前筛选下没有资料。':'暂时没有已发布的资料。';return;}
      for(const item of files){

        const type=libraryPrintType(item.name);
        row.innerHTML='<div class="t">'+esc(item.name)+'</div><div class="sub">'+esc(item.category)+' · '+(item.size<1024?item.size+' B':Math.ceil(item.size/1024)+' KB')+'</div>'+
          item.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+

        const [save,print]=row.querySelectorAll('button');
        async function open(printing){
          const win=printing && type ? window.open('','_blank') : null;
          if(printing && type && !win){status.textContent='请允许打开打印窗口，或选择保存原文件。';return;}
          if(win){win.opener=null;win.document.body.textContent='正在读取文件…';}
          save.disabled=print.disabled=true;
          try{
            const blob=await libraryBlob(item,check);
            if(win)await libraryPrint(win,blob,type,item.name);
            else librarySave(blob,item.name);
            status.textContent=win&&type==='application/pdf'?'请在 PDF 查看器中选择打印。':printing&&!type?'已下载原文件。请使用支持此格式的应用打开；如该应用支持打印，可在其中选择打印。':'';
          }catch(e){if(win&&!win.closed)win.close();status.textContent=e.message;}

        }catch(e){status.textContent='已发布 '+done+' 份。'+e.message;}
        finally{Array.from(form.elements).forEach(el=>el.disabled=false);}
      };
    }
  }catch(e){if(active())root.textContent=e.message;}
}

/* 删除班级：把班级从教师索引里移除 + 标记 deleted + 关闭该班全部任务。
   云端没有 delete 原语，所以是「写终态标记 + 移出索引」：
   该班不再出现在教师班级列表、学生刷新后任务列表为空、邀请码失效（注册时校验 cls.deleted）。
   历史成绩记录保留在成绩库，便于追溯。 */
function delClass(code) {
  if (!code) return;
  var c = (S.myClasses || []).filter(function (x) { return x.code === code; })[0] || {};
  var n = (c.members || []).length;
  var ok = confirm('删除班级「' + (c.name || code) + '」？\n\n邀请码：' + code + '\n成员：' + n + ' 人\n\n' +
    '删除后：\n· 该班从你的班级列表消失，邀请码立即失效\n· 该班已发布的任务全部关闭，学生无法继续作答\n' +
    '· 学生账号不会被删除（仍可用原代号登录，但需加入其他班级才能看到任务）\n' +
    '· 历史成绩记录保留在成绩库，便于追溯\n\n此操作不可撤销。');
  if (!ok) return;
  var keepCls = $('memCls') ? $('memCls').value : '';
  return CLD.get('class:' + code).then(function (cur) {
    var cc = cur || { code: code, __v: 0 };
    if (cc.deleted) throw new Error('该班级已是删除状态');
    if (String(cc.teacher || '').toLowerCase() !== String(S.me.code).toLowerCase()) {
      throw new Error('只能删除自己创建的班级');
    }
    cc.name = (cc.name || '') + '（已删除）';
    cc.deleted = true;
    cc.delAt = nowStr();
    cc.delBy = S.me.code;
    cc.allowReg = false;
    cc.__v = (cc.__v || 0) + 1;
    return CLD.put('class:' + code, cc).then(function () { return cc; });
  }).then(function (cc) {
    /* 从教师班级索引里移除（loadMyClasses 只读索引，索引里没有就不会显示） */
    return CLD.update('idx:teacher:' + S.me.code, function (cur) {
      var idx = cur || { codes: [], __v: 0 };
      idx.codes = (idx.codes || []).filter(function (x) { return x !== code; });
      idx.__v = (idx.__v || 0) + 1;
      return idx;
    }).then(function () { return cc; });
  }).then(function (cc) {
    /* 关闭该班已发布的任务，避免学生通过旧链接继续作答 */
    return CLD.get('idx:task:' + code).then(function (tidx) {
      var ids = (tidx && tidx.ids) || [];
      if (!ids.length) return cc;
      return Promise.all(ids.map(function (id) {
        return CLD.update('task:' + id, function (cur) {
          var t = cur;
          if (!t) return t;
          t.open = false;
          t.closedByDelClass = true;
          t.__v = (t.__v || 0) + 1;
          return t;
        }).catch(function () {});
      })).then(function () { return cc; });
    });
  }).then(function (cc) {
    setMsg('clsMsg', '班级「' + (cc.name || code) + '」已删除：邀请码 ' + code + ' 失效，该班任务已全部关闭', 'ok');
    return loadMyClasses().then(function () {
      var sel = $('memCls');
      if (sel && keepCls && sel.value !== keepCls) { /* 选中的班级被删时自动落到第一项 */ }
      renderMembers();
      /* 发布任务页的班级下拉也要同步，避免残留已删班级 */
      if ($('tkCls')) { fillTaskSelectors(); renderTasks(); }
    });
  }).catch(function (e) { setMsg('clsMsg', e.message || '删除班级失败', 'err'); });
}

function copyText(t) {

/* ================= 无班级账号管理 =================
   场景：学生注册过（user: 桶里有记录），但不在教师任何一个班级的 members 里。
   典型来源：① 教师删除了班级（delClass 只标记班级，不删账号）；
             ② 学生被移出班级名单；③ 注册时班级写入失败但账号已建。
   发现方式：全局学生索引 idx:students:* 与「本人班级 members 并集」做差集。
   限制（必须如实告知教师）：索引是本版本新增的，之前注册且已无班级的账号不在索引里，
   无法通过前缀枚举找回（云端 list 接口只按精确 userid 查询），
   因此面板提供「按代号直接查询」作为兜底通道。 */
var ORPHAN = { list: [], sel: {} };

function paneOrphan() {

    '<button class="ghost" onclick="orphanScan()">刷新扫描</button>' +
    '<button class="ghost" onclick="orphanBackfill()">从班级名单回填索引</button>' +
    '<button class="ghost" onclick="orphanRecoverClass()">按邀请码找回已删班级成员</button>' +
    '</div><div id="orphanMsg"></div><div id="orphanList" style="margin-top:10px"><div class="empty">正在扫描…</div></div></div>' +
    '<div class="card"><h2>按代号直接查询</h2>' +

    '<label>学习代号</label><input id="orphanCode" placeholder="20240103" inputmode="numeric">' +
    '<button class="ghost" onclick="orphanLookup()">查询并管理该账号</button>' +
    '<div id="orphanOne" style="margin-top:10px"></div></div>';
  orphanScan();

/* 把本人班级 members 里的代号补进全局学生索引（让老账号也能被扫描到） */
function orphanBackfill() {
  setMsg('orphanMsg', '正在从班级名单回填索引…', 'info');
  return loadMyClassList().catch(function () { return []; }).then(function (list) {
    var codes = [];
    (list || []).forEach(function (c) {
      (c.members || []).forEach(function (m) { codes.push(m); });
    });
    if (!codes.length) {
      setMsg('orphanMsg', '你的班级名单里没有成员，无需回填', 'warn');
      return;
    }
    return codes.reduce(function (p, c) {
      return p.then(function () { return idxAddStudent(c); });
    }, Promise.resolve()).then(function () {
      setMsg('orphanMsg', '已回填 ' + codes.length + ' 个成员到学生索引，正在重新扫描…', 'ok');
      return orphanScan();
    });
  }).catch(function (e) {
    setMsg('orphanMsg', e.message || '回填失败', 'err');
  });
}

/* 扫描：索引内全部学生 - 本人班级成员并集 = 无班级账号 */
function orphanScan() {
  var myCls = [];
  return loadMyClassList().catch(function () { return []; }).then(function (list) {
    myCls = list || [];
    /* 缓存到 S.myClasses：「分配到班级」等操作要用它列出可选班级 */
    S.myClasses = myCls;
    var inCls = {};
    myCls.forEach(function (c) {
      (c.members || []).forEach(function (m) { inCls[String(m).toLowerCase()] = c.code; });
    });
    return idxReadStudents().then(function (codes) {
      if (!codes.length) {
        setMsg('orphanMsg', '学生索引为空：本版本之前注册的账号不在索引中。可先点「从班级名单回填索引」，或用下方按代号直接查询。', 'warn');
        setHTML('orphanList', '<div class="empty">暂无可扫描的账号</div>');
        return;
      }
      var cands = codes.filter(function (c) { return !inCls[String(c).toLowerCase()]; });
      if (!cands.length) {
        setMsg('orphanMsg', '索引内 ' + codes.length + ' 个学生账号全部在班级名单中，没有无班级账号。', 'ok');
        setHTML('orphanList', '<div class="empty">没有无班级账号</div>');
        return;
      }
      return Promise.all(cands.map(function (c) { return loadUser(c).catch(function () { return null; }); }))
        .then(function (us) {
          var alive = [];
          us.forEach(function (u) {
            if (!u) return;
            if (u.role !== 'student') return;
            if (u.status === 'deleted') return;
            alive.push(u);
          });
          ORPHAN.list = alive;
          ORPHAN.sel = {};
          setMsg('orphanMsg', '扫描完成：索引内 ' + codes.length + ' 个学生账号，其中 ' + alive.length + ' 个不在你的班级名单里。', alive.length ? 'warn' : 'ok');
          orphanRender();
        });
    });
  }).catch(function (e) {
    setMsg('orphanMsg', e.message || '扫描失败', 'err');
    setHTML('orphanList', '<div class="empty">扫描失败，请重试</div>');
  });
}

function orphanSelCodes() {
  var out = [];
  try {
    Array.prototype.forEach.call(document.querySelectorAll('#orphanList input.orphck:checked'), function (el) {
      var c = el.getAttribute('data-code');
      if (c) out.push(c);
    });
  } catch (e) {}
  return out;
}

function orphanSyncBar() {
  var boxes = document.querySelectorAll('#orphanList input.orphck');
  var total = boxes.length, n = orphanSelCodes().length;
  var info = $('orphanSelInfo');
  if (info) info.innerHTML = n ? ('已选中 <b style="color:#397346">' + n + '</b> / ' + total + ' 个账号') : ('共 ' + total + ' 个无班级账号，勾选后可批量删除');
  var btn = $('orphanBulkBtn');
  if (btn) { btn.disabled = n === 0; btn.textContent = n ? ('批量删除选中（' + n + '）') : '批量删除选中'; }
  var all = $('orphanAll');
  if (all) { all.checked = total > 0 && n === total; all.indeterminate = n > 0 && n < total; }
  return n;
}

function orphanSelAll(on) {
  try {
    Array.prototype.forEach.call(document.querySelectorAll('#orphanList input.orphck'), function (el) { el.checked = !!on; });
  } catch (e) {}
  orphanSyncBar();
}

/* 渲染表格：代号 / 姓名 / 注册时间 / 状态 / 操作 */
function orphanRender() {
  var us = ORPHAN.list || [];
  if (!us.length) {
    setHTML('orphanList', '<div class="empty">没有无班级账号</div>');
    return;
  }
  var h = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px">' +
    '<label style="display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-size:13px;color:#526c5f">' +
    '<input type="checkbox" id="orphanAll" style="width:16px;height:16px;margin:0" onchange="orphanSelAll(this.checked)"> 全选</label>' +
    '<span id="orphanSelInfo" class="sub" style="flex:1;min-width:150px"></span>' +
    '<button class="sm danger" id="orphanBulkBtn" style="margin:0" onclick="orphanBulkDel()" disabled>批量删除选中</button>' +
    '</div>' +
    '<div class="scroll-x"><table><tr><th style="width:34px">选</th><th>学习代号</th><th>姓名</th><th>注册时间</th><th>状态</th><th>操作</th></tr>';
  us.forEach(function (u) {
    h += '<tr><td><input type="checkbox" class="orphck" data-code="' + esc(u.code) + '" style="width:16px;height:16px;margin:0" onchange="orphanSyncBar()"></td>' +
      '<td class="mono">' + esc(u.code) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.at || '—') + '</td>' +
      '<td>' + (u.status === 'disabled' ? '<span class="badge b-red">已停用</span>' : '<span class="badge b-green">正常</span>') + '</td>' +
      '<td><button class="sm ghost" onclick="resetPass(\'' + esc(u.code) + '\')">重置密码</button>' +
      '<button class="sm ghost" onclick="orphanToggle(\'' + esc(u.code) + '\')">' + (u.status === 'disabled' ? '启用' : '停用') + '</button>' +
      '<button class="sm ghost" onclick="orphanAssign(\'' + esc(u.code) + '\')">分配到班级</button>' +
      '<button class="sm danger" onclick="orphanDelOne(\'' + esc(u.code) + '\')">删除账号</button></td></tr>';
  });
  h += '</table></div>';
  setHTML('orphanList', h);
  orphanSyncBar();
}

/* ---------- 无班级账号：操作实现 ---------- */

/* 按邀请码找回已删班级的成员：
   delClass 只把班级标记 deleted，members 数组仍留在 class:<邀请码> 桶里，
   所以只要记得邀请码，就能把这些代号补回学生索引，从而出现在「无班级账号」列表里。
   这是本版本之前注册的老账号唯一的可恢复通道（云端没有前缀枚举接口）。 */
function orphanRecoverClass() {
  var ic = prompt('输入已删班级的邀请码（如 DCAB2CD），把该班成员补回扫描索引：');
  if (!ic) return;
  ic = codeUpper(ic);
  if (!ic) { setMsg('orphanMsg', '邀请码格式不对', 'err'); return; }
  setMsg('orphanMsg', '正在读取班级 ' + ic + ' 的成员名单…', 'info');
  return CLD.get('class:' + ic).then(function (c) {
    if (!c) throw new Error('找不到邀请码为 ' + ic + ' 的班级记录');
    if (String(c.teacher || '').toLowerCase() !== String(S.me.code).toLowerCase()) {
      throw new Error('该班级不属于你，不能操作');
    }
    var mem = c.members || [];
    if (!mem.length) throw new Error('该班级成员名单为空');
    return mem.reduce(function (p, m) {
      return p.then(function () { return idxAddStudent(m); });
    }, Promise.resolve()).then(function () {
      setMsg('orphanMsg', '已把班级「' + (c.name || ic) + '」的 ' + mem.length + ' 个成员补回索引，正在重新扫描…', 'ok');
      return orphanScan();
    });
  }).catch(function (e) {
    setMsg('orphanMsg', e.message || '找回失败', 'err');
  });
}

/* 停用 / 启用 */
function orphanToggle(code) {
  loadUser(code).then(function (u) {
    if (!u) throw new Error('账号不存在');
    u.status = u.status === 'disabled' ? 'active' : 'disabled';
    return saveUser(u);
  }).then(function () { return orphanScan(); })
    .catch(function (e) { setMsg('orphanMsg', e.message || '操作失败', 'err'); });
}

/* 分配到某个班级：同时补 members 与账号 cls 字段，并登记索引 */
function orphanAssign(code) {
  var list = S.myClasses || [];
  if (!list.length) { setMsg('orphanMsg', '你还没有班级，请先到「班级」页新建班级', 'err'); return; }
  var names = list.map(function (c, i) { return (i + 1) + '. ' + c.name + '（' + c.code + '）'; }).join('\n');
  var pick = prompt('把 ' + code + ' 分配到哪个班级？输入序号：\n' + names);
  if (!pick) return;
  var idx = parseInt(String(pick).replace(/[^0-9]/g, ''), 10) - 1;
  var target = list[idx];
  if (!target) { setMsg('orphanMsg', '序号无效', 'err'); return; }
  setMsg('orphanMsg', '正在把 ' + code + ' 加入 ' + target.name + '…', 'info');
  return loadUser(code).then(function (u) {
    if (!u) throw new Error('账号不存在');
    if (u.status === 'deleted') throw new Error('该账号已删除，不能分配班级');
    return CLD.get('class:' + target.code).then(function (c) {
      if (!c || c.deleted) throw new Error('班级不存在或已删除');
      return CLD.setMember(target.code, code, true);
    }).then(function () {
      var old = u.cls;
      u.cls = target.code;
      return saveUser(u).then(function () {
        if (old && old !== target.code) return CLD.setMember(old, code, false);
      });
    }).then(function () { return idxAddStudent(code); });
  }).then(function () {
    setMsg('orphanMsg', code + ' 已加入 ' + target.name + '，正在重新扫描…', 'ok');
    return orphanScan();
  }).catch(function (e) { setMsg('orphanMsg', e.message || '分配失败', 'err'); });
}

/* 单个删除（复用 delUser 的终态写法，但保留当前面板上下文） */
function orphanDelOne(code) {
  if (!confirm('删除账号 ' + code + '？\n\n删除后该账号立即无法登录，密码与姓名被清除。\n学习代号会被释放，可用同一代号重新注册。\n此操作不可撤销。')) return;
  setMsg('orphanMsg', '正在删除 ' + code + '…', 'info');
  return bulkDelOne(code, S.myClasses || []).then(function (r) {
    if (r && r.ok) { setMsg('orphanMsg', '账号 ' + code + ' 已删除', 'ok'); return orphanScan(); }
    setMsg('orphanMsg', (r && r.why) || '删除失败', 'err');
  }).catch(function (e) { setMsg('orphanMsg', e.message || '删除失败', 'err'); });
}

/* 批量删除 */
function orphanBulkDel() {
  var codes = orphanSelCodes();
  if (!codes.length) { setMsg('orphanMsg', '请先勾选要删除的账号', 'err'); return; }
  var ok = confirm('批量删除 ' + codes.length + ' 个无班级账号？\n\n' + codes.join('、') + '\n\n删除后立即无法登录，密码与姓名被清除，学习代号会被释放。\n此操作不可撤销（历史作答记录仍保留在成绩库，便于追溯）。');
  if (!ok) return;
  var btn = $('orphanBulkBtn');
  if (btn) { btn.disabled = true; btn.textContent = '正在删除…'; }
  setMsg('orphanMsg', '正在批量删除 ' + codes.length + ' 个账号，请勿关闭页面…', 'info');
  var done = [], skip = [], fail = [];
  codes.reduce(function (p, code) {
    return p.then(function () {
      return bulkDelOne(code, S.myClasses || []).then(function (r) {
        if (r && r.ok) done.push(code);
        else if (r && r.why) skip.push(code + '（' + r.why + '）');
        else fail.push(code);
      }).catch(function () { fail.push(code); });
    });
  }, Promise.resolve()).then(function () {
    var txt = '删除完成：成功 ' + done.length + ' 个';
    if (skip.length) txt += '；跳过 ' + skip.length + ' 个（' + skip.join('、') + '）';
    if (fail.length) txt += '；失败 ' + fail.length + ' 个（' + fail.join('、') + '）';
    setMsg('orphanMsg', txt, fail.length ? 'err' : 'ok');
    return orphanScan();
  });
}

/* 按代号直接查询：用于索引里没有的历史账号 */
function orphanLookup() {
  var code = ($('orphanCode') ? $('orphanCode').value : '').trim();
  if (!code) { setMsg('orphanMsg', '请输入学习代号', 'err'); return; }
  setHTML('orphanOne', '<div class="empty">查询中…</div>');
  return loadUser(code).then(function (u) {
    if (!u) {
      setHTML('orphanOne', '<div class="msg m-err">没有找到代号 ' + esc(code) + ' 的账号</div>');
      return;
    }
    var inCls = '';
    (S.myClasses || []).forEach(function (c) {
      if ((c.members || []).some(function (m) { return String(m).toLowerCase() === String(code).toLowerCase(); })) inCls = c.name + '（' + c.code + '）';
    });
    var st = u.status === 'deleted' ? '<span class="badge b-red">已删除</span>'
      : (u.status === 'disabled' ? '<span class="badge b-red">已停用</span>' : '<span class="badge b-green">正常</span>');
    var h = '<div class="item"><div class="t mono">' + esc(u.code) + ' ' + st + '</div>' +
      '<div class="d">姓名：' + esc(u.name) + ' · 角色：' + esc(u.role === 'teacher' ? '教师' : '学生') + '</div>' +
      '<div class="d">注册时间：' + esc(u.at || '—') + '</div>' +
      '<div class="d">当前班级：' + (inCls ? esc(inCls) : '<b style="color:#397346">不在你的任何班级中</b>') + '</div>';
    if (u.status !== 'deleted' && u.role === 'student') {
      h += '<div style="margin-top:8px">' +
        '<button class="sm ghost" onclick="resetPass(\'' + esc(u.code) + '\')">重置密码</button>' +
        '<button class="sm ghost" onclick="orphanToggle(\'' + esc(u.code) + '\')">' + (u.status === 'disabled' ? '启用' : '停用') + '</button>' +
        (inCls ? '' : '<button class="sm ghost" onclick="orphanAssign(\'' + esc(u.code) + '\')">分配到班级</button>') +
        '<button class="sm danger" onclick="orphanDelOne(\'' + esc(u.code) + '\')">删除账号</button></div>';
    }
    h += '</div>';
    setHTML('orphanOne', h);
  }).catch(function (e) {
    setHTML('orphanOne', '<div class="msg m-err">' + esc(e.message || '查询失败') + '</div>');
  });
}

function resetPass(code) {
  var np = prompt('为 ' + code + ' 设置新密码（至少 6 位）');
  if (!np) return;
  if (np.length < 6) { alert('密码至少 6 位'); return; }
  loadUser(code).then(function (u) {
    if (!u) throw new Error('账号不存在');
    var salt = CLD.rnd(16);
    return hashPass(np, salt).then(function (h) {
      u.salt = salt; u.hash = h;
      u.pwAt = CLD.rnd(32);
      return saveUser(u);
    });
  }).then(function () { alert('密码已重置'); })
    .catch(function (e) { alert(e.message || '重置失败'); });
}

function toggleUser(code) {
  loadUser(code).then(function (u) {
    if (!u) throw new Error('账号不存在');
    u.status = u.status === 'disabled' ? 'active' : 'disabled';
    return saveUser(u);
  }).then(function () { renderMembers(); })
    .catch(function (e) { alert(e.message || '操作失败'); });
}

/* 取出当前教师名下全部班级（用于删除账号时同步移出名单） */
function loadMyClassList() {
  return CLD.get('idx:teacher:' + S.me.code).then(function (idx) {
    var codes = (idx && idx.codes) || [];
    if (!codes.length) return [];
    return Promise.all(codes.map(function (c) { return CLD.get('class:' + c); }))
      .then(function (arr) { return arr.filter(Boolean); });
  });
}

/* 把某个学习代号从班级成员名单里移除。
   extraCls：学生自己记录里所在的邀请码 —— 必须单独带上，
   因为老师删除班级后该班已不在教师索引里，loadMyClassList() 拿不到它，
   只靠索引会漏掉「班级已删 + 学生账号后删」这种组合场景。 */
function removeFromClasses(code, extraCls) {
  var low = String(code || '').trim().toLowerCase();
  return loadMyClassList().then(function (list) {
    var codes = list.map(function (c) { return c.code; });
    if (extraCls && codes.indexOf(extraCls) < 0) codes.push(extraCls);
    return codes.reduce(function (p, cc) {
      return p.then(function () {
        return CLD.get('class:' + cc).then(function (cur) {
          if (!cur) return;
          var mem = cur.members || [];
          var has = mem.some(function (m) { return String(m).toLowerCase() === low; });
          if (!has) return;
          return CLD.setMember(cc, low, false);
        });
      });
    }, Promise.resolve());
  });
}

/* 后台彻底删除账号：擦除密码与身份信息 + 标记 deleted + 移出班级名单。
   云端存储只有 put/get（没有 delete 接口），所以「删除」= 写入一条已擦除的终态记录：
   该记录无法登录、无法恢复会话、不在名单中显示，等同账号被销毁。 */
function delUser(code) {
  if (!code) return;
  var ok = confirm('删除账号 ' + code + ' ？\n\n删除后该账号立即无法登录，密码与姓名被清除，并从班级名单中移除。\n' +
    '删除后这个学习代号（' + code + '）会被释放，可以用同一代号重新注册并设置新密码。\n' +
    '此操作不可撤销（历史作答记录仍保留在成绩库中，便于追溯）。');
  if (!ok) return;
  var keepCls = $('memCls') ? $('memCls').value : '';
  /* 先记下学生原来所在的邀请码：清空 u.cls 之前必须留存，
     否则「班级已被删除」时该班不在教师索引里，成员名单会清不掉 */
  var oldCls = '';
  return loadUser(code).then(function (u) {
    if (!u) throw new Error('账号不存在');
    if (u.status === 'deleted') throw new Error('该账号已是删除状态');
    oldCls = u.cls || '';
    /* 自身账号判断放最前：即使将来放开教师账号删除，也永远不能删掉自己 */
    if (String(u.code).toLowerCase() === String(S.me.code).toLowerCase()) throw new Error('不能删除当前登录的账号');
    if (u.role === 'teacher') throw new Error('教师账号不支持在这里删除');
    u.name = '（已删除）';
    u.salt = '';
    u.hash = '';
    u.cls = '';
    /* 清掉密码变更时间戳：restoreSession 会比较 sess.pwAt 与 u.pwAt，
       两边都为空串才视为“未重置过密码”，这里清空后旧会话必然失效 */
    u.pwAt = '';
    u.status = 'deleted';
    u.delAt = nowStr();
    u.deletedAt = nowStr();
    u.delBy = S.me.code;
    /* 释放代号：注册时 doReg 遇到 status==='deleted' 会视为可覆盖，允许同代号重新注册 */
    u.codeFreed = true;
    u.__v = (u.__v || 0) + 1;
    u.upd = nowStr();
    /* 删除也要回读校验：终态没落盘 = 删除没生效、代号没释放 */
    return CLD.putVerified(userBucket(u.code), u, ['code', 'status', 'salt', 'hash', 'name', 'cls']).then(function () { return u; });
  }).then(function (u) {
    /* 同步移出全局学生索引，避免已删账号被当成「无班级账号」再次列出 */
    return idxRemoveStudent(u.code).then(function () { return u; });
  }).then(function (u) {
    return removeFromClasses(u.code, oldCls).then(function () { return u; });
  }).then(function (u) {
    setMsg('clsMsg', '账号 ' + u.code + ' 已删除：无法登录、已移出班级名单', 'ok');
    /* 刷新班级卡片人数，但保住当前选中的班级（避免下拉框跳回第一个） */
    return loadMyClasses().then(function () {
      var sel = $('memCls');
      if (sel && keepCls) { sel.value = keepCls; }
      renderMembers();
    });
  }).catch(function (e) { alert(e.message || '删除失败'); });
}


/* ================= 批量删除学生账号 =================
   设计说明：
   - 单个删除仍走 delUser（带一次确认），本段是独立的批量通道，不修改 delUser 任何一行；
   - 批量删除只弹一次确认，内部逐个复用同一套「擦除 + 标记 deleted + 移出班级名单」逻辑；
   - 班级列表只拉一次（loadMyClassList），避免 30 个学生触发 30×N 次重复请求；
   - 教师账号、当前登录账号、已删除账号自动跳过，并在结果里逐条说明原因。 */

/* 读取当前表格里被勾选的账号代号 */
function memSelCodes() {
  var out = [];
  try {
    Array.prototype.forEach.call(document.querySelectorAll('#memList input.memck:checked'), function (el) {
      var c = el.getAttribute('data-code');
      if (c) out.push(c);
    });
  } catch (e) {}
  return out;
}

/* 同步工具栏：选中数量、批量按钮可用性、全选框状态 */
function memSyncBar() {
  var boxes = document.querySelectorAll('#memList input.memck');
  var total = boxes.length;
  var picked = memSelCodes();
  var n = picked.length;
  var info = $('memSelInfo');
  if (info) {
    info.innerHTML = n
      ? ('已选中 <b style="color:#397346">' + n + '</b> / ' + total + ' 个账号')
      : ('共 ' + total + ' 个账号，勾选后可批量删除');
  }
  var btn = $('memBulkBtn');
  if (btn) {
    btn.disabled = n === 0;
    btn.textContent = n ? ('批量删除选中（' + n + '）') : '批量删除选中';
  }
  var all = $('memAll');
  if (all) {
    all.checked = total > 0 && n === total;
    all.indeterminate = n > 0 && n < total;
  }
  return n;
}

/* 全选 / 取消全选 */
function memSelAll(on) {
  try {
    Array.prototype.forEach.call(document.querySelectorAll('#memList input.memck'), function (el) {
      el.checked = !!on;
    });
  } catch (e) {}
  memSyncBar();
}

/* 把某个代号从「给定班级列表 + 学生原邀请码」中移除（批量版，不重复拉列表） */
function bulkRemoveFromClasses(low, extraCls, preList) {
  var codes = (preList || []).map(function (c) { return c.code; });
  if (extraCls && codes.indexOf(extraCls) < 0) codes.push(extraCls);
  return codes.reduce(function (p, cc) {
    return p.then(function () {
      return CLD.get('class:' + cc).then(function (cur) {
        if (!cur) return;
        var mem = cur.members || [];
        var has = mem.some(function (m) { return String(m).toLowerCase() === low; });
        if (!has) return;
        return CLD.setMember(cc, low, false);
      });
    });
  }, Promise.resolve());
}

/* 批量删除单个账号：与 delUser 完全一致的终态写法，但用传入的班级列表 */
function bulkDelOne(code, clsList) {
  var low = String(code || '').trim().toLowerCase();
  if (!low) return Promise.resolve({ ok: false, why: '代号为空' });
  var oldCls = '';
  return loadUser(code).then(function (u) {
    if (!u) return { ok: false, why: '账号不存在' };
    if (u.status === 'deleted') return { ok: false, why: '已是删除状态' };
    if (String(u.code).toLowerCase() === String(S.me.code).toLowerCase()) return { ok: false, why: '不能删除当前登录账号' };
    if (u.role === 'teacher') return { ok: false, why: '教师账号不支持删除' };
    oldCls = u.cls || '';
    u.name = '（已删除）';
    u.salt = '';
    u.hash = '';
    u.cls = '';
    u.pwAt = '';
    u.status = 'deleted';
    u.delAt = nowStr();
    u.deletedAt = nowStr();
    u.delBy = S.me.code;
    u.codeFreed = true;
    u.__v = (u.__v || 0) + 1;
    u.upd = nowStr();
    return CLD.putVerified(userBucket(u.code), u, ['code', 'status', 'salt', 'hash', 'name', 'cls']).then(function () {
      return idxRemoveStudent(u.code).then(function () {
        return bulkRemoveFromClasses(low, oldCls, clsList).then(function () { return { ok: true }; });
      });
    });
  });
}

/* 批量删除入口：一次确认，逐个删除，结束后汇总成功/跳过/失败 */
function bulkDelUsers() {
  var codes = memSelCodes();
  if (!codes.length) { setMsg('clsMsg', '请先勾选要删除的账号', 'err'); return; }
  var keepCls = $('memCls') ? $('memCls').value : '';
  var ok = confirm('批量删除 ' + codes.length + ' 个学生账号？\n\n' + codes.join('、') + '\n\n' +
    '删除后这些账号立即无法登录，密码与姓名被清除，并从班级名单中移除。\n' +
    '学习代号会被释放，可以用同一代号重新注册并设置新密码。\n' +
    '此操作不可撤销（历史作答记录仍保留在成绩库中，便于追溯）。');
  if (!ok) return;
  var btn = $('memBulkBtn');
  if (btn) { btn.disabled = true; btn.textContent = '正在删除…'; }
  setMsg('clsMsg', '正在批量删除 ' + codes.length + ' 个账号，请勿关闭页面…', 'info');
  var done = [], skip = [], fail = [];
  loadMyClassList().catch(function () { return []; }).then(function (list) {
    return codes.reduce(function (p, code) {
      return p.then(function () {
        return bulkDelOne(code, list).then(function (r) {
          if (r && r.ok) done.push(code);
          else skip.push(code + '（' + ((r && r.why) || '跳过') + '）');
        }).catch(function (e) {
          fail.push(code + '（' + (e.message || '失败') + '）');
        });
      });
    }, Promise.resolve());
  }).then(function () {
    var msg = '批量删除完成：成功 ' + done.length + ' 个';
    if (skip.length) msg += '；跳过 ' + skip.length + ' 个：' + skip.join('、');
    if (fail.length) msg += '；失败 ' + fail.length + ' 个：' + fail.join('、');
    setMsg('clsMsg', msg, fail.length ? 'warn' : 'ok');
    return loadMyClasses().then(function () {
      var sel = $('memCls');
      if (sel && keepCls) sel.value = keepCls;
      renderMembers();
    });
  }).catch(function (e) {
    setMsg('clsMsg', e.message || '批量删除失败', 'err');
    renderMembers();
  });
}

/* ===== 题库选中记忆（修复：删除题目/题库后不再跳回第一个题库） =====
   1) 选中项实时写入 localStorage，刷新页面也回到上次编辑的题库；
   2) loadBanks 重建 option 后按「原选中 > 上次记忆 > 第一个」顺序恢复。 */
var BANK_PREF_KEY = 'df.bank.pref';
function bankPref() {
  try { return localStorage.getItem(BANK_PREF_KEY) || ''; } catch (e) { return ''; }
}
function setBankPref(id) {
  try {
    if (id) localStorage.setItem(BANK_PREF_KEY, id);
    else localStorage.removeItem(BANK_PREF_KEY);
  } catch (e) {}
}
function bankHas(id) {
  return (S.banks || []).some(function (b) { return b.id === id; });
}
/* 手动切换题库下拉框：记住选择并重绘题目列表 */
function onBankChange() {
  var sel = $('qBank');
  if (sel && sel.value) setBankPref(sel.value);
  renderQList();
}
/* 从题库卡片上「打开此题库编辑」：直接切到该题库 */
function openBank(id) {
  if (!id) return;
  setBankPref(id);
  var sel = $('qBank');
  if (sel) sel.value = id;
  renderQList();paintBankPicker();
  var box = $('qMsg');
  if (box && box.scrollIntoView) { try { box.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
}

function loadBanks() {
  return CLD.get('idx:bank:' + S.me.code).then(function (idx) {
    var ids = (idx && idx.ids) || [];
    if (!ids.length) return [];
    return Promise.all(ids.map(function (i) { return CLD.get('bank:' + i); }))
      .then(function (l) { return l.filter(Boolean); });
  }).then(function (list) {
    S.banks = list;
    var h = '';
    if (!list.length) h = '<div class="empty">还没有题库</div>';
    list.forEach(function (b) {
      h += '<div class="item"><div class="t">' + esc(b.name) + '</div>' +
        '<div class="d">' + (b.mode==='exam'?'试卷 · ':'背诵题库 · ') + (b.items || []).length + ' 道题 · 创建于 ' + esc(b.at || '') + '</div>' +
        '<div style="margin-top:8px">' +
        '<button class="sm ghost" onclick="exportBank(\'' + esc(b.id) + '\')">导出 JSON</button>' +
        '<button class="sm ghost" onclick="exportBankCSV(\'' + esc(b.id) + '\')">导出 CSV</button>' +
        '<button class="sm ghost" onclick="openBank(\'' + esc(b.id) + '\')">打开此题库编辑</button>' +
        '<button class="sm danger" onclick="delBank(\'' + esc(b.id) + '\')">删除</button>' +
        '</div><div id="bankPractice_' + esc(b.id) + '"></div></div>';
    });
    if ($('bankList')) $('bankList').innerHTML = h;
    /* 修复：重建 option 前先记住当前选中项，重建后按「原选中 > 上次记忆 > 第一个」恢复，
       否则浏览器会把 select 重置为第一项（删除题目/题库后被拉回默认题库的根因） */
    var sel = $('qBank');
    if (sel) {
      var keep = sel.value || '';
      var wanted = (keep && list.some(function (b) { return b.id === keep; })) ? keep : bankPref();
      sel.innerHTML = list.map(function (b) {
        return '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>';
      }).join('');
      if (wanted && list.some(function (b) { return b.id === wanted; })) {
        sel.value = wanted;
      } else if (list.length) {
        sel.value = list[0].id;
      }
      if (sel.value) setBankPref(sel.value);
      else setBankPref('');
    }
    paintBankPicker();paintPracticeControls();
    return list;
  }).catch(function () {
    if ($('bankList')) $('bankList').innerHTML = '<div class="empty">题库加载失败</div>';
    return [];
  });
}

function addBank() {
  var name = ($('bkName').value || '').trim();
  if (!name) { setMsg('bkMsg', '请填写题库名称', 'err'); return; }
  var id = newId(14);
  var b = { id: id, name: name, mode: $('bkMode')&&$('bkMode').value==='exam'?'exam':'recitation', items: [], owner: S.me.code, at: nowStr(), __v: 1 };
  return CLD.put('bank:' + id, b).then(function () {
    return CLD.update('idx:bank:' + S.me.code, function (cur) {
      var idx = cur || { ids: [], __v: 0 };
      if (idx.ids.indexOf(id) < 0) idx.ids.push(id);
      idx.__v = (idx.__v || 0) + 1;
      return idx;
    });
  }).then(function () {
    $('bkName').value = '';
    setMsg('bkMsg', '题库已创建', 'ok');
    return loadBanks();
  }).then(function () { renderQList(); })
    .catch(function (e) { setMsg('bkMsg', e.message || '创建失败', 'err'); });
}

function delBank(id) {
  if (!confirm('删除该题库？（已发布任务的作答记录仍会保留当时的评分依据）')) return;
  /* 删除前先算出相邻题库：删除后优先落到它的下一个（没有则上一个），避免被拉回第一个题库 */
  var list = S.banks || [];
  var pos = -1, i;
  for (i = 0; i < list.length; i++) { if (list[i].id === id) { pos = i; break; } }
  var nextId = '';
  if (pos >= 0) {
    if (pos + 1 < list.length) nextId = list[pos + 1].id;
    else if (pos - 1 >= 0) nextId = list[pos - 1].id;
  }
  setBankPref(nextId);
  return CLD.get('practice:'+id).then(function(p){
    if(!p||!p.enabled)return;
    return CLD.update('practice:'+id,function(cur){if(cur.owner!==S.me.code)throw Error('无权下架闯关');cur.enabled=false;cur.updatedAt=nowStr();cur.__v=(cur.__v||0)+1;return cur;});
  }).then(function(){return CLD.update('idx:bank:' + S.me.code, function (cur) {
    var idx = cur || { ids: [], __v: 0 };
    idx.ids = (idx.ids || []).filter(function (x) { return x !== id; });
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  });}).then(function () {
    var sel = $('qBank');
    if (sel) sel.value = '';           /* 清掉已失效的选中值，让 loadBanks 走记忆分支 */
    return loadBanks();
  })
    .then(function () {
      if (nextId && bankHas(nextId)) setBankPref(nextId);
      renderQList();
    })
    .catch(function (e) { setMsg('bkMsg', e.message || '删除失败', 'err'); });
}

function parsePoints(txt) {
  return String(txt || '').split(/\n+/).map(function (s) { return s.trim(); })
    .filter(Boolean).map(function (line) {
      return line.split('|').map(function (x) { return x.trim(); }).filter(Boolean);
    });
}

function parseTerms(txt) {
  return String(txt || '').split(/[,，、\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function addQuestion() {
  var bid = $('qBank') ? $('qBank').value : '';
  if (!bid) { setMsg('qMsg', '请先创建并选择题库', 'err'); return; }
  var q = ($('qQ').value || '').trim();
  var a = ($('qA').value || '').trim();
  if (!q) { setMsg('qMsg', '请填写题目', 'err'); return; }
  if (!a) { setMsg('qMsg', '请填写标准答案', 'err'); return; }
  var pts = parsePoints($('qP').value);
  var terms = parseTerms($('qT').value);
  if (!pts.length) { setMsg('qMsg', '请至少填写一个评分要点', 'err'); return; }
  var item = { qid: newId(10), q: q, a: a, points: pts, terms: terms };
  return CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = b.items || [];
    b.items.push(item);
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    $('qQ').value = ''; $('qA').value = ''; $('qP').value = ''; $('qT').value = '';
    setMsg('qMsg', '题目已添加', 'ok');
    return loadBanks();
  }).then(function () { renderQList(); })
    .catch(function (e) { setMsg('qMsg', e.message || '添加失败', 'err'); });
}

/* ===== 题目多选删除（Q_SEL 按题库 id 分别记录勾选的 qid） ===== */
var Q_SEL = {};
var Q_TIP = '';
function qSelBox(bid) {
  if (!Q_SEL[bid]) Q_SEL[bid] = {};
  return Q_SEL[bid];
}
function qSelIds(bid) {
  var m = Q_SEL[bid] || {};
  return Object.keys(m).filter(function (k) { return m[k]; });
}
function toggleQSel(bid, qid) {
  var m = qSelBox(bid);
  if (m[qid]) delete m[qid]; else m[qid] = true;
  qSelSync(bid);
}
function qSelSetAll(bid, mode) {
  var b = (S.banks || []).filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var items = b.items || [];
  if (mode === 'none') { Q_SEL[bid] = {}; }
  else {
    var m = qSelBox(bid);
    items.forEach(function (it) {
      if (mode === 'all') m[it.qid] = true;
      else if (m[it.qid]) delete m[it.qid];
      else m[it.qid] = true;
    });
  }
  renderQList();
}
/* 只同步计数与勾选态，不重绘列表（避免点一下整块闪动） */
function qSelSync(bid) {
  var n = qSelIds(bid).length;
  var cnt = $('qSelCnt');
  if (cnt) cnt.innerHTML = n ? ('已选 <b style="color:#397346">' + n + '</b> 道') : '未选择题目';
  var btn = $('qDelSelBtn');
  if (btn) btn.disabled = !n;
  var b = (S.banks || []).filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var m = Q_SEL[bid] || {};
  (b.items || []).forEach(function (it) {
    var cb = $('qcb_' + it.qid);
    if (cb) cb.checked = !!m[it.qid];
  });
}
function renderQList() {
  syncBankMode();
  var bid = $('qBank') ? $('qBank').value : '';
  if (!bid || !S.banks) return;
  var b = S.banks.filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var items = b.items || [];
  /* 清掉已不存在题目的残留勾选 */
  var exist = {};
  items.forEach(function (it) { exist[it.qid] = true; });
  var m = qSelBox(bid);
  Object.keys(m).forEach(function (k) { if (!exist[k]) delete m[k]; });
  var tip = Q_TIP;
  Q_TIP = '';
  if (!items.length) {
    Q_SEL[bid] = {};
    setHTML('qMsg', (tip ? '<div class="msg m-ok">' + esc(tip) + '</div>' : '') + '<div class="msg m-info">该题库还没有题目</div>');
    return;
  }
  var h = (tip ? '<div class="msg m-ok">' + esc(tip) + '</div>' : '') +
    '<div class="msg m-info">当前题库共 ' + items.length + ' 道题，可勾选多道后一次性删除</div>' +
    '<div class="row" style="margin-bottom:10px;align-items:center">' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'all\')">全选</button>' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'none\')">取消全选</button>' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'inv\')">反选</button>' +
    '<button class="sm danger" id="qDelSelBtn" onclick="delSelectedQuestions(\'' + esc(bid) + '\')">删除选中</button>' +
    '<div class="d" id="qSelCnt" style="flex:1;min-width:96px;text-align:right">未选择题目</div>' +
    '</div>';
  items.forEach(function (it, i) {
    h += '<div class="item"><div style="display:flex;gap:9px;align-items:flex-start">' +
      '<input type="checkbox" id="qcb_' + esc(it.qid) + '" style="width:20px;height:20px;flex:0 0 auto;margin-top:3px;accent-color:#ffc93c;cursor:pointer" ' +
      (m[it.qid] ? 'checked ' : '') +
      'onchange="toggleQSel(\'' + esc(bid) + '\',\'' + esc(it.qid) + '\')">' +
      '<div style="flex:1;min-width:0">' +
      '<div class="t">' + (i + 1) + '. ' + esc(it.q) + '</div>' + (isExamQuestion(it)?'<div class="badge b-gold">'+examQuestionLabel(it)+' · '+questionMax(it)+'分</div>'+examOptionsHtml(it):'') +
      '<div class="d">答案：' + esc(it.a) + '</div>' +
      '<div class="d">要点：' + (it.points || []).map(function (pt) {
        return '<span class="tag">' + esc(pt.join('/')) + '</span>';
      }).join('') + '</div>' +
      (it.terms && it.terms.length ? '<div class="d">术语：' + it.terms.map(function (t) {
        return '<span class="tag term">' + esc(t) + '</span>';
      }).join('') + '</div>' : '') +
      '</div></div>' +
      '<button class="sm danger" style="margin-top:8px" onclick="delQuestion(\'' + esc(bid) + '\',\'' + esc(it.qid) + '\')">删除此题</button></div>';
  });
  setHTML('qMsg', h);
  qSelSync(bid);
}
/* 批量删除：一次 CLD.update 内过滤，保证题目列表原子替换，且删除后仍停在原题库 */
function delSelectedQuestions(bid) {
  var ids = qSelIds(bid);
  if (!ids.length) { Q_TIP = ''; renderQList(); return; }
  if (!confirm('确认删除选中的 ' + ids.length + ' 道题？此操作不可恢复，建议先导出 JSON 备份。')) return;
  var drop = {};
  ids.forEach(function (k) { drop[k] = true; });
  setBankPref(bid);
  var btn = $('qDelSelBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '删除中…'; }
  CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = (b.items || []).filter(function (x) { return !drop[x.qid]; });
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    Q_SEL[bid] = {};
    var sel = $('qBank');
    if (sel && bankHas(bid)) sel.value = bid;
    return loadBanks();
  }).then(function () {
    var sel2 = $('qBank');
    if (sel2 && bankHas(bid)) { sel2.value = bid; setBankPref(bid); }
    Q_TIP = '已删除 ' + ids.length + ' 道题';
    renderQList();
  }).catch(function (e) {
    var btn2 = $('qDelSelBtn');
    if (btn2) { btn2.disabled = false; btn2.innerHTML = '删除选中'; }
    setMsg('qMsg', e.message || '批量删除失败', 'err');
  });
}

function delQuestion(bid, qid) {
  /* 修复：删除题目后必须停在同一题库（原来 loadBanks 重建下拉框会跳回第一个题库） */
  setBankPref(bid);
  CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = (b.items || []).filter(function (x) { return x.qid !== qid; });
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    var sel = $('qBank');
    if (sel && bankHas(bid)) sel.value = bid;
    return loadBanks();
  })
    .then(function () {
      var sel2 = $('qBank');
      if (sel2 && bankHas(bid)) { sel2.value = bid; setBankPref(bid); }
      renderQList();
    })
    .catch(function (e) { setMsg('qMsg', e.message || '删除失败', 'err'); });
}

/* ---------- 导入 ---------- */
function parseCSVLine(line) {
  var out = [], cur = '', q = false, i, c;
  for (i = 0; i < line.length; i++) {
    c = line[i];
    if (q) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

/* 导入字段清洗：剔除空要点与空同义表达，限制类型与长度 */
var IMP_LIMIT = { q: 500, a: 2000, point: 200, term: 60, terms: 30 };
function cleanGroup(p) {
  var arr = Array.isArray(p) ? p : String(p == null ? '' : p).split('|');
  var out = [];
  arr.forEach(function (x) {
    var s = String(x == null ? '' : x).trim();
    if (s) out.push(s.slice(0, IMP_LIMIT.point));
  });
  return out;
}
function cleanPoints(list, fallbackA) {
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function (p) {
    var g = cleanGroup(p);
    if (g.length) out.push(g);
  });
  if (!out.length) out = [[String(fallbackA == null ? '' : fallbackA)]];
  return out;
}
function cleanTerms(list) {
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function (t) {
    var s = String(t == null ? '' : t).trim();
    if (s) out.push(s.slice(0, IMP_LIMIT.term));
  });
  return out.slice(0, IMP_LIMIT.terms);
}

function buildImport() {
  var fmt = $('impFmt').value;
  var raw = $('impText').value.trim();
  var errors = [], items = [];
  if (!raw) return { errors: ['内容为空'], items: [] };

  if (fmt === 'json') {
    var arr;
    try { arr = JSON.parse(raw); }
    catch (e) { return { errors: ['JSON 格式错误：' + e.message], items: [] }; }
    if (!Array.isArray(arr)) return { errors: ['JSON 顶层必须是数组 [...]'], items: [] };
    arr.forEach(function (o, i) {
      var row = i + 1;
      if (!o || typeof o !== 'object') { errors.push('第 ' + row + ' 条不是对象'); return; }
      var q = String(o.q || o.question || '').trim().slice(0, IMP_LIMIT.q);
      var a = String(o.a || o.answer || '').trim().slice(0, IMP_LIMIT.a);
      if (!q) { errors.push('第 ' + row + ' 条缺少题目 q'); return; }
      if (!a) { errors.push('第 ' + row + ' 条缺少标准答案 a'); return; }
      var pts = cleanPoints(o.points, a);
      var terms = cleanTerms(Array.isArray(o.terms) ? o.terms : parseTerms(o.terms));
      items.push({ qid: newId(10), q: q, a: a, points: pts, terms: terms });
    });
  } else {
    var lines = raw.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return { errors: ['内容为空'], items: [] };
    var head = parseCSVLine(lines[0]).map(function (h) { return h.trim().toLowerCase(); });
    var iq = head.indexOf('q'), ia = head.indexOf('a'), ip = head.indexOf('points'), it = head.indexOf('terms');
    if (iq < 0 || ia < 0) {
      return { errors: ['CSV 首行必须是表头，且包含 q 和 a 两列（可用 points、terms 列）'], items: [] };
    }
    lines.slice(1).forEach(function (line, idx) {
      var row = idx + 2;
      var cells = parseCSVLine(line);
      var q = (cells[iq] || '').trim();
      var a = (cells[ia] || '').trim();
      if (!q) { errors.push('第 ' + row + ' 行题目为空'); return; }
      if (!a) { errors.push('第 ' + row + ' 行答案为空'); return; }
      var pts = cleanPoints(ip >= 0 ? parsePoints((cells[ip] || '').replace(/;/g, '\n')) : [], a);
      var terms = cleanTerms(it >= 0 ? parseTerms(cells[it]) : []);
      items.push({ qid: newId(10), q: q, a: a, points: pts, terms: terms });
    });
  }
  return { errors: errors, items: items };
}

/* ---------- 导出 ---------- */
function download(name, text, mime) {
  var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function exportBank(id) {
  var b = (S.banks || []).filter(function (x) { return x.id === id; })[0];
  if (!b) return;
  download('题库-' + b.name + '-' + today() + '.json', JSON.stringify(b.items, null, 2), 'application/json');
}

function csvCell(v) {
  var s = String(v == null ? '' : v);
  /* 表格公式注入防护：以 = + - @ 制表符回车开头时前置单引号，避免被 Excel 当公式执行 */
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportBankCSV(id) {
  var b = (S.banks || []).filter(function (x) { return x.id === id; })[0];
  if (!b) return;
  var rows = [['q', 'a', 'points', 'terms']];
  (b.items || []).forEach(function (it) {
    rows.push([it.q, it.a, (it.points || []).map(function (p) { return p.join('|'); }).join(';'), (it.terms || []).join(',')]);
  });
  download('题库-' + b.name + '-' + today() + '.csv',
    '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'), 'text/csv');
}

/* ================= 评分引擎 ================= */
/* 归一化：去空白、去标点、全角转半角，便于比对 */
function norm(s) {
  return String(s || '')
    .replace(/[\uff01-\uff5e]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
    .replace(/[\s\u3000]+/g, '')
    .replace(/[，。、；：！？""''（）《》〈〉【】…—\-,.;:!?"'()<>\[\]]/g, '')
    .toLowerCase();
}

/* 编辑距离相似度（0~1） */
function sim(a, b) {
  var s = norm(a), t = norm(b);
  if (!s && !t) return 1;
  if (!s || !t) return 0;
  if (s === t) return 1;
  var n = s.length, m = t.length, i, j;
  if (Math.abs(n - m) / Math.max(n, m) > 0.75) return 0;
  var prev = [], cur = [];
  for (j = 0; j <= m; j++) prev[j] = j;
  for (i = 1; i <= n; i++) {
    cur = [i];
    for (j = 1; j <= m; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (s[i - 1] === t[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return 1 - prev[m] / Math.max(n, m);
}

/* 否定检测：道法学科里"不是/不能/没有"会翻转语义，必须提示 */
function hasNegation(s) {
  return /(不是|不能|不会|不应该|不可以|没有|并非|不属于|不对|错误地|无须|不必)/.test(String(s || ''));
}

/* 要点命中：命中任一同义表达即算命中；含否定词时不算命中（防关键词堆砌误判） */
function pointHit(answer, group, item) {
  var ans = norm(answer);
  var raw = String(answer || '');
  var std = norm((item && item.a) || '');

  /* 1) 标准答案整体复述优先：不受局部否定启发式影响（修复正确否定句被判漏答） */
  if (std) {
    var si = ans.indexOf(std);
    if (si >= 0) {
      var pre = raw.slice(Math.max(0, si - 8), si);
      /* 标准句自身不含否定，而作答在标准句前加了否定 -> 不算复述 */
      if (hasNegation(std) || !hasNegation(pre)) return true;
    } else if (std.length >= 6 && sim(std, ans) >= 0.95) {
      return true;
    }
  }

  var i, g, idx, win, gNeg, aNeg;
  for (i = 0; i < group.length; i++) {
    g = norm(group[i]);
    if (!g) continue;
    if (ans.indexOf(g) < 0) {
      if (g.length <= 4 && sim(g, ans) > 0.92) return true;
      continue;
    }
    idx = raw.indexOf(String(group[i]));
    if (idx < 0) return true;
    win = raw.slice(Math.max(0, idx - 6), Math.min(raw.length, idx + String(group[i]).length + 4));
    gNeg = hasNegation(String(group[i]));
    aNeg = hasNegation(win);
    /* 否定表达与标准要点一致 -> 命中（不再误伤正确否定句） */
    if (aNeg === gNeg) return true;
    /* 否定不一致 -> 视为误命中（修复相反表述拿高分），由 negWarn 转人工复核 */
    continue;
  }
  return false;
}

function termHit(answer, term) {
  var ans = norm(answer);
  var t = norm(term);
  if (!t) return true;
  if (ans.indexOf(t) >= 0) return true;
  return sim(t, ans) > 0.94;
}

/* 评分：原文匹配 25% + 要点覆盖 75%（语义评分未启用） */
function gradeAnswer(answer, item) {
  var text = String(answer || '').trim();
  if (!text) {
    return {
      score: 0, raw: 0, cover: 0, points: (item.points || []).map(function (p) { return { g: p, ok: false }; }),
      missingTerms: (item.terms || []).slice(), textSim: 0, negWarn: false, empty: true
    };
  }
  var textSim = sim(text, item.a);
  var groups = item.points || [[item.a]];
  var hitList = groups.map(function (g) { return { g: g, ok: pointHit(text, g, item) }; });
  var hit = hitList.filter(function (x) { return x.ok; }).length;
  var cover = groups.length ? hit / groups.length : 0;
  var missingTerms = (item.terms || []).filter(function (t) { return !termHit(text, t); });

  var rawScore = textSim * 25 + cover * 75;
  /* 术语缺失扣分：每个缺失扣 3 分，最多扣 12 分 */
  var penalty = Math.min(12, missingTerms.length * 3);
  var score = Math.max(0, Math.round(rawScore - penalty));

  return {
    score: score,
    raw: Math.round(textSim * 100),
    cover: Math.round(cover * 100),
    points: hitList,
    missingTerms: missingTerms,
    textSim: textSim,
    negWarn: hasNegation(text) !== hasNegation(String(item.a || '')),
    empty: false
  };
}

    var d = raw ? JSON.parse(raw) : null;
    if (!d || d.code !== S.me.code || d.cls !== S.me.cls || d.taskId !== taskId || !Array.isArray(d.results)) return null;
    return d;
  } catch (e) { return null; }
}
function clearLocalDraft(taskId) {
  try { localStorage.removeItem(localDraftKey(S.me.code, taskId, S.me.accountId)); } catch (e) {}
}
function showRecoveredFinish() {
  $('pane').innerHTML = '<div class="card"><h2>已恢复本机作答</h2><div class="msg m-warn">所有题目均已作答，但尚未确认云端提交。请点击下方按钮完成提交，看到「已提交」后才算成功。</div><button class="gold" onclick="finishTask()">完成并提交整份作答</button></div>';
}


/* 索引追加：写后回读校验，最多重试 3 次，避免并发读改写丢失记录 */
/* 同桶写入串行队列：同一浏览器内并发提交不再互相覆盖 */
var IDX_QUEUE = {};
function enqueue(bucket, job) {
  var prev = IDX_QUEUE[bucket] || Promise.resolve();
  var next = prev.then(function () { return job(); }, function () { return job(); });
  /* 队列尾部吞掉错误，避免一个失败卡死后续 */
  IDX_QUEUE[bucket] = next.catch(function () {});
  return next;
}

/* 索引追加：同桶串行 + 写后回读校验 + 指数退避抖动重试（缓解读改写丢失更新） */
function appendToIndex(bucket, id, tries) {
  var left = typeof tries === 'number' ? tries : 5;
  return enqueue(bucket, function () {
    return appendOnce(bucket, id, left);
  });
}

function appendOnce(bucket, id, left) {
  return CLD.update(bucket, function (cur) {
    var idx = cur || { ids: [], __v: 0 };
    if (idx.ids.indexOf(id) < 0) idx.ids.push(id);
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  }).then(function () {
    return CLD.get(bucket).then(function (chk) {
      var ids = (chk && chk.ids) || [];
      if (ids.indexOf(id) >= 0) return true;
      if (left <= 1) throw new Error('索引写入未能确认，请点重试提交');
      /* 退避 + 抖动，错开并发写入窗口 */
      var wait = Math.round(40 * Math.pow(2, 5 - left) * (0.5 + Math.random()));
      return new Promise(function (r) { setTimeout(r, wait); })
        .then(function () { return appendOnce(bucket, id, left - 1); });
    });
  });
}

function openTask(tid) {
  return loadLearningTask(tid,S.me.cls).then(function (t) {
    if (!t || t.deleted) throw new Error('任务不存在');
    if (!t.open) throw new Error('该任务已关闭');
    var ph = taskPhase(t);
    if (ph.key === 'before') throw new Error('任务尚未开始：' + ph.hint);
    if (ph.key === 'after') throw new Error('任务已结束：' + ph.hint);
    if (t.cls !== S.me.cls) throw new Error('无权作答其他班级的任务');
    if(t.kind==='retry'&&(!t.assignments||!t.assignments[S.me.code]))throw new Error('此补练未分配给你');
    PLAY.task = t;
    PLAY.results = [];
    PLAY.idx = 0;
    PLAY.locked = false;
    PLAY.synced = 0;
    /* 稳定提交ID：同一次作答刷新后仍复用，便于服务端幂等 */
    PLAY.rid = 'r' + CLD.rnd(15);
    var bankIds = t.bankIds || [];
    return Promise.all(bankIds.map(function (b) { return CLD.get('bank:' + b); }))
      .then(function (banks) {
        var items = [];
        banks.forEach(function (b) { if (b && b.items) items = items.concat(b.items); });
        if(t.kind==='retry')items=JSON.parse(JSON.stringify(t.assignments[S.me.code]||[]));
        if(t.kind==='practice')items=JSON.parse(JSON.stringify(t.practiceItems||[]));
        if (!items.length) throw new Error('该任务的题库为空，请联系老师');
        PLAY.items = items;
        /* 草稿恢复：断网/刷新后可继续，避免整份重做 */
        return CLD.get('draft:' + S.me.code + ':' + t.id).then(function (d) { return d; })
          .catch(function () { return null; })
          .then(function (cloudDraft) {
            if (cloudDraft && cloudDraft.done) clearLocalDraft(t.id);
            var localDraft = cloudDraft && cloudDraft.done ? null : readLocalDraft(t.id);
            var d = localDraft && (!cloudDraft || !Array.isArray(cloudDraft.results) || ((localDraft.savedAt||0)>(cloudDraft.savedAt||0)||localDraft.results.length > cloudDraft.results.length)) ? localDraft : cloudDraft;
            if (d && d.rid && Array.isArray(d.results) && d.results.length &&
                d.results.length <= items.length && d.results.every(function (r, i) { return items.some(function(q){return q.qid===r.qid;})&&d.results.findIndex(function(x){return x.qid===r.qid;})===i; })) {
              PLAY.rid = d.rid;
              PLAY.results = d.results;
              PLAY.idx = Number.isInteger(d.currentIndex)?Math.max(0,Math.min(d.currentIndex,items.length-1)):Math.min(d.results.length,items.length-1);
              PLAY.synced = cloudDraft && Array.isArray(cloudDraft.results) ? cloudDraft.results.length : 0;
            }
            if (PLAY.results.length === items.length && !items.some(isExamQuestion)) showRecoveredFinish();
            else renderPlay();
          });
      });
  }).catch(function (e) {
    $('pane').innerHTML = '<div class="card"><div class="msg m-err">' + esc(e.message) + '</div>' +
      '<button class="ghost" onclick="renderStudent()">返回</button></div>';
    throw e;
  });
}

}

    '<h2 style="margin:0">' + esc(PLAY.task.title) + '</h2>' +

function submitAnswer() {
  if (PLAY.locked) return;
  var txt = ($('ansBox') ? $('ansBox').value : '').trim();
  if (!txt) { alert('请先填写你的背诵内容'); return; }
  var it = PLAY.items[PLAY.idx];
  if (!it) return;
  /* 同一题重复点击：不重复计入结果 */
  var dup = PLAY.results.filter(function (x) { return x.qid === it.qid; })[0];
  if (dup) { alert('本题已作答，请点「下一题」继续'); return; }

  PLAY.locked = true;
  if ($('subBtn')) $('subBtn').disabled = true;
  var r = gradeAnswer(txt, it);
  PLAY.results.push({ qid: it.qid, q: it.q, a: it.a, text: txt, g: r, studentNote: ($('ansNote')?$('ansNote').value:'').trim().slice(0,1000) });

  var h = '<div class="msg m-ok">本题已记录，建议分 <b>' + r.score + '</b> 分</div>';
  h += '<div class="item" style="margin-top:10px">' +
    '<div class="kv"><span class="k">原文匹配</span><span class="v">' + r.raw + '%（占 25%）</span></div>' +
    '<div class="kv"><span class="k">要点覆盖</span><span class="v">' + r.cover + '%（占 75%）</span></div>' +
    '<div class="kv"><span class="k">建议分</span><span class="v">' + r.score + ' / 100</span></div></div>';
  h += '<div style="margin-top:10px"><div class="d">要点检查</div>';
  r.points.forEach(function (p) {
    h += '<span class="tag' + (p.ok ? '' : ' miss') + '">' + (p.ok ? '✓ ' : '✗ ') + esc(p.g.join('/')) + '</span>';
  });
  h += '</div>';
  if (r.missingTerms.length) {
    h += '<div style="margin-top:8px"><div class="d">缺少必背术语</div>' +
      r.missingTerms.map(function (t) { return '<span class="tag term">' + esc(t) + '</span>'; }).join('') + '</div>';
  }
  if (r.negWarn) {
    h += '<div class="msg m-warn">检测到否定表述，可能与标准答案意思相反，请核对。</div>';
  }
  h += '<div style="margin-top:12px"><div class="d">参考答案</div>' +
    '<div style="font-size:14px;color:#2e503a;margin-top:5px">' + esc(it.a) + '</div></div>';

  var last = PLAY.idx + 1 >= PLAY.items.length;
  h += '<div id="draftMsg" class="d" style="margin-top:8px">本题暂存中…</div>';
  h += '<button class="' + (last ? 'gold' : '') + '" onclick="' + (last ? 'finishTask()' : 'nextQ()') + '">' +
    (last ? '完成并提交整份作答' : '下一题') + '</button>';

  setHTML('fbBox', h);
  if ($('ansBox')) $('ansBox').disabled = true;

  /* 逐题云端暂存：刷新/关闭页面不丢进度，并明确区分「暂存」与「已同步」 */
  var draft = {
    rid: PLAY.rid, code: S.me.code, cls: S.me.cls,
    taskId: PLAY.task.id, results: PLAY.results, at: nowStr(), __v: 1
  };
  var savedLocally = saveLocalDraft(draft);
  CLD.put('draft:' + S.me.code + ':' + PLAY.task.id, draft).then(function () {
    var dm = $('draftMsg');
    if (dm) dm.innerHTML = '本题已暂存到服务器（刷新或关闭页面后可继续，整份提交后才会计入成绩）';
    PLAY.synced = PLAY.results.length;
  }).catch(function () {
    var dm = $('draftMsg');
    if (dm) dm.innerHTML = savedLocally ? '<span style="color:#963c32">云端暂存失败，作答已保存在本机。请稍后重试提交，看到「已提交」才算成功。</span>' : '<span style="color:#963c32">云端暂存失败，本机也无法保存，请勿关闭页面，稍后重试。</span>';
  }).then(function () {
    PLAY.locked = false;
  });
}

function nextQ() {
  if(PLAY.locked)return;
  PLAY.idx++;
  renderPlay();
}

function finishTask() {
  if (PLAY.locked) return;
  if (!PLAY.results.length) { alert('还没有作答记录'); return; }
  if (PLAY.results.length !== PLAY.items.length || PLAY.items.some(function(it){ return PLAY.results.filter(function(r){return r.qid===it.qid;}).length!==1; })) { alert('请完成所有题目后再提交整份作答'); return; }
  PLAY.locked = true;
  var totalScore = 0;
  var detail = PLAY.results.map(function (x) {
    totalScore += x.g.score;
    return {
      qid: x.qid, q: x.q, a: x.a, text: x.text, studentNote: x.studentNote||'', type:x.type||'', maxScore:questionMax(x), options:(x.options||[]).slice(), images:(x.images||[]).slice(),
      score: x.g.score, raw: x.g.raw, cover: x.g.cover,
      points: x.g.points.map(function (p) { return { g: p.g, ok: p.ok }; }),
      missingTerms: x.g.missingTerms, negWarn: x.g.negWarn
    };
  });
  var avg = detail.length ? Math.round(totalScore / detail.length) : 0;
  /* 稳定提交ID：重试不会产生重复记录或孤立记录 */
  var rid = PLAY.rid || ('r' + CLD.rnd(15));
  PLAY.rid = rid;
  var rec = {
    rid: rid, cls: S.me.cls, taskId: PLAY.task.id, taskTitle: PLAY.task.title,
    code: S.me.code, name: S.me.name, at: nowStr(),
    score: avg, detail: detail, completed: true, questionCount: PLAY.items.length, accountId: S.me.accountId || '', mode: '25/75', reviewed: false, teacherScore: null, feedback: '', __v: 1
  };
  if(detail.some(isExamQuestion)){var examSummary=examRecordSummary(rec);rec.kind='exam';rec.totalMax=examSummary.totalMax;rec.earnedScore=examSummary.earnedScore;rec.score=examSummary.score;rec.gradingPending=examSummary.gradingPending;rec.mode='exam';avg=rec.score;}
  saveLocalDraft({ rid: rid, code: S.me.code, cls: S.me.cls, taskId: PLAY.task.id, results: PLAY.results, at: nowStr(), __v: 1 });
  return loadLearningTask(rec.taskId,rec.cls).then(function(currentTask){
    if(!currentTask||currentTask.deleted||currentTask.open===false)throw Error('任务已关闭、删除或关卡已下架，无法提交。作答已尝试保存在本机，请联系老师。');
    return CLD.get('rec:'+rid);
  }).then(function(existing){
    if(existing){
      if(existing.code!==rec.code||existing.taskId!==rec.taskId||existing.cls!==rec.cls||String(existing.accountId||'')!==String(rec.accountId||''))throw Error('提交记录不匹配，请联系老师');
      var same=existing.detail&&existing.detail.length===rec.detail.length&&existing.detail.every(function(d,j){return d.qid===rec.detail[j].qid&&d.text===rec.detail[j].text&&JSON.stringify(d.images||[])===JSON.stringify(rec.detail[j].images||[]);});
      if(!same)throw Error('云端已存在不同的作答，请联系老师核对');
      return;
    }
    return CLD.putVerified('rec:'+rid,rec,['rid','code','cls','taskId','detail','completed']);
  }).then(function () {
    return appendToIndex('idx:rec:' + PLAY.task.id + ':' + S.me.cls, rid, 3);
  }).then(function () {
    return CLD.put('draft:' + S.me.code + ':' + PLAY.task.id, { rid: rid, done: true, at: nowStr(), __v: 1 })
      .catch(function () {});
  }).then(function () {
    clearLocalDraft(PLAY.task.id);
    $('pane').innerHTML = '<div class="card" style="text-align:center">' +
      '<h2>已提交</h2>' +
      '<div class="score-big">' + (avg===null?'待老师批改':avg) + '</div>' +
      '<div class="sub">'+(isExamRecord(rec)?'试卷满分 '+rec.totalMax+' 分；目前已评分得分 '+rec.earnedScore+' 分'+(rec.gradingPending?'，主观题等待老师评分。':'，以上为各题得分之和。'):'建议分（满分 100）· 原文匹配 25% + 要点覆盖 75%')+'</div>' +
      '<div class="m-info msg" style="text-align:left">作答已保存到服务器，老师可以在自己的设备上看到并复核。最终成绩以老师复核为准。</div>' +
      '<div id="growthReward" style="text-align:left">正在同步成长奖励…</div>' +
      '<button class="gold" onclick="navStudent(\'mine\')">查看我的成绩</button>' +
      '<button class="ghost" onclick="renderStudent()">返回任务列表</button></div>';
    PLAY.locked = false;
    growthAfterSubmit(rec);
  }).catch(function (e) {
    $('pane').innerHTML = '<div class="card"><div class="msg m-err">提交失败：' + esc(e.message) +
      '。作答已尽量保存在本机；看到「已提交」前不算提交成功。请保持使用这台设备，稍后重试。</div><button onclick="finishTask()">重试提交</button></div>';
    PLAY.locked = false;
  });
}
