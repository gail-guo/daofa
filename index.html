    '<label>粘贴题库内容</label><textarea id="impText" style="min-height:130px" placeholder=\'JSON 示例：[{"q":"什么是规则？","a":"规则是约定俗成的行为规范。","points":["约定俗成|共同认可","行为规范"],"terms":["规则","行为规范"]}]\'></textarea>' +
    '<div class="row"><button class="ghost" onclick="previewImport()">预览</button>' +
    '<button onclick="doImport()">确认导入</button></div>' +
    '<div id="impMsg"></div><div id="impPreview" style="margin-top:10px"></div></div>';

  mountPaperImport();
  loadBanks().then(function () { renderQList(); });
}

/* ===== 题库选中记忆（修复：删除题目/题库后不再跳回第一个题库） =====
   1) 选中项实时写入 localStorage，刷新页面也回到上次编辑的题库；
   2) loadBanks 重建 option 后按「原选中 > 上次记忆 > 第一个」顺序恢复。 */
var BANK_PREF_KEY = 'df.bank.pref';
function bankPref() {
  try { return localStorage.getItem(BANK_PREF_KEY) || ''; } catch (e) { return ''; }
}
function setBankPref(id) {
  try {
    if (id) localStorage.setItem(BANK_PREF_KEY, id);
    else localStorage.removeItem(BANK_PREF_KEY);
  } catch (e) {}
}
function bankHas(id) {
  return (S.banks || []).some(function (b) { return b.id === id; });
}
/* 手动切换题库下拉框：记住选择并重绘题目列表 */
function onBankChange() {
  var sel = $('qBank');
  if (sel && sel.value) setBankPref(sel.value);
  renderQList();
}
/* 从题库卡片上「打开此题库编辑」：直接切到该题库 */
function openBank(id) {
  if (!id) return;
  setBankPref(id);
  var sel = $('qBank');
  if (sel) sel.value = id;
  renderQList();paintBankPicker();
  var box = $('qMsg');
  if (box && box.scrollIntoView) { try { box.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
}

function loadBanks() {
  return CLD.get('idx:bank:' + S.me.code).then(function (idx) {
    var ids = (idx && idx.ids) || [];
    if (!ids.length) return [];
    return Promise.all(ids.map(function (i) { return CLD.get('bank:' + i); }))
      .then(function (l) { return l.filter(Boolean); });
  }).then(function (list) {
    S.banks = list;
    var h = '';
    if (!list.length) h = '<div class="empty">还没有题库</div>';
    list.forEach(function (b) {
      h += '<div class="item"><div class="t">' + esc(b.name) + '</div>' +
        '<div class="d">' + (b.mode==='exam'?'试题 · ':'背诵题库 · ') + (b.items || []).length + ' 道题 · 创建于 ' + esc(b.at || '') + '</div>' +
        '<div style="margin-top:8px">' +
        '<button class="sm ghost" onclick="exportBank(\'' + esc(b.id) + '\')">导出 JSON</button>' +
        '<button class="sm ghost" onclick="exportBankCSV(\'' + esc(b.id) + '\')">导出 CSV</button>' +
        '<button class="sm ghost" onclick="openBank(\'' + esc(b.id) + '\')">打开此题库编辑</button>' +
        '<button class="sm ghost" onclick="renamePaperBank(\'' + esc(b.id) + '\')">修改名称</button>' +
        '<button class="sm danger" onclick="delBank(\'' + esc(b.id) + '\')">删除</button>' +
        '</div><div id="bankPractice_' + esc(b.id) + '"></div></div>';
    });
    if ($('bankList')) $('bankList').innerHTML = h;
    /* 修复：重建 option 前先记住当前选中项，重建后按「原选中 > 上次记忆 > 第一个」恢复，
       否则浏览器会把 select 重置为第一项（删除题目/题库后被拉回默认题库的根因） */
    var sel = $('qBank');
    if (sel) {
      var keep = sel.value || '';
      var wanted = (keep && list.some(function (b) { return b.id === keep; })) ? keep : bankPref();
      sel.innerHTML = list.map(function (b) {
        return '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>';
      }).join('');
      if (wanted && list.some(function (b) { return b.id === wanted; })) {
        sel.value = wanted;
      } else if (list.length) {
        sel.value = list[0].id;
      }
      if (sel.value) setBankPref(sel.value);
      else setBankPref('');
    }
    paintBankPicker();paintPracticeControls();
    return list;
  }).catch(function () {
    if ($('bankList')) $('bankList').innerHTML = '<div class="empty">题库加载失败</div>';
    return [];
  });
}

function addBank() {
  var name = ($('bkName').value || '').trim();
  if (!name) { setMsg('bkMsg', '请填写题库名称', 'err'); return; }
  var id = newId(14);
  var b = { id: id, name: name, mode: $('bkMode')&&$('bkMode').value==='exam'?'exam':'recitation', items: [], owner: S.me.code, at: nowStr(), __v: 1 };
  return CLD.put('bank:' + id, b).then(function () {
    return CLD.update('idx:bank:' + S.me.code, function (cur) {
      var idx = cur || { ids: [], __v: 0 };
      if (idx.ids.indexOf(id) < 0) idx.ids.push(id);
      idx.__v = (idx.__v || 0) + 1;
      return idx;
    });
  }).then(function () {
    $('bkName').value = '';
    setMsg('bkMsg', '题库已创建', 'ok');
    return loadBanks();
  }).then(function () { renderQList(); })
    .catch(function (e) { setMsg('bkMsg', e.message || '创建失败', 'err'); });
}

function delBank(id) {
  if (!confirm('删除该题库？（已发布任务的作答记录仍会保留当时的评分依据）')) return;
  /* 删除前先算出相邻题库：删除后优先落到它的下一个（没有则上一个），避免被拉回第一个题库 */
  var list = S.banks || [];
  var pos = -1, i;
  for (i = 0; i < list.length; i++) { if (list[i].id === id) { pos = i; break; } }
  var nextId = '';
  if (pos >= 0) {
    if (pos + 1 < list.length) nextId = list[pos + 1].id;
    else if (pos - 1 >= 0) nextId = list[pos - 1].id;
  }
  setBankPref(nextId);
  return CLD.get('practice:'+id).then(function(p){
    if(!p||!p.enabled)return;
    return CLD.update('practice:'+id,function(cur){if(cur.owner!==S.me.code)throw Error('无权下架闯关');cur.enabled=false;cur.updatedAt=nowStr();cur.__v=(cur.__v||0)+1;return cur;});
  }).then(function(){return CLD.update('idx:bank:' + S.me.code, function (cur) {
    var idx = cur || { ids: [], __v: 0 };
    idx.ids = (idx.ids || []).filter(function (x) { return x !== id; });
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  });}).then(function () {
    var sel = $('qBank');
    if (sel) sel.value = '';           /* 清掉已失效的选中值，让 loadBanks 走记忆分支 */
    return loadBanks();
  })
    .then(function () {
      if (nextId && bankHas(nextId)) setBankPref(nextId);
      renderQList();
    })
    .catch(function (e) { setMsg('bkMsg', e.message || '删除失败', 'err'); });
}

function parsePoints(txt) {
  return String(txt || '').split(/\n+/).map(function (s) { return s.trim(); })
    .filter(Boolean).map(function (line) {
      return line.split('|').map(function (x) { return x.trim(); }).filter(Boolean);
    });
}

function parseTerms(txt) {
  return String(txt || '').split(/[,，、\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function addQuestion() {
  var bid = $('qBank') ? $('qBank').value : '';
  if (!bid) { setMsg('qMsg', '请先创建并选择题库', 'err'); return; }
  var q = ($('qQ').value || '').trim();
  var a = ($('qA').value || '').trim();
  if (!q) { setMsg('qMsg', '请填写题目', 'err'); return; }
  if (!a) { setMsg('qMsg', '请填写标准答案', 'err'); return; }
  var pts = parsePoints($('qP').value);
  var terms = parseTerms($('qT').value);
  if (!pts.length) { setMsg('qMsg', '请至少填写一个评分要点', 'err'); return; }
  var item = { qid: newId(10), q: q, a: a, points: pts, terms: terms };
  return CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = b.items || [];
    b.items.push(item);
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    $('qQ').value = ''; $('qA').value = ''; $('qP').value = ''; $('qT').value = '';
    setMsg('qMsg', '题目已添加', 'ok');
    return loadBanks();
  }).then(function () { renderQList(); })
    .catch(function (e) { setMsg('qMsg', e.message || '添加失败', 'err'); });
}

/* ===== 题目多选删除（Q_SEL 按题库 id 分别记录勾选的 qid） ===== */
var Q_SEL = {};
var Q_TIP = '';
function qSelBox(bid) {
  if (!Q_SEL[bid]) Q_SEL[bid] = {};
  return Q_SEL[bid];
}
function qSelIds(bid) {
  var m = Q_SEL[bid] || {};
  return Object.keys(m).filter(function (k) { return m[k]; });
}
function toggleQSel(bid, qid) {
  var m = qSelBox(bid);
  if (m[qid]) delete m[qid]; else m[qid] = true;
  qSelSync(bid);
}
function qSelSetAll(bid, mode) {
  var b = (S.banks || []).filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var items = b.items || [];
  if (mode === 'none') { Q_SEL[bid] = {}; }
  else {
    var m = qSelBox(bid);
    items.forEach(function (it) {
      if (mode === 'all') m[it.qid] = true;
      else if (m[it.qid]) delete m[it.qid];
      else m[it.qid] = true;
    });
  }
  renderQList();
}
/* 只同步计数与勾选态，不重绘列表（避免点一下整块闪动） */
function qSelSync(bid) {
  var n = qSelIds(bid).length;
  var cnt = $('qSelCnt');
  if (cnt) cnt.innerHTML = n ? ('已选 <b style="color:#397346">' + n + '</b> 道') : '未选择题目';
  var btn = $('qDelSelBtn');
  if (btn) btn.disabled = !n;
  var b = (S.banks || []).filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var m = Q_SEL[bid] || {};
  (b.items || []).forEach(function (it) {
    var cb = $('qcb_' + it.qid);
    if (cb) cb.checked = !!m[it.qid];
  });
}
function renderQList() {
  syncBankMode();
  var bid = $('qBank') ? $('qBank').value : '';
  if (!bid || !S.banks) return;
  var b = S.banks.filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var items = b.items || [];
  /* 清掉已不存在题目的残留勾选 */
  var exist = {};
  items.forEach(function (it) { exist[it.qid] = true; });
  var m = qSelBox(bid);
  Object.keys(m).forEach(function (k) { if (!exist[k]) delete m[k]; });
  var tip = Q_TIP;
  Q_TIP = '';
  if (!items.length) {
    Q_SEL[bid] = {};
    setHTML('qMsg', (tip ? '<div class="msg m-ok">' + esc(tip) + '</div>' : '') + '<div class="msg m-info">该题库还没有题目</div>');
    return;
  }
  var h = (tip ? '<div class="msg m-ok">' + esc(tip) + '</div>' : '') +
    '<div class="msg m-info">当前题库共 ' + items.length + ' 道题，可勾选多道后一次性删除</div>' +
    '<div class="row" style="margin-bottom:10px;align-items:center">' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'all\')">全选</button>' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'none\')">取消全选</button>' +
    '<button class="sm ghost" onclick="qSelSetAll(\'' + esc(bid) + '\',\'inv\')">反选</button>' +
    '<button class="sm danger" id="qDelSelBtn" onclick="delSelectedQuestions(\'' + esc(bid) + '\')">删除选中</button>' +
    '<div class="d" id="qSelCnt" style="flex:1;min-width:96px;text-align:right">未选择题目</div>' +
    '</div>';
  items.forEach(function (it, i) {
    h += '<div class="item"><div style="display:flex;gap:9px;align-items:flex-start">' +
      '<input type="checkbox" id="qcb_' + esc(it.qid) + '" style="width:20px;height:20px;flex:0 0 auto;margin-top:3px;accent-color:#ffc93c;cursor:pointer" ' +
      (m[it.qid] ? 'checked ' : '') +
      'onchange="toggleQSel(\'' + esc(bid) + '\',\'' + esc(it.qid) + '\')">' +
      '<div style="flex:1;min-width:0">' +
      '<div class="t">' + (i + 1) + '. ' + esc(it.q) + paperMediaHtml(it)+'</div>' + (isExamQuestion(it)?'<div class="badge b-gold">'+examQuestionLabel(it)+' · '+questionMax(it)+'分</div>'+examOptionsHtml(it):'') +
      '<div class="d">答案：' + esc(it.a) + '</div>' +
      '<div class="d">要点：' + (it.points || []).map(function (pt) {
        return '<span class="tag">' + esc(pt.join('/')) + '</span>';
      }).join('') + '</div>' +
      (it.terms && it.terms.length ? '<div class="d">术语：' + it.terms.map(function (t) {
        return '<span class="tag term">' + esc(t) + '</span>';
      }).join('') + '</div>' : '') +
      '</div></div>' +
      '<button class="sm danger" style="margin-top:8px" onclick="delQuestion(\'' + esc(bid) + '\',\'' + esc(it.qid) + '\')">删除此题</button></div>';
  });
  setHTML('qMsg', h);
  qSelSync(bid);
}
/* 批量删除：一次 CLD.update 内过滤，保证题目列表原子替换，且删除后仍停在原题库 */
function delSelectedQuestions(bid) {
  var ids = qSelIds(bid);
  if (!ids.length) { Q_TIP = ''; renderQList(); return; }
  if (!confirm('确认删除选中的 ' + ids.length + ' 道题？此操作不可恢复，建议先导出 JSON 备份。')) return;
  var drop = {};
  ids.forEach(function (k) { drop[k] = true; });
  setBankPref(bid);
  var btn = $('qDelSelBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '删除中…'; }
  CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = (b.items || []).filter(function (x) { return !drop[x.qid]; });
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    Q_SEL[bid] = {};
    var sel = $('qBank');
    if (sel && bankHas(bid)) sel.value = bid;
    return loadBanks();
  }).then(function () {
    var sel2 = $('qBank');
    if (sel2 && bankHas(bid)) { sel2.value = bid; setBankPref(bid); }
    Q_TIP = '已删除 ' + ids.length + ' 道题';
    renderQList();
  }).catch(function (e) {
    var btn2 = $('qDelSelBtn');
    if (btn2) { btn2.disabled = false; btn2.innerHTML = '删除选中'; }
    setMsg('qMsg', e.message || '批量删除失败', 'err');
  });
}

function delQuestion(bid, qid) {
  /* 修复：删除题目后必须停在同一题库（原来 loadBanks 重建下拉框会跳回第一个题库） */
  setBankPref(bid);
  CLD.update('bank:' + bid, function (cur) {
    var b = cur;
    b.items = (b.items || []).filter(function (x) { return x.qid !== qid; });
    b.__v = (b.__v || 0) + 1;
    return b;
  }).then(function () {
    var sel = $('qBank');
    if (sel && bankHas(bid)) sel.value = bid;
    return loadBanks();
  })
    .then(function () {
      var sel2 = $('qBank');
      if (sel2 && bankHas(bid)) { sel2.value = bid; setBankPref(bid); }
      renderQList();
    })
    .catch(function (e) { setMsg('qMsg', e.message || '删除失败', 'err'); });
}

/* ---------- 导入 ---------- */
function parseCSVLine(line) {
  var out = [], cur = '', q = false, i, c;
  for (i = 0; i < line.length; i++) {
    c = line[i];
    if (q) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

/* 导入字段清洗：剔除空要点与空同义表达，限制类型与长度 */
var IMP_LIMIT = { q: 500, a: 2000, point: 200, term: 60, terms: 30 };
function cleanGroup(p) {
  var arr = Array.isArray(p) ? p : String(p == null ? '' : p).split('|');
  var out = [];
  arr.forEach(function (x) {
    var s = String(x == null ? '' : x).trim();
    if (s) out.push(s.slice(0, IMP_LIMIT.point));
  });
  return out;
}
function cleanPoints(list, fallbackA) {
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function (p) {
    var g = cleanGroup(p);
    if (g.length) out.push(g);
  });
  if (!out.length) out = [[String(fallbackA == null ? '' : fallbackA)]];
  return out;
}
function cleanTerms(list) {
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function (t) {
    var s = String(t == null ? '' : t).trim();
    if (s) out.push(s.slice(0, IMP_LIMIT.term));
  });
  return out.slice(0, IMP_LIMIT.terms);
}

function buildImport() {
  var fmt = $('impFmt').value;
  var raw = $('impText').value.trim();
  var errors = [], items = [];
  if (!raw) return { errors: ['内容为空'], items: [] };

  if (fmt === 'json') {
    var arr;
    try { arr = JSON.parse(raw); }
    catch (e) { return { errors: ['JSON 格式错误：' + e.message], items: [] }; }
    if (!Array.isArray(arr)) return { errors: ['JSON 顶层必须是数组 [...]'], items: [] };
    arr.forEach(function (o, i) {
      var row = i + 1;
      if (!o || typeof o !== 'object') { errors.push('第 ' + row + ' 条不是对象'); return; }
      var q = String(o.q || o.question || '').trim().slice(0, IMP_LIMIT.q);
      var a = String(o.a || o.answer || '').trim().slice(0, IMP_LIMIT.a);
      if (!q) { errors.push('第 ' + row + ' 条缺少题目 q'); return; }
      if (!a) { errors.push('第 ' + row + ' 条缺少标准答案 a'); return; }
      var pts = cleanPoints(o.points, a);
      var terms = cleanTerms(Array.isArray(o.terms) ? o.terms : parseTerms(o.terms));
      try{items.push({qid:newId(10),q:q,a:a,points:pts,terms:terms,stemMedia:jsonStemMedia(o)});}catch(e){errors.push('第 '+row+' 条：'+e.message);}
    });
  } else {
    var lines = raw.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return { errors: ['内容为空'], items: [] };
    var head = parseCSVLine(lines[0]).map(function (h) { return h.trim().toLowerCase(); });
    var iq = head.indexOf('q'), ia = head.indexOf('a'), ip = head.indexOf('points'), it = head.indexOf('terms');
    if (iq < 0 || ia < 0) {
      return { errors: ['CSV 首行必须是表头，且包含 q 和 a 两列（可用 points、terms 列）'], items: [] };
    }
    lines.slice(1).forEach(function (line, idx) {
      var row = idx + 2;
      var cells = parseCSVLine(line);
      var q = (cells[iq] || '').trim();
      var a = (cells[ia] || '').trim();
      if (!q) { errors.push('第 ' + row + ' 行题目为空'); return; }
      if (!a) { errors.push('第 ' + row + ' 行答案为空'); return; }
      var pts = cleanPoints(ip >= 0 ? parsePoints((cells[ip] || '').replace(/;/g, '\n')) : [], a);
      var terms = cleanTerms(it >= 0 ? parseTerms(cells[it]) : []);
      items.push({ qid: newId(10), q: q, a: a, points: pts, terms: terms });
    });
  }
  return { errors: errors, items: items };
}

function previewImport() {
  var r = buildImport();
  var h = '';
  if (r.errors.length) {
    h += '<div class="msg m-err">发现 ' + r.errors.length + ' 处格式问题：<br>' +
      r.errors.slice(0, 8).map(esc).join('<br>') +
      (r.errors.length > 8 ? '<br>…还有 ' + (r.errors.length - 8) + ' 处' : '') + '</div>';
  }
  if (r.items.length) {
    h += '<div class="msg m-ok">可导入 ' + r.items.length + ' 道题</div>';
    h += '<div class="item"><div class="d">前 3 道预览：</div>';
    r.items.slice(0, 3).forEach(function (it, i) {
      h += '<div class="d">' + (i + 1) + '. ' + esc(it.q) + ' — 要点 ' + it.points.length + ' 个</div>';
    });
    h += '</div>';
  }
  if (!r.errors.length && !r.items.length) h = '<div class="msg m-warn">没有解析出题目</div>';
  setHTML('impPreview', h);
  S.impCache = r.items;
}

function doImport() {
  var bid = $('qBank') ? $('qBank').value : '';
  if (!bid) { setMsg('impMsg', '请先创建并选择题库', 'err'); return; }
  /* 确认时按当前文本重新解析，避免沿用旧预览缓存 */
  var r = buildImport();
  if (r.errors.length) {
    setMsg('impMsg', '检测到 ' + r.errors.length + ' 处格式问题，已阻止导入；请修正后重新预览再导入。', 'err');
    previewImport();
    return;
  }
  var items = r.items;
  if (!items.length) { setMsg('impMsg', '没有可导入的题目，请先预览检查', 'err'); return; }
  CLD.update('bank:' + bid, function (cur) {

function download(name, text, mime) {
  var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function exportBank(id) {
  var b = (S.banks || []).filter(function (x) { return x.id === id; })[0];
  if (!b) return;
  download('题库-' + b.name + '-' + today() + '.json', JSON.stringify(b.items, null, 2), 'application/json');
}

function csvCell(v) {
  var s = String(v == null ? '' : v);
  /* 表格公式注入防护：以 = + - @ 制表符回车开头时前置单引号，避免被 Excel 当公式执行 */
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportBankCSV(id) {
  var b = (S.banks || []).filter(function (x) { return x.id === id; })[0];
  if (!b) return;
  var rows = [['q', 'a', 'points', 'terms']];
  (b.items || []).forEach(function (it) {
    rows.push([it.q, it.a, (it.points || []).map(function (p) { return p.join('|'); }).join(';'), (it.terms || []).join(',')]);
  });
  download('题库-' + b.name + '-' + today() + '.csv',
    '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'), 'text/csv');
}

/* ================= 评分引擎 ================= */
/* 归一化：去空白、去标点、全角转半角，便于比对 */
function norm(s) {
  return String(s || '')
    .replace(/[\uff01-\uff5e]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
    .replace(/[\s\u3000]+/g, '')
    .replace(/[，。、；：！？""''（）《》〈〉【】…—\-,.;:!?"'()<>\[\]]/g, '')
    .toLowerCase();
}

/* 编辑距离相似度（0~1） */
function sim(a, b) {
  var s = norm(a), t = norm(b);
  if (!s && !t) return 1;
  if (!s || !t) return 0;
  if (s === t) return 1;
  var n = s.length, m = t.length, i, j;
  if (Math.abs(n - m) / Math.max(n, m) > 0.75) return 0;
  var prev = [], cur = [];
  for (j = 0; j <= m; j++) prev[j] = j;
  for (i = 1; i <= n; i++) {
    cur = [i];
    for (j = 1; j <= m; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (s[i - 1] === t[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return 1 - prev[m] / Math.max(n, m);
}

/* 否定检测：道法学科里"不是/不能/没有"会翻转语义，必须提示 */
function hasNegation(s) {
  return /(不是|不能|不会|不应该|不可以|没有|并非|不属于|不对|错误地|无须|不必)/.test(String(s || ''));
}

/* 要点命中：命中任一同义表达即算命中；含否定词时不算命中（防关键词堆砌误判） */
function pointHit(answer, group, item) {
  var ans = norm(answer);
  var raw = String(answer || '');
  var std = norm((item && item.a) || '');

  /* 1) 标准答案整体复述优先：不受局部否定启发式影响（修复正确否定句被判漏答） */
  if (std) {
    var si = ans.indexOf(std);
    if (si >= 0) {
      var pre = raw.slice(Math.max(0, si - 8), si);
      /* 标准句自身不含否定，而作答在标准句前加了否定 -> 不算复述 */
      if (hasNegation(std) || !hasNegation(pre)) return true;
    } else if (std.length >= 6 && sim(std, ans) >= 0.95) {
      return true;
    }
  }

  var i, g, idx, win, gNeg, aNeg;
  for (i = 0; i < group.length; i++) {
    g = norm(group[i]);
    if (!g) continue;
    if (ans.indexOf(g) < 0) {
      if (g.length <= 4 && sim(g, ans) > 0.92) return true;
      continue;
    }
    idx = raw.indexOf(String(group[i]));
    if (idx < 0) return true;
    win = raw.slice(Math.max(0, idx - 6), Math.min(raw.length, idx + String(group[i]).length + 4));
    gNeg = hasNegation(String(group[i]));
    aNeg = hasNegation(win);
    /* 否定表达与标准要点一致 -> 命中（不再误伤正确否定句） */
    if (aNeg === gNeg) return true;
    /* 否定不一致 -> 视为误命中（修复相反表述拿高分），由 negWarn 转人工复核 */
    continue;
  }
  return false;
}

function termHit(answer, term) {
  var ans = norm(answer);
  var t = norm(term);
  if (!t) return true;
  if (ans.indexOf(t) >= 0) return true;
  return sim(t, ans) > 0.94;
}

/* 评分：原文匹配 25% + 要点覆盖 75%（语义评分未启用） */
function gradeAnswer(answer, item) {
  var text = String(answer || '').trim();
  if (!text) {
    return {
      score: 0, raw: 0, cover: 0, points: (item.points || []).map(function (p) { return { g: p, ok: false }; }),
      missingTerms: (item.terms || []).slice(), textSim: 0, negWarn: false, empty: true
    };
  }
  var textSim = sim(text, item.a);
  var groups = item.points || [[item.a]];
  var hitList = groups.map(function (g) { return { g: g, ok: pointHit(text, g, item) }; });
  var hit = hitList.filter(function (x) { return x.ok; }).length;
  var cover = groups.length ? hit / groups.length : 0;
  var missingTerms = (item.terms || []).filter(function (t) { return !termHit(text, t); });

  var rawScore = textSim * 25 + cover * 75;
  /* 术语缺失扣分：每个缺失扣 3 分，最多扣 12 分 */
  var penalty = Math.min(12, missingTerms.length * 3);
  var score = Math.max(0, Math.round(rawScore - penalty));

  return {
    score: score,
    raw: Math.round(textSim * 100),
    cover: Math.round(cover * 100),
    points: hitList,
    missingTerms: missingTerms,
    textSim: textSim,
    negWarn: hasNegation(text) !== hasNegation(String(item.a || '')),
    empty: false
  };
}

/* 索引追加：写后回读校验，最多重试 3 次，避免并发读改写丢失记录 */
/* 同桶写入串行队列：同一浏览器内并发提交不再互相覆盖 */
var IDX_QUEUE = {};
function enqueue(bucket, job) {
  var prev = IDX_QUEUE[bucket] || Promise.resolve();
  var next = prev.then(function () { return job(); }, function () { return job(); });
  /* 队列尾部吞掉错误，避免一个失败卡死后续 */
  IDX_QUEUE[bucket] = next.catch(function () {});
  return next;
}

/* 索引追加：同桶串行 + 写后回读校验 + 指数退避抖动重试（缓解读改写丢失更新） */
function appendToIndex(bucket, id, tries) {
  var left = typeof tries === 'number' ? tries : 5;
  return enqueue(bucket, function () {
    return appendOnce(bucket, id, left);
  });
}

function appendOnce(bucket, id, left) {
  return CLD.update(bucket, function (cur) {
    var idx = cur || { ids: [], __v: 0 };
    if (idx.ids.indexOf(id) < 0) idx.ids.push(id);
    idx.__v = (idx.__v || 0) + 1;
    return idx;
  }).then(function () {
    return CLD.get(bucket).then(function (chk) {
      var ids = (chk && chk.ids) || [];
      if (ids.indexOf(id) >= 0) return true;
      if (left <= 1) throw new Error('索引写入未能确认，请点重试提交');
      /* 退避 + 抖动，错开并发写入窗口 */
      var wait = Math.round(40 * Math.pow(2, 5 - left) * (0.5 + Math.random()));
      return new Promise(function (r) { setTimeout(r, wait); })
        .then(function () { return appendOnce(bucket, id, left - 1); });
    });
  });
}

function openTask(tid) {
  return loadLearningTask(tid,S.me.cls).then(function (t) {
    if (!t || t.deleted) throw new Error('任务不存在');
    if (!t.open) throw new Error('该任务已关闭');
    var ph = taskPhase(t);
    if (ph.key === 'before') throw new Error('任务尚未开始：' + ph.hint);
    if (ph.key === 'after') throw new Error('任务已结束：' + ph.hint);
    if (t.cls !== S.me.cls) throw new Error('无权作答其他班级的任务');
    if(t.kind==='retry'&&(!t.assignments||!t.assignments[S.me.code]))throw new Error('此补练未分配给你');
    PLAY.task = t;
    PLAY.results = [];
    PLAY.idx = 0;
    PLAY.locked = false;
    PLAY.synced = 0;
    /* 稳定提交ID：同一次作答刷新后仍复用，便于服务端幂等 */
    PLAY.rid = 'r' + CLD.rnd(15);
    var bankIds = t.bankIds || [];
    return Promise.all(bankIds.map(function (b) { return CLD.get('bank:' + b); }))
      .then(function (banks) {
        var items = [];
        banks.forEach(function (b) { if (b && b.items) items = items.concat(b.items); });
        if(t.kind==='retry')items=JSON.parse(JSON.stringify(t.assignments[S.me.code]||[]));
        if(t.kind==='practice')items=JSON.parse(JSON.stringify(t.practiceItems||[]));
        if (!items.length) throw new Error('该任务的题库为空，请联系老师');
        PLAY.items = items;
        /* 草稿恢复：断网/刷新后可继续，避免整份重做 */
        return CLD.get('draft:' + S.me.code + ':' + t.id).then(function (d) { return d; })
          .catch(function () { return null; })
          .then(function (cloudDraft) {
            if (cloudDraft && cloudDraft.done) clearLocalDraft(t.id);
            var localDraft = cloudDraft && cloudDraft.done ? null : readLocalDraft(t.id);
            var d = localDraft && (!cloudDraft || !Array.isArray(cloudDraft.results) || ((localDraft.savedAt||0)>(cloudDraft.savedAt||0)||localDraft.results.length > cloudDraft.results.length)) ? localDraft : cloudDraft;
            if (d && d.rid && Array.isArray(d.results) && d.results.length &&
                d.results.length <= items.length && d.results.every(function (r, i) { return items.some(function(q){return q.qid===r.qid;})&&d.results.findIndex(function(x){return x.qid===r.qid;})===i; })) {
              PLAY.rid = d.rid;
              PLAY.results = d.results;
              PLAY.idx = Number.isInteger(d.currentIndex)?Math.max(0,Math.min(d.currentIndex,items.length-1)):Math.min(d.results.length,items.length-1);
              PLAY.synced = cloudDraft && Array.isArray(cloudDraft.results) ? cloudDraft.results.length : 0;
            }
            if (PLAY.results.length === items.length && !items.some(isExamQuestion)) showRecoveredFinish();
            else renderPlay();
          });
      });
  }).catch(function (e) {

function submitAnswer() {
  if (PLAY.locked) return;
  var txt = ($('ansBox') ? $('ansBox').value : '').trim();
  if (!txt) { alert('请先填写你的背诵内容'); return; }
  var it = PLAY.items[PLAY.idx];

  /* 同一题重复点击：不重复计入结果 */
  var dup = PLAY.results.filter(function (x) { return x.qid === it.qid; })[0];
  if (dup) { alert('本题已作答，请点「下一题」继续'); return; }

  PLAY.locked = true;
  if ($('subBtn')) $('subBtn').disabled = true;
  var r = gradeAnswer(txt, it);
  PLAY.results.push({ qid: it.qid, q: it.q, stemMedia:it.stemMedia||[], a: it.a, text: txt, g: r, studentNote: ($('ansNote')?$('ansNote').value:'').trim().slice(0,1000) });

  var h = '<div class="msg m-ok">本题已记录，建议分 <b>' + r.score + '</b> 分</div>';
  h += '<div class="item" style="margin-top:10px">' +
    '<div class="kv"><span class="k">原文匹配</span><span class="v">' + r.raw + '%（占 25%）</span></div>' +
    '<div class="kv"><span class="k">要点覆盖</span><span class="v">' + r.cover + '%（占 75%）</span></div>' +

  });

    h += '<div style="margin-top:8px"><div class="d">缺少必背术语</div>' +

    '<div style="font-size:14px;color:#2e503a;margin-top:5px">' + esc(it.a) + '</div></div>';

  var last = PLAY.idx + 1 >= PLAY.items.length;
  h += '<div id="draftMsg" class="d" style="margin-top:8px">本题暂存中…</div>';

    (last ? '完成并提交整份作答' : '下一题') + '</button>';

  setHTML('fbBox', h);

  /* 逐题云端暂存：刷新/关闭页面不丢进度，并明确区分「暂存」与「已同步」 */

  };

  CLD.put('draft:' + S.me.code + ':' + PLAY.task.id, draft).then(function () {
    var dm = $('draftMsg');
    if (dm) dm.innerHTML = '本题已暂存到服务器（刷新或关闭页面后可继续，整份提交后才会计入成绩）';
    PLAY.synced = PLAY.results.length;
  }).catch(function () {
    var dm = $('draftMsg');
    if (dm) dm.innerHTML = savedLocally ? '<span style="color:#963c32">云端暂存失败，作答已保存在本机。请稍后重试提交，看到「已提交」才算成功。</span>' : '<span style="color:#963c32">云端暂存失败，本机也无法保存，请勿关闭页面，稍后重试。</span>';

  });

  if (PLAY.results.length !== PLAY.items.length || PLAY.items.some(function(it){ return PLAY.results.filter(function(r){return r.qid===it.qid;}).length!==1; })) { alert('请完成所有题目后再提交整份作答'); return; }
  PLAY.locked = true;
  var totalScore = 0;
  var detail = PLAY.results.map(function (x) {
    totalScore += x.g.score;
    return {
      qid: x.qid, q: x.q, stemMedia:x.stemMedia||[], a: x.a, text: x.text, studentNote: x.studentNote||'', type:x.type||'', maxScore:questionMax(x), options:(x.options||[]).slice(), images:(x.images||[]).slice(),
      score: x.g.score, raw: x.g.raw, cover: x.g.cover,
      points: x.g.points.map(function (p) { return { g: p.g, ok: p.ok }; }),
      missingTerms: x.g.missingTerms, negWarn: x.g.negWarn
    };
  });
  var avg = detail.length ? Math.round(totalScore / detail.length) : 0;
  /* 稳定提交ID：重试不会产生重复记录或孤立记录 */
  var rid = PLAY.rid || ('r' + CLD.rnd(15));

  saveLocalDraft({ rid: rid, code: S.me.code, cls: S.me.cls, taskId: PLAY.task.id, results: PLAY.results, at: nowStr(), __v: 1 });
  return loadLearningTask(rec.taskId,rec.cls).then(function(currentTask){
    if(!currentTask||currentTask.deleted||currentTask.open===false)throw Error('任务已关闭、删除或关卡已下架，无法提交。作答已尝试保存在本机，请联系老师。');
    return CLD.get('rec:'+rid);
  }).then(function(existing){
    if(existing){
      if(existing.code!==rec.code||existing.taskId!==rec.taskId||existing.cls!==rec.cls||String(existing.accountId||'')!==String(rec.accountId||''))throw Error('提交记录不匹配，请联系老师');
      var same=existing.detail&&existing.detail.length===rec.detail.length&&existing.detail.every(function(d,j){return d.qid===rec.detail[j].qid&&d.text===rec.detail[j].text&&JSON.stringify(d.images||[])===JSON.stringify(rec.detail[j].images||[]);});
      if(!same)throw Error('云端已存在不同的作答，请联系老师核对');
      return;
    }
    return CLD.putVerified('rec:'+rid,rec,['rid','code','cls','taskId','detail','completed']);
  }).then(function () {
    return appendToIndex('idx:rec:' + PLAY.task.id + ':' + S.me.cls, rid, 3);
  }).then(function () {
    return CLD.put('draft:' + S.me.code + ':' + PLAY.task.id, { rid: rid, done: true, at: nowStr(), __v: 1 })
      .catch(function () {});

    $('pane').innerHTML = '<div class="card" style="text-align:center">' +
      '<h2>已提交</h2>' +
      '<div class="score-big">' + (avg===null?'待老师批改':avg) + '</div>' +
      '<div class="sub">'+(isExamRecord(rec)?'试题满分 '+rec.totalMax+' 分；目前已评分得分 '+rec.earnedScore+' 分'+(rec.gradingPending?'，主观题等待老师评分。':'，以上为各题得分之和。'):'建议分（满分 100）· 原文匹配 25% + 要点覆盖 75%')+'</div>' +
      '<div class="m-info msg" style="text-align:left">作答已保存到服务器，老师可以在自己的设备上看到并复核。最终成绩以老师复核为准。</div>' +

/* ================= 成绩复核后台 ================= */
/* Literal answer comparison only. Highlights support teacher review; they do not grade meaning.
   The original text stays intact, while spacing, punctuation, case and full-width ASCII
   are ignored when finding matching characters. */
function reviewAnswerDiff(reference, answer) {
  var MAX_CELLS = 1000000;
  var punctuation = /[\s\p{P}]/u;

  function escapeText(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function prepare(value) {
    var original = Array.from(String(value == null ? '' : value));
    var tokens = [], positions = [];
    original.forEach(function (ch, index) {
      var code = ch.codePointAt(0);
      var normalized = code >= 0xff01 && code <= 0xff5e ? String.fromCharCode(code - 0xfee0) : ch;
      if (punctuation.test(normalized)) return;
      tokens.push(normalized.toLowerCase());
      positions.push(index);
    });
    return { original: original, tokens: tokens, positions: positions, matched: new Uint8Array(tokens.length) };
  }

  var ref = prepare(reference), ans = prepare(answer);
  var start = 0, refEnd = ref.tokens.length, ansEnd = ans.tokens.length;
  var simplified = false;
  while (start < refEnd && start < ansEnd && ref.tokens[start] === ans.tokens[start]) {
    ref.matched[start] = ans.matched[start] = 1;
    start++;
  }
  while (refEnd > start && ansEnd > start && ref.tokens[refEnd - 1] === ans.tokens[ansEnd - 1]) {
    ref.matched[--refEnd] = ans.matched[--ansEnd] = 1;
  }

  var n = refEnd - start, m = ansEnd - start;
  if (n && m) {
    if ((n + 1) * (m + 1) <= MAX_CELLS) {
      var width = m + 1;
      var table = new Uint32Array((n + 1) * width);
      var i, j;
      for (i = n - 1; i >= 0; i--) {
        for (j = m - 1; j >= 0; j--) {
          table[i * width + j] = ref.tokens[start + i] === ans.tokens[start + j]
            ? table[(i + 1) * width + j + 1] + 1
            : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
        }
      }
      i = 0; j = 0;
      while (i < n && j < m) {
        if (ref.tokens[start + i] === ans.tokens[start + j]) {
          ref.matched[start + i] = ans.matched[start + j] = 1;
          i++; j++;
        } else if (table[(i + 1) * width + j] >= table[i * width + j + 1]) {
          i++;
        } else {
          j++;
        }
      }
    } else {
      /* Very long changed passages: keep matching ends and highlight the middle.
         The caller should explain that this is a paragraph-level comparison. */
      simplified = true;
    }
  }

  function render(prepared, className) {
    var changed = new Uint8Array(prepared.original.length);
    var any = false;
    prepared.positions.forEach(function (position, index) {
      if (!prepared.matched[index]) { changed[position] = 1; any = true; }
    });
    var html = '', chunk = '', marked = false;
    function flush() {
      if (!chunk) return;
      html += marked ? '<mark class="' + className + '">' + escapeText(chunk) + '</mark>' : escapeText(chunk);
      chunk = '';
    }
    prepared.original.forEach(function (ch, index) {
      var nextMarked = !!changed[index];
      if (nextMarked !== marked) { flush(); marked = nextMarked; }
      chunk += ch;
    });
    flush();
    return { html: html, different: any };
  }

  var left = render(ref, 'review-missing');
  var right = render(ans, 'review-different');
  return {
    referenceHtml: left.html,
    answerHtml: right.html,
    different: left.different || right.different,
    simplified: simplified
  };
}

var REVIEW = { rid: '', drafts: {}, loading: 0, tasksLoading: 0, saving: false, returnIndex: -1 };

/* Per-question analysis of recorded system suggestion scores, not whole-paper teacher grades.
   Returns an array sorted by avg ascending (null last). Each current student contributes
   only their latest answer per question in the selected class/task. Ties use rid then
   source position so repeated runs are deterministic. No record or member is modified.
   count = valid scored students; answeredCount = selected answers; totalMembers = roster.
   avg is rounded to one decimal; missing scores are null, never silently zero.
   pointMisses / termMisses entries are {label,count}, each student counted once per label.
   answers retain original recordIndex/detailIndex for optional review navigation. */
function buildQuestionStats(records, members, classCode, taskId) {
  if (classCode == null || taskId == null || !String(classCode).trim() || !String(taskId).trim()) return [];
  records = Array.isArray(records) ? records : [];
  members = Array.isArray(members) ? members : [];
  var roster = Object.create(null), groups = Object.create(null);
  function codeKey(code) { return String(code == null ? '' : code).trim().toLowerCase(); }
  members.forEach(function (code) { var k = codeKey(code); if (k) roster[k] = true; });
  var totalMembers = Object.keys(roster).length;
  function validScore(value) {
    var n;
    if (typeof value === 'number') n = value;
    else if (typeof value === 'string' && /^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(value.trim())) n = Number(value.trim());
    else return null;
    return isFinite(n) && n >= 0 && n <= 100 ? n : null;
  }
  function compareSnapshots(a, b) {
    if (a.at !== b.at) return a.at < b.at ? -1 : 1;
    if (a.rid !== b.rid) return a.rid < b.rid ? -1 : 1;
    if (a.recordIndex !== b.recordIndex) return a.recordIndex - b.recordIndex;
    return a.detailIndex - b.detailIndex;
  }
  records.forEach(function (r, recordIndex) {
    if (!r || String(r.cls == null ? '' : r.cls) !== String(classCode == null ? '' : classCode) ||
        String(r.taskId == null ? '' : r.taskId) !== String(taskId == null ? '' : taskId)) return;
    var code = codeKey(r.code);
    if (!code || !roster[code]) return;
    (Array.isArray(r.detail) ? r.detail : []).forEach(function (d, detailIndex) {
      if (!d || typeof d !== 'object') return;
      var qid = d.qid == null ? '' : String(d.qid).trim();
      var q = typeof d.q === 'string' ? d.q : '';
      var identified = !!qid || !!q.trim();
      var key = qid ? 'id:' + qid : (q.trim() ? 'text:' + q : 'unknown:' + recordIndex + ':' + detailIndex);
      var snapshot = {
        code: code, name: String(r.name || r.code || code), recordIndex: recordIndex,
        detailIndex: detailIndex, at: String(r.at || ''), rid: String(r.rid || ''),
        score: validScore(typeof questionMax==='function'&&d.type?((typeof effectiveQuestionScore(d)==='number')?effectiveQuestionScore(d)/questionMax(d)*100:null):effectiveQuestionScore(d)), detail: d
      };
      var group = groups[key];
      if (!group) group = groups[key] = { key: key, identified: identified, latest: snapshot, students: Object.create(null) };
      if (compareSnapshots(snapshot, group.latest) > 0) group.latest = snapshot;
      if (!group.students[code] || compareSnapshots(snapshot, group.students[code]) > 0) group.students[code] = snapshot;
    });
  });
  function addLabels(counter, labels) {
    var seen = Object.create(null);
    labels.forEach(function (label) {
      if (!label || seen[label]) return;
      seen[label] = true; counter[label] = (counter[label] || 0) + 1;
    });
  }
  function counts(counter) {
    return Object.keys(counter).map(function (label) { return { label: label, count: counter[label] }; })
      .sort(function (a, b) { return b.count - a.count || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0); });
  }
  return Object.keys(groups).map(function (key) {
    var group = groups[key], count = 0, total = 0, lowCount = 0;
    var pointCounts = Object.create(null), termCounts = Object.create(null);
    var answers = Object.keys(group.students).sort().map(function (code) {
      var x = group.students[code], d = x.detail;
      if (x.score !== null) { count++; total += x.score; if (x.score < 60) lowCount++; }
      var labels = [];
      (Array.isArray(d.points) ? d.points : []).forEach(function (p) {
        if (!p || p.ok !== false || !Array.isArray(p.g)) return;
        // Synonym order is immaterial; normalize it to avoid double counting one group.
        var words = Array.from(new Set(p.g.filter(function (v) { return typeof v === 'string' && v.trim(); }).map(function (v) { return v.trim(); }))).sort();
        if (words.length) labels.push(words.join(' / '));
      });
      addLabels(pointCounts, labels);
      addLabels(termCounts, (Array.isArray(d.missingTerms) ? d.missingTerms : []).filter(function (v) { return typeof v === 'string'; }).map(function (v) { return v.trim(); }));
      return { code: x.code, name: x.name, recordIndex: x.recordIndex, detailIndex: x.detailIndex,
        at: x.at, rid: x.rid, score: x.score };
    });
    var latest = group.latest.detail;
    return {
      key: key, q: typeof latest.q === 'string' && latest.q.trim() ? latest.q : '题目未保存（无法确认题干）',
      reference: typeof latest.a === 'string' ? latest.a : '', identified: group.identified,
      count: count, answeredCount: answers.length, totalMembers: totalMembers,

function saveReview(index,returnAfter) {
  if (REVIEW.saving) return Promise.resolve();
  var r = (S.gradeRecs || [])[index];
  if (!r || r.rid !== REVIEW.rid || !$('reviewScore') || !$('reviewFeedback')) return Promise.resolve();
  var raw = $('reviewScore').value.trim(), score = Number(raw), feedback = $('reviewFeedback').value.trim();
  if (!raw || !isFinite(score) || Math.floor(score) !== score || score < 0 || score > 100) {
    setMsg('reviewMsg', '复核分请填写 0–100 的整数，不能留空。', 'err'); return Promise.resolve();
  }
  if (!S.me || S.me.role !== 'teacher') { setMsg('reviewMsg', '请使用教师账号进行复核。', 'err'); return Promise.resolve(); }
  var questions=reviewQuestionInputs(r),savedOk=false;
  if(questions.some(function(q){var n=Number(q.score);return !q.score.trim()||!isFinite(n)||n<0||n>100||Math.floor(n)!==n;})){setMsg('reviewMsg','每题复核分须为0–100的整数。','err');return Promise.resolve();}
  var teacher = S.me.code, cls = S.gradeCls, taskId = r.taskId, rid = r.rid;
  rememberReviewDraft(); REVIEW.saving = true;
  ['reviewSave', 'reviewBack', 'reviewBottomBack', 'reviewSaveBack', 'reviewAttempt', 'reviewScore', 'reviewFeedback'].forEach(function (id) { if ($(id)) $(id).disabled = true; });
  setMsg('reviewMsg', '正在保存…', 'info');
  return CLD.update('rec:' + rid, function (cur) {
    if (!cur || cur.rid !== rid || cur.code !== r.code || cur.cls !== cls || cur.taskId !== taskId) throw new Error('作答记录已变化，请返回名单刷新后重试');
    if((cur.detail||[]).length!==questions.length)throw Error('题目记录已变化，请刷新后复核');
    cur.detail.forEach(function(d,j){if(d.qid!==questions[j].qid)throw Error('题目已变化');d.teacherScore=Number(questions[j].score);d.teacherFeedback=questions[j].feedback.trim();});
    cur.teacherScore = score; cur.feedback = feedback; cur.reviewed = true;
    cur.reviewAt = nowStr(); cur.reviewBy = teacher; cur.__v = (cur.__v || 0) + 1;
    return cur;
  }).then(function (saved) {
    savedOk=true;delete REVIEW.drafts[rid];
    if (!S.me || S.me.code !== teacher || S.gradeCls !== cls || !S.gradeTask || S.gradeTask.id !== taskId) return;
    S.gradeRecs = (S.gradeRecs || []).map(function (x) { return x.rid === rid ? saved : x; });
    if ($('gdRoster')) paintGradeOverview();
    if (REVIEW.rid === rid && $('gdDetail')) {
      var selected = S.gradeRecs.findIndex(function (x) { return x.rid === rid; });
      renderReviewDetail(selected);
      setMsg('reviewMsg', '已保存：' + (r.name || r.code) + '，复核分 ' + score + ' 分。', 'ok');
    }
  }).catch(function (e) {
    if (REVIEW.rid === rid) setMsg('reviewMsg', e.message || '保存失败，填写内容已保留，请重试。', 'err');
  }).finally(function () {
    REVIEW.saving = false;
    if(savedOk&&returnAfter&&REVIEW.rid===rid)closeReview();
    ['reviewSave', 'reviewBack', 'reviewBottomBack', 'reviewSaveBack', 'reviewAttempt', 'reviewScore', 'reviewFeedback'].forEach(function (id) { if ($(id)) $(id).disabled = false; });
  });
}

function copyRoster(kind) {
  var c = S.rosterCache || {};
  var arr = kind === 'todo' ? (c.todo || []) : (c.done || []);
  var title = kind === 'todo' ? '未提交名单' : '已提交名单';
  if (!arr.length) {
    setMsg('gdMsg', kind === 'todo' ? '没有未提交的学生' : '还没有学生提交', 'info');
    return;
  }
  var txt = title + '（' + arr.length + ' 人）\n' + arr.join('\n');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
      setMsg('gdMsg', title + '已复制（' + arr.length + ' 人）', 'ok');
      return;
    }
  } catch (e) {}
  download(title + '-' + today() + '.txt', txt, 'text/plain');
  setMsg('gdMsg', '已改为下载文件：' + title + '（' + arr.length + ' 人）', 'info');
}

/* 试题题型、教师组卷与主观题照片作答 */
function isExamQuestion(q){return !!q&&['blank','choice','subjective'].indexOf(q.type)>=0;}
function isExamRecord(r){return !!r&&(r.kind==='exam'||(r.detail||[]).some(isExamQuestion));}
function questionMax(q){if(!q)return 100;if(q.type==='blank')return 1;if(q.type==='choice')return 2;if(q.type==='subjective')return typeof q.maxScore==='number'&&isFinite(q.maxScore)&&q.maxScore>0?q.maxScore:10;return 100;}
function examQuestionLabel(q){return {blank:'填空题',choice:'选择题',subjective:'主观题'}[(q||{}).type]||'背诵题';}
function examRecordSummary(r){
 var total=0,earned=0,pending=false;
 (r.detail||[]).forEach(function(d){var max=questionMax(d),score=typeof d.teacherScore==='number'?d.teacherScore:d.score;total+=max;
   if(typeof score!=='number'||!isFinite(score)||score<0||score>max)pending=true;else earned+=score;
 });
 return {totalMax:total,earnedScore:earned,score:!pending&&total?earned:null,gradingPending:pending};
}
function normalizeExamBlank(text){var s=String(text||'');if(s.normalize)s=s.normalize('NFKC');return s.replace(/\s+/g,'').toLowerCase();}
function gradeExamAnswer(text,q){
 var score=null,pending=q.type==='subjective',a=String(q.a||'');
 if(q.type==='choice')score=String(text).trim().toUpperCase()===a.trim().toUpperCase()?2:0;
 if(q.type==='blank')score=a.split('|').some(function(answer){return normalizeExamBlank(answer)!==''&&normalizeExamBlank(answer)===normalizeExamBlank(text);})?1:0;
 return {score:score,raw:0,cover:0,points:[],missingTerms:[],negWarn:false,pending:pending};
}
function examOptionsHtml(q){return (q.options||[]).map(function(x,i){return '<div class="exam-option-text">'+String.fromCharCode(65+i)+'. '+esc(x)+'</div>';}).join('');}
function examImagesHtml(q){return '<div class="exam-answer-images">'+((q||{}).images||[]).filter(function(url){return typeof url==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url);}).map(function(url,i){return '<a href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" alt="学生作答照片 '+(i+1)+'"></a>';}).join('')+'</div>';}
function selectedBankMode(){var id=$('qBank')&&$('qBank').value,b=(S.banks||[]).filter(function(x){return x.id===id;})[0];return b&&b.mode==='exam'?'exam':'recitation';}
function syncBankMode(){
 var isExam=selectedBankMode()==='exam';
 if($('recitationComposer'))$('recitationComposer').className=isExam?'hide':'';
 if($('examComposer'))$('examComposer').className=isExam?'':'hide';

var NOTEBOOK={token:0,context:null,practice:null,busy:false};
function nbScope(u){return encodeURIComponent(String(u.code).toLowerCase()+'|'+(u.accountId||u.at||'legacy'));}
function nbMax(d){return typeof questionMax==='function'?questionMax(d):(d.type==='blank'?1:d.type==='choice'?2:Number(d.maxScore)||100);}
function nbSignature(d){return JSON.stringify([d.type||'recitation',d.qid||'',d.q||'',d.a||'',d.options||[],nbMax(d)]);}
function nbEffectiveScore(d){var n=typeof d.teacherScore==='number'?d.teacherScore:d.score;return typeof n==='number'&&isFinite(n)?n:null;}
function nbCount(entry,item){return ((entry||{}).attempts||[]).filter(function(a){return a&&Array.isArray(a.covered)&&item.sources.every(function(source){return a.covered.indexOf(source)>=0;});}).length;}
function nbBuildItems(records,u,progress){
  var by=Object.create(null),seen=Object.create(null);
  (records||[]).forEach(function(r){
    if(!r||!r.rid||seen[r.rid]||r.code!==u.code||r.cls!==u.cls||String(r.accountId||'')!==String(u.accountId||''))return;
    if(u.at&&r.at&&String(r.at)<String(u.at))return;
    seen[r.rid]=true;
    (r.detail||[]).forEach(function(d,i){
      var score=nbEffectiveScore(d),max=nbMax(d);
      if(score===null||!isFinite(max)||max<=0||score>=max||score<0)return;
      var key=nbSignature(d),source=r.rid+'#'+i;
      var item=by[key];
      if(!item)item=by[key]={key:key,detail:d,sources:[],at:r.at||'',taskTitle:r.taskTitle||'',score:score,max:max};
      if(item.sources.indexOf(source)<0)item.sources.push(source);
      if(String(r.at||'')>=item.at){item.detail=d;item.at=r.at||'';item.taskTitle=r.taskTitle||'';item.score=score;}
    });
  });
  return Object.keys(by).map(function(key){var item=by[key];item.sources.sort();item.count=Math.min(3,nbCount((progress.entries||{})[key],item));return item;}).sort(function(a,b){return String(b.at).localeCompare(String(a.at))||a.key.localeCompare(b.key);});
}

    return Promise.all([growthMapLimit(ids,function(id){return CLD.get('rec:'+id);}),CLD.get('mistake_progress:'+nbScope(u))]);

}

 if(['blank','choice','subjective'].indexOf(type)<0||!q||!a)throw Error('第'+(i+1)+'题缺少题型、题目或答案');
 if(!Number.isInteger(max)||max<1||max>100)throw Error('第'+(i+1)+'题主观题分值须为1–100整数');
 if(type==='choice'){a=a.toUpperCase();if(!Array.isArray(opts)||opts.length<2||opts.length>8||opts.some(function(x){return typeof x!=='string'||!x.trim();})||!/^[A-H]$/.test(a)||a.charCodeAt(0)-65>=opts.length)throw Error('第'+(i+1)+'题选项或答案字母不正确');}
 return {qid:newId(10),stemMedia:jsonStemMedia(r),type:type,q:q,a:a,maxScore:max,options:type==='choice'?opts:[],points:[],terms:[]};});
}
function importExamBatch(){
 if(EXAM_IMPORT_BUSY)return Promise.resolve();var bid=$('qBank').value,raw=$('examImportText').value,items;
 try{items=parseExamImport(raw);}catch(e){setMsg('examImportMsg',e.message,'err');return Promise.resolve();}
 var owner=S.me.code;EXAM_IMPORT_BUSY=true;setMsg('examImportMsg','正在导入 '+items.length+' 道题…','info');
 return CLD.update('bank:'+bid,function(b){if(!b||b.owner!==owner||b.mode!=='exam')throw Error('请先选择自己的试题');b.items=b.items||[];items.forEach(function(it){if(!b.items.some(function(x){return x.qid===it.qid;}))b.items.push(it);});b.__v=(b.__v||0)+1;return b;}).then(function(){return loadBanks();}).then(function(){renderQList();$('examImportText').value='';setMsg('examImportMsg','已追加 '+items.length+' 道题到所选试题。','ok');}).catch(function(e){setMsg('examImportMsg',e.message||'导入失败','err');}).finally(function(){EXAM_IMPORT_BUSY=false;});
}
function mountExamImport(){if(!$('examComposer')||$('examImportText'))return;$('examComposer').insertAdjacentHTML('beforeend','<details class="card" open><summary>整份试题一键导入</summary><div class="sub">粘贴下面格式的整份试题，或JSON题目数组。导入会追加到当前试题；所有题目校验通过后才保存。</div><details><summary>查看可复制的格式示例</summary><pre style="white-space:pre-wrap">'+esc(examImportExample())+'</pre><button class="ghost" onclick="download(\'试题导入模板.txt\',examImportExample(),\'text/plain\')">下载模板</button></details><textarea id="examImportText" style="min-height:240px" placeholder="在这里粘贴整份试题"></textarea><button onclick="importExamBatch()">一键导入到当前试题</button><div id="examImportMsg"></div></details>');}
var syncBankModeBeforeImport=syncBankMode;
syncBankMode=function(){syncBankModeBeforeImport();if(selectedBankMode()==='exam')mountExamImport();};

var EXAM_NAV_SAVING=false;
var renderExamBeforeNavigation=renderPlay;
renderPlay=function(){
 renderExamBeforeNavigation();var it=PLAY.items[PLAY.idx];if(!isExamQuestion(it))return;
 var old=PLAY.results.filter(function(r){return r.qid===it.qid;})[0];
 if(old){$('ansBox').value=old.text==='[图片作答]'?'':old.text||'';$('ansNote').value=old.studentNote||'';EXAM_PHOTOS=(old.images||[]).slice();if(it.type==='subjective')paintExamPhotos();if(it.type==='choice')Array.prototype.forEach.call(document.querySelectorAll('input[name="examChoice"]'),function(el){el.checked=el.value===old.text;});}
 $('subBtn').textContent='保存本题（暂不提交）';$('subBtn').setAttribute('onclick','saveExamDraftCurrent()');
 var nav='<div class="exam-question-nav" style="display:flex;flex-wrap:wrap;gap:6px;margin:16px 0">'+PLAY.items.map(function(q,i){var answered=PLAY.results.some(function(r){return r.qid===q.qid;});return '<button class="sm '+(i===PLAY.idx?'gold':'ghost')+'" onclick="goExamQuestion('+i+')">'+(i+1)+(answered?' ✓':'')+'</button>';}).join('')+'</div><div class="row"><button class="ghost" '+(PLAY.idx===0?'disabled':'')+' onclick="goExamQuestion('+(PLAY.idx-1)+')">上一题</button><button class="ghost" '+(PLAY.idx===PLAY.items.length-1?'disabled':'')+' onclick="goExamQuestion('+(PLAY.idx+1)+')">下一题</button></div><button class="gold" onclick="submitWholeExam()">提交整份试题</button><div class="sub">切换题目会保存当前答案，可返回修改。只有点击「提交整份试题」才会计入成绩。</div>';
 $('fbBox').innerHTML='<div id="examNavMsg"></div>'+nav;
};
function saveExamDraftCurrent(){
 if(EXAM_NAV_SAVING||PLAY.locked||EXAM_PHOTO_BUSY)return Promise.resolve(false);
 var it=PLAY.items[PLAY.idx];if(!isExamQuestion(it))return Promise.resolve(false);
 var text=$('ansBox').value.trim(),images=EXAM_PHOTOS.slice(),note=$('ansNote').value.trim().slice(0,1000);
 PLAY.results=PLAY.results.filter(function(r){return r.qid!==it.qid;});
 if(text||images.length)PLAY.results.push({qid:it.qid,q:it.q,stemMedia:it.stemMedia||[],a:it.a,type:it.type,maxScore:questionMax(it),options:(it.options||[]).slice(),text:text||(images.length?'[图片作答]':''),images:images,g:gradeExamAnswer(text,it),studentNote:note});
 PLAY.results.sort(function(a,b){return PLAY.items.findIndex(function(q){return q.qid===a.qid;})-PLAY.items.findIndex(function(q){return q.qid===b.qid;});});
 var draft={rid:PLAY.rid,code:S.me.code,cls:S.me.cls,taskId:PLAY.task.id,results:PLAY.results,at:nowStr(),savedAt:Date.now(),currentIndex:PLAY.idx,__v:1};
 var local=saveLocalDraft(draft);EXAM_NAV_SAVING=true;PLAY.locked=true;setMsg('examNavMsg','正在保存当前作答…','info');
 return CLD.put('draft:'+S.me.code+':'+PLAY.task.id,draft).then(function(){setMsg('examNavMsg','已保存，可继续修改；尚未提交试题。','ok');return true;}).catch(function(e){setMsg('examNavMsg',local?'云端暂存失败，已备份到本机，可继续作答。':'云端和本机暂存均失败，请勿关闭页面。','warn');return true;}).finally(function(){EXAM_NAV_SAVING=false;PLAY.locked=false;});
}
function goExamQuestion(index){if(index<0||index>=PLAY.items.length||EXAM_NAV_SAVING||PLAY.locked||EXAM_PHOTO_BUSY)return Promise.resolve();return saveExamDraftCurrent().then(function(ok){if(ok){PLAY.idx=index;renderPlay();}});}
function submitWholeExam(){if(EXAM_NAV_SAVING||PLAY.locked||EXAM_PHOTO_BUSY)return Promise.resolve();return saveExamDraftCurrent().then(function(ok){if(!ok)return;var missing=[];PLAY.items.forEach(function(q,i){if(!PLAY.results.some(function(r){return r.qid===q.qid;}))missing.push(i+1);});if(missing.length){setMsg('examNavMsg','第 '+missing.join('、')+' 题尚未作答，请完成后提交。','err');return;}if(confirm('确认提交整份试题？提交前可以继续返回修改答案。'))return finishTask();});}

function finalizeTaskExamReviews(){
 if(TEACHER_REVIEW.bulkBusy||REVIEW.saving||!S.me||S.me.role!=='teacher'||!S.gradeTask)return Promise.resolve();
 var records=(S.gradeRecs||[]).filter(isExamRecord),pending=records.filter(function(r){return (r.detail||[]).some(function(d){return d.type==='subjective'&&(!d.teacherReviewed||!teacherValidMark(d.teacherScore,teacherQMax(d)));});});
 if(!records.length){setMsg('gdMsg','当前任务没有试题。','info');return Promise.resolve();}
 if(pending.length){var message='还有 '+pending.length+' 份试题的主观题未全部批改，请先按题完成。';setMsg('gdMsg',message,'warn');setMsg('reviewMsg',message,'warn');return Promise.resolve();}
 TEACHER_REVIEW.bulkBusy=true;var failures=[],saved=0;
 return growthMapLimit(records,function(r){return teacherPersistReview(r,function(cur,owner){if(cur.detail.some(function(d){return d.type==='subjective'&&(!d.teacherReviewed||!teacherValidMark(d.teacherScore,teacherQMax(d)));}))throw Error('主观题尚未完成');cur.detail.forEach(function(d){if(d.type!=='subjective'&&!d.teacherReviewed){if(!teacherValidMark(d.score,teacherQMax(d)))throw Error('客观题得分异常');d.teacherScore=d.score;d.teacherReviewed=true;}});return teacherFinalizeRecord(cur,owner,null);}).then(function(){saved++;}).catch(function(e){failures.push((r.name||r.code)+'：'+e.message);});}).then(function(){closeReview();setMsg('gdMsg','已正式保存 '+saved+' 份试题复核。'+(failures.length?'失败：'+failures.join('；'):'现在可直接导出卷面成绩。'),failures.length?'warn':'ok');}).finally(function(){TEACHER_REVIEW.bulkBusy=false;});
}
function nextSubjectiveQuestion(){var choices=teacherQuestionChoices(),at=choices.findIndex(function(q){return q.key===TEACHER_REVIEW.questionKey;});if(at+1<choices.length)chooseQuestionReview(at+1);else setMsg('reviewMsg','已到最后一道主观题，全部批改完成后点击统一保存本任务复核。','info');}
function examDisplayScore(r){if(!isExamRecord(r))return r.reviewed?r.teacherScore:r.score;var t=teacherRecordTotal(r);return t.pending?'待批改':t.raw;}

/* ================= 启动 ================= */

/* 云端连通性自检：把真实原因显示出来，不再只甩一句 failed to fetch */
function probeCloud() {
  return CLD.rows('healthcheck').then(function () {
    return { ok: true };
  }).catch(function (e) {
    return { ok: false, msg: (e && e.message) || '连不上云端服务器' };
  });
}

(function boot() {
  var loading = document.createElement('div');
  loading.className = 'wrap';
  loading.innerHTML = '<div class="card" style="text-align:center;margin-top:40px">' +
    '<div class="empty">正在连接服务器…</div></div>';
  document.body.appendChild(loading);

  function done(probe, ok) {
    try { loading.remove(); } catch (e) {}
    if (ok) { enterApp(); return; }
    $('authView').className = '';
    $('appView').className = 'hide';
    if (!probe.ok) {
      setMsg('lgMsg',
        '云端连接失败：' + probe.msg +
        '。请确认网络可用后刷新页面；若持续失败，说明平台数据接口暂时不可达，请联系老师。',
        'err');
      var rb = $('rgMsg');
      if (rb) setMsg('rgMsg', '云端连接失败：' + probe.msg, 'err');
    }
  }

  /* 12 秒超时兜底：网络卡住也必须让登录界面可用 */
  var settled = false;
  setTimeout(function () {
    if (settled) return;
    settled = true;
    try { loading.remove(); } catch (e) {}
    $('authView').className = '';
    $('appView').className = 'hide';
    setMsg('lgMsg', '连接云端超时（12 秒）。请检查网络后刷新页面重试。', 'err');
  }, 12000);

  Promise.resolve().then(function () {
    return probeCloud();
  }).catch(function (e) {
    return { ok: false, msg: (e && e.message) || '连通性自检异常' };
  }).then(function (probe) {
    return restoreSession().catch(function () { return false; }).then(function (ok) {
      if (settled) return;
      settled = true;
      done(probe, ok);
    });
  });
})();
