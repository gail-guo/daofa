/* ================= 成绩复核后台 ================= */
/* Literal answer comparison only. Highlights support teacher review; they do not grade meaning.
   The original text stays intact, while spacing, punctuation, case and full-width ASCII
   are ignored when finding matching characters. */
function reviewAnswerDiff(reference, answer) {
  var MAX_CELLS = 1000000;
  var punctuation = /[\s\p{P}]/u;

  function escapeText(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function prepare(value) {
    var original = Array.from(String(value == null ? '' : value));
    var tokens = [], positions = [];
    original.forEach(function (ch, index) {
      var code = ch.codePointAt(0);
      var normalized = code >= 0xff01 && code <= 0xff5e ? String.fromCharCode(code - 0xfee0) : ch;
      if (punctuation.test(normalized)) return;
      tokens.push(normalized.toLowerCase());
      positions.push(index);
    });
    return { original: original, tokens: tokens, positions: positions, matched: new Uint8Array(tokens.length) };
  }

  var ref = prepare(reference), ans = prepare(answer);
  var start = 0, refEnd = ref.tokens.length, ansEnd = ans.tokens.length;
  var simplified = false;
  while (start < refEnd && start < ansEnd && ref.tokens[start] === ans.tokens[start]) {
    ref.matched[start] = ans.matched[start] = 1;
    start++;
  }
  while (refEnd > start && ansEnd > start && ref.tokens[refEnd - 1] === ans.tokens[ansEnd - 1]) {
    ref.matched[--refEnd] = ans.matched[--ansEnd] = 1;
  }

  var n = refEnd - start, m = ansEnd - start;
  if (n && m) {
    if ((n + 1) * (m + 1) <= MAX_CELLS) {
      var width = m + 1;
      var table = new Uint32Array((n + 1) * width);
      var i, j;
      for (i = n - 1; i >= 0; i--) {
        for (j = m - 1; j >= 0; j--) {
          table[i * width + j] = ref.tokens[start + i] === ans.tokens[start + j]
            ? table[(i + 1) * width + j + 1] + 1
            : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
        }
      }
      i = 0; j = 0;
      while (i < n && j < m) {
        if (ref.tokens[start + i] === ans.tokens[start + j]) {
          ref.matched[start + i] = ans.matched[start + j] = 1;
          i++; j++;
        } else if (table[(i + 1) * width + j] >= table[i * width + j + 1]) {
          i++;
        } else {
          j++;
        }
      }
    } else {
      /* Very long changed passages: keep matching ends and highlight the middle.
         The caller should explain that this is a paragraph-level comparison. */
      simplified = true;
    }
  }

  function render(prepared, className) {
    var changed = new Uint8Array(prepared.original.length);
    var any = false;
    prepared.positions.forEach(function (position, index) {
      if (!prepared.matched[index]) { changed[position] = 1; any = true; }
    });
    var html = '', chunk = '', marked = false;
    function flush() {
      if (!chunk) return;
      html += marked ? '<mark class="' + className + '">' + escapeText(chunk) + '</mark>' : escapeText(chunk);
      chunk = '';
    }
    prepared.original.forEach(function (ch, index) {
      var nextMarked = !!changed[index];
      if (nextMarked !== marked) { flush(); marked = nextMarked; }
      chunk += ch;
    });
    flush();
    return { html: html, different: any };
  }

  var left = render(ref, 'review-missing');
  var right = render(ans, 'review-different');
  return {
    referenceHtml: left.html,
    answerHtml: right.html,
    different: left.different || right.different,
    simplified: simplified
  };
}

var REVIEW = { rid: '', drafts: {}, loading: 0, tasksLoading: 0, saving: false, returnIndex: -1 };

/* Per-question analysis of recorded system suggestion scores, not whole-paper teacher grades.
   Returns an array sorted by avg ascending (null last). Each current student contributes
   only their latest answer per question in the selected class/task. Ties use rid then
   source position so repeated runs are deterministic. No record or member is modified.
   count = valid scored students; answeredCount = selected answers; totalMembers = roster.
   avg is rounded to one decimal; missing scores are null, never silently zero.
   pointMisses / termMisses entries are {label,count}, each student counted once per label.
   answers retain original recordIndex/detailIndex for optional review navigation. */
function buildQuestionStats(records, members, classCode, taskId) {
  if (classCode == null || taskId == null || !String(classCode).trim() || !String(taskId).trim()) return [];
  records = Array.isArray(records) ? records : [];
  members = Array.isArray(members) ? members : [];
  var roster = Object.create(null), groups = Object.create(null);
  function codeKey(code) { return String(code == null ? '' : code).trim().toLowerCase(); }
  members.forEach(function (code) { var k = codeKey(code); if (k) roster[k] = true; });
  var totalMembers = Object.keys(roster).length;
  function validScore(value) {
    var n;
    if (typeof value === 'number') n = value;
    else if (typeof value === 'string' && /^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(value.trim())) n = Number(value.trim());
    else return null;
    return isFinite(n) && n >= 0 && n <= 100 ? n : null;
  }
  function compareSnapshots(a, b) {
    if (a.at !== b.at) return a.at < b.at ? -1 : 1;
    if (a.rid !== b.rid) return a.rid < b.rid ? -1 : 1;
    if (a.recordIndex !== b.recordIndex) return a.recordIndex - b.recordIndex;
    return a.detailIndex - b.detailIndex;
  }
  records.forEach(function (r, recordIndex) {
    if (!r || String(r.cls == null ? '' : r.cls) !== String(classCode == null ? '' : classCode) ||
        String(r.taskId == null ? '' : r.taskId) !== String(taskId == null ? '' : taskId)) return;
    var code = codeKey(r.code);
    if (!code || !roster[code]) return;
    (Array.isArray(r.detail) ? r.detail : []).forEach(function (d, detailIndex) {
      if (!d || typeof d !== 'object') return;
      var qid = d.qid == null ? '' : String(d.qid).trim();
      var q = typeof d.q === 'string' ? d.q : '';
      var identified = !!qid || !!q.trim();
      var key = qid ? 'id:' + qid : (q.trim() ? 'text:' + q : 'unknown:' + recordIndex + ':' + detailIndex);
      var snapshot = {
        code: code, name: String(r.name || r.code || code), recordIndex: recordIndex,
        detailIndex: detailIndex, at: String(r.at || ''), rid: String(r.rid || ''),
        score: validScore(typeof questionMax==='function'&&d.type?((typeof effectiveQuestionScore(d)==='number')?effectiveQuestionScore(d)/questionMax(d)*100:null):effectiveQuestionScore(d)), detail: d
      };
      var group = groups[key];
      if (!group) group = groups[key] = { key: key, identified: identified, latest: snapshot, students: Object.create(null) };
      if (compareSnapshots(snapshot, group.latest) > 0) group.latest = snapshot;
      if (!group.students[code] || compareSnapshots(snapshot, group.students[code]) > 0) group.students[code] = snapshot;
    });
  });
  function addLabels(counter, labels) {
    var seen = Object.create(null);
    labels.forEach(function (label) {
      if (!label || seen[label]) return;
      seen[label] = true; counter[label] = (counter[label] || 0) + 1;
    });
  }
  function counts(counter) {
    return Object.keys(counter).map(function (label) { return { label: label, count: counter[label] }; })
      .sort(function (a, b) { return b.count - a.count || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0); });
  }
  return Object.keys(groups).map(function (key) {
    var group = groups[key], count = 0, total = 0, lowCount = 0;
    var pointCounts = Object.create(null), termCounts = Object.create(null);
    var answers = Object.keys(group.students).sort().map(function (code) {
      var x = group.students[code], d = x.detail;
      if (x.score !== null) { count++; total += x.score; if (x.score < 60) lowCount++; }
      var labels = [];
      (Array.isArray(d.points) ? d.points : []).forEach(function (p) {
        if (!p || p.ok !== false || !Array.isArray(p.g)) return;
        // Synonym order is immaterial; normalize it to avoid double counting one group.
        var words = Array.from(new Set(p.g.filter(function (v) { return typeof v === 'string' && v.trim(); }).map(function (v) { return v.trim(); }))).sort();
        if (words.length) labels.push(words.join(' / '));
      });
      addLabels(pointCounts, labels);
      addLabels(termCounts, (Array.isArray(d.missingTerms) ? d.missingTerms : []).filter(function (v) { return typeof v === 'string'; }).map(function (v) { return v.trim(); }));
      return { code: x.code, name: x.name, recordIndex: x.recordIndex, detailIndex: x.detailIndex,
        at: x.at, rid: x.rid, score: x.score };
    });
    var latest = group.latest.detail;
    return {
      key: key, q: typeof latest.q === 'string' && latest.q.trim() ? latest.q : '题目未保存（无法确认题干）',
      reference: typeof latest.a === 'string' ? latest.a : '', identified: group.identified,
      count: count, answeredCount: answers.length, totalMembers: totalMembers,
      avg: count ? Math.round(total / count * 10) / 10 : null, lowCount: lowCount,
      pointMisses: counts(pointCounts), termMisses: counts(termCounts), answers: answers
    };
  }).sort(function (a, b) {
    if (a.avg === null && b.avg !== null) return 1;
    if (b.avg === null && a.avg !== null) return -1;
    if (a.avg !== null && b.avg !== null && a.avg !== b.avg) return a.avg - b.avg;
    return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
  });
}

      '<span class="qstat-metrics"><span class="qstat-average"><small>逐题得分均分</small><b>' + mean + '</b></span>' +
      '<span class="qstat-sample">作答 ' + r.answeredCount + ' / ' + r.totalMembers + ' 人<br>计分 ' + r.count + ' 人</span>' +
      '<span class="badge ' + tone + '">' + (r.avg === null ? '暂无有效分数' : r.avg < 60 ? '均分低于60' : r.avg < 80 ? '均分60至不足80' : '均分80及以上') + '</span>' +
      (r.count < 3 ? '<span class="badge b-gray">计分样本少</span>' : '') + '</span></summary>' +
      '<div class="qstat-body"><div class="qstat-detail-numbers">低于60分：<b>' + r.lowCount + '</b> / ' + r.count + ' 名计分学生' +
      (r.count ? '（' + Math.round(r.lowCount / r.count * 100) + '%）' : '') + '</div>';

  });

    resetQuestionStats('加载失败，请重试。');
  });
}

function renderRoster(klass, recs, submitted) {
  var box = $('gdRoster');
  if (!box) return;
  var members = (klass && klass.members) || [];
  var rs = recs || [];
  submitted = submitted || {};
  var lastBy = Object.create(null), indices = Object.create(null);
  rs.forEach(function (r, i) {
    if (r && r.code && !Object.prototype.hasOwnProperty.call(lastBy, r.code)) { lastBy[r.code] = r; indices[r.code] = i; }
  });
  var nameCache = S.nameCache || (S.nameCache = {});
  rs.forEach(function (r) { if (r && r.code && r.name) nameCache[r.code] = r.name; });
  function nm(code) { return nameCache[code] || code; }
  function paint() {
    if ($('gdRoster') !== box || S.gradeRecs !== rs) return;
    var done = Object.keys(lastBy).map(function (code) { return { code: code, r: lastBy[code], cnt: submitted[code] || 1, index: indices[code] }; });
    var todo = members.filter(function (code) { return !lastBy[code]; });
    var inClassDone = members.length - todo.length;
    S.rosterCache = { doneRows: done.map(function(x){return {name:nm(x.code),code:x.code};}), todoRows: todo.map(function(code){return {name:nm(code),code:code};}), done: done.map(function (x) { return nm(x.code) + '(' + x.code + ')'; }), todo: todo.map(function (x) { return nm(x) + '(' + x + ')'; }) };
    var h = '<div class="review-roster-note">每位学生显示最新一次成绩；进入后可切换查看历史提交。</div>' +
      '<div class="bar"><i class="gold" style="width:' + (members.length ? Math.round(inClassDone / members.length * 100) : 0) + '%"></i></div>' +
      '<label class="teacher-copy-option"><input type="checkbox" id="copyRosterAccounts" '+(TEACHER_REVIEW.copyAccounts?'checked':'')+' onchange="TEACHER_REVIEW.copyAccounts=this.checked">复制名单时包含账号数字</label><div style="margin-top:12px"><button class="ghost sm" onclick="copyRoster(\'todo\')">复制未提交名单</button>' +
      '<button class="ghost sm" onclick="copyRoster(\'done\')">复制已提交名单</button></div>' +
      '<h3 style="margin-top:14px">已提交（' + done.length + ' 人）</h3>';
    if (!done.length) h += '<div class="empty">暂时还没有人提交</div>';
    done.sort(function (a, b) { return String(b.r.at || '').localeCompare(String(a.r.at || '')); });
    done.forEach(function (x) {
      var r = x.r, show = examDisplayScore(r);
      h += '<button type="button" id="reviewStudent_' + x.index + '" class="item review-student" onclick="openReview(' + x.index + ')" aria-label="查看' + esc(nm(x.code)) + '的作答与复核">' +
        '<span class="review-student-top"><span><strong>' + esc(nm(x.code)) + '</strong> <span class="review-code mono">' + esc(x.code) + '</span></span>' +
        '<span class="badge ' + (r.reviewed ? 'b-green' : 'b-gold') + '">' + (r.reviewed ? '已复核' : '待复核') + '</span></span>' +
        '<span class="review-student-meta">' + esc(r.at || '') + ' · 建议分 ' + esc(r.score == null ? '—' : r.score) + ' · 当前计分 <b>' + esc(show == null ? '—' : show) + '</b>' +
        (x.cnt > 1 ? ' · 提交 ' + x.cnt + ' 次' : '') + (members.indexOf(x.code) < 0 ? ' · 当前不在班级名单' : '') + '</span>' +
        '<span class="review-open-label">查看作答与复核 <span aria-hidden="true">→</span></span></button>';
    });
    h += '<h3 style="margin-top:18px">未提交（' + todo.length + ' 人）</h3>';
    if (!members.length) h += '<div class="empty">当前班级名单为空；已有提交仍可查看。</div>';
    else if (!todo.length) h += '<div class="msg m-ok">全班都已提交，无需催交。</div>';
    else todo.forEach(function (code) { h += '<div class="item"><span class="t">' + esc(nm(code)) + '</span> <span class="review-code mono">' + esc(code) + '</span><span class="badge b-gray">未提交</span></div>'; });
    box.innerHTML = h;
  }
  paint();
  var missing = members.filter(function (c) { return !nameCache[c]; });
  if (missing.length) Promise.all(missing.map(function (c) {
    return loadUser(c).then(function (u) { nameCache[c] = (u && u.name) || c; }).catch(function () { nameCache[c] = c; });
  })).then(paint);
}

function paintGradeOverview() {
  var klass = S.gradeKlass || { members: [] }, task = S.gradeTask;

function rememberReviewDraft() {

}

function closeReview() {

    '<div class="sub">提交时间：' + esc(r.at || '未记录') + ' <span class="badge ' + (r.reviewed ? 'b-green' : 'b-gold') + '">' + (r.reviewed ? '已复核' : '待复核') + '</span></div>';

    }).join('') + '</select>';
  }
  html += '<div class="review-legend"><span><mark class="review-missing">黄色</mark> 参考答案中未匹配到的内容</span><span><mark class="review-different">红色</mark> 学生作答中不同或多出的内容</span></div>' +
    '<div class="sub">忽略标点、空格及大小写差异。颜色只提示文字差异；同义表达、语序变化是否正确，请结合题意复核。</div></div>';
  if (!(r.detail || []).length) html += '<div class="card"><div class="empty">这份记录没有保存逐题作答。</div></div>';
  (r.detail || []).forEach(function (d, j) {

      '<div class="review-question-text">' + esc(d.q || '未保存题目') + '</div>' +

      (hasReference ? diff.referenceHtml : '<span class="review-no-reference">这份历史记录未保存参考答案，无法自动对照。请核对题库原题。</span>') + '</div></div>' +
      '<div class="review-answer-panel"><h4>学生作答</h4><div class="review-answer">' +
      (String(d.text || '').trim() ? (diff ? diff.answerHtml : esc(d.text)) : '<span class="review-no-reference">未作答</span>') + '</div></div></div>';
    if (diff && !diff.different) html += '<div class="review-match">✓ 与参考答案文字一致（已忽略标点、空格及大小写）</div>';
    if (diff && diff.simplified) html += '<div class="sub">答案较长，部分差异按整段标出，请结合上下文核对。</div>';
    if (d.negWarn) html += '<div class="msg m-warn">系统检测到否定表述可能不同，请重点核对是否改变原意。</div>';
    html += '<details class="review-evidence"><summary>查看评分依据与要点检查</summary><div class="sub">原文匹配 ' + esc(d.raw == null ? '—' : d.raw) + '% · 要点覆盖 ' + esc(d.cover == null ? '—' : d.cover) + '%</div>';
    (d.points || []).forEach(function (p) { html += '<span class="tag' + (p.ok ? '' : ' miss') + '">' + (p.ok ? '✓ ' : '未匹配：') + esc((p.g || []).join('/')) + '</span>'; });
    if ((d.missingTerms || []).length) html += '<div class="sub">未匹配术语：' + d.missingTerms.map(function (t) { return '<span class="tag term">' + esc(t) + '</span>'; }).join('') + '</div>';

  });
  html += '<div class="card"><h3>学生留言与回复</h3>'+studentDiscussion(r)+'</div>';
  html += '<div class="card review-form"><h2>教师复核</h2><div class="sub">本次整份作答建议分：' + esc(r.score == null ? '—' : r.score) + ' / 100</div>' +
    '<div class="sub">修改逐题分数会自动计算平均分；也可调整整份最终分。</div><label for="reviewScore">最终复核分（0–100）</label><input id="reviewScore" type="number" min="0" max="100" step="1" value="' + esc(score == null ? '' : score) + '" oninput="rememberReviewDraft()">' +

    '<div id="reviewMsg" aria-live="polite"></div><div class="sub">填写后点击「保存复核」，学生才能看到更新的成绩和反馈。</div></div>';
  setHTML('gdDetail', html);
}

function saveReview(index,returnAfter) {
  if (REVIEW.saving) return Promise.resolve();
  var r = (S.gradeRecs || [])[index];
  if (!r || r.rid !== REVIEW.rid || !$('reviewScore') || !$('reviewFeedback')) return Promise.resolve();
  var raw = $('reviewScore').value.trim(), score = Number(raw), feedback = $('reviewFeedback').value.trim();
  if (!raw || !isFinite(score) || Math.floor(score) !== score || score < 0 || score > 100) {
    setMsg('reviewMsg', '复核分请填写 0–100 的整数，不能留空。', 'err'); return Promise.resolve();
  }
  if (!S.me || S.me.role !== 'teacher') { setMsg('reviewMsg', '请使用教师账号进行复核。', 'err'); return Promise.resolve(); }
  var questions=reviewQuestionInputs(r),savedOk=false;
  if(questions.some(function(q){var n=Number(q.score);return !q.score.trim()||!isFinite(n)||n<0||n>100||Math.floor(n)!==n;})){setMsg('reviewMsg','每题复核分须为0–100的整数。','err');return Promise.resolve();}
  var teacher = S.me.code, cls = S.gradeCls, taskId = r.taskId, rid = r.rid;
  rememberReviewDraft(); REVIEW.saving = true;
  ['reviewSave', 'reviewBack', 'reviewBottomBack', 'reviewSaveBack', 'reviewAttempt', 'reviewScore', 'reviewFeedback'].forEach(function (id) { if ($(id)) $(id).disabled = true; });
  setMsg('reviewMsg', '正在保存…', 'info');
  return CLD.update('rec:' + rid, function (cur) {
    if (!cur || cur.rid !== rid || cur.code !== r.code || cur.cls !== cls || cur.taskId !== taskId) throw new Error('作答记录已变化，请返回名单刷新后重试');
    if((cur.detail||[]).length!==questions.length)throw Error('题目记录已变化，请刷新后复核');
    cur.detail.forEach(function(d,j){if(d.qid!==questions[j].qid)throw Error('题目已变化');d.teacherScore=Number(questions[j].score);d.teacherFeedback=questions[j].feedback.trim();});
    cur.teacherScore = score; cur.feedback = feedback; cur.reviewed = true;
    cur.reviewAt = nowStr(); cur.reviewBy = teacher; cur.__v = (cur.__v || 0) + 1;
    return cur;
  }).then(function (saved) {
    savedOk=true;delete REVIEW.drafts[rid];
    if (!S.me || S.me.code !== teacher || S.gradeCls !== cls || !S.gradeTask || S.gradeTask.id !== taskId) return;
    S.gradeRecs = (S.gradeRecs || []).map(function (x) { return x.rid === rid ? saved : x; });
    if ($('gdRoster')) paintGradeOverview();
    if (REVIEW.rid === rid && $('gdDetail')) {
      var selected = S.gradeRecs.findIndex(function (x) { return x.rid === rid; });
      renderReviewDetail(selected);
      setMsg('reviewMsg', '已保存：' + (r.name || r.code) + '，复核分 ' + score + ' 分。', 'ok');
    }
  }).catch(function (e) {
    if (REVIEW.rid === rid) setMsg('reviewMsg', e.message || '保存失败，填写内容已保留，请重试。', 'err');
  }).finally(function () {
    REVIEW.saving = false;
    if(savedOk&&returnAfter&&REVIEW.rid===rid)closeReview();
    ['reviewSave', 'reviewBack', 'reviewBottomBack', 'reviewSaveBack', 'reviewAttempt', 'reviewScore', 'reviewFeedback'].forEach(function (id) { if ($(id)) $(id).disabled = false; });
  });
}

function copyRoster(kind) {
  var c = S.rosterCache || {};
  var arr = kind === 'todo' ? (c.todo || []) : (c.done || []);
  var title = kind === 'todo' ? '未提交名单' : '已提交名单';
  if (!arr.length) {
    setMsg('gdMsg', kind === 'todo' ? '没有未提交的学生' : '还没有学生提交', 'info');
    return;
  }
  var txt = title + '（' + arr.length + ' 人）\n' + arr.join('\n');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
      setMsg('gdMsg', title + '已复制（' + arr.length + ' 人）', 'ok');
      return;
    }
  } catch (e) {}
  download(title + '-' + today() + '.txt', txt, 'text/plain');
  setMsg('gdMsg', '已改为下载文件：' + title + '（' + arr.length + ' 人）', 'info');
}


function exportGrade() {
  var recs = S.gradeRecs || [];
  if (!recs.length) { setMsg('gdMsg', '当前任务没有可导出的记录', 'err'); return; }
  var rows = [['班级', '任务', '学习代号', '昵称', '提交时间', '建议分', '复核分', '最终计分', '是否复核', '老师反馈']];
  recs.forEach(function (r) {
    rows.push([
      S.gradeCls, r.taskTitle, r.code, r.name, r.at,
      r.score, r.reviewed ? r.teacherScore : '', r.reviewed ? r.teacherScore : r.score,
      r.reviewed ? '是' : '否', r.feedback || ''
    ]);

function growthNumber(id,min,max){var el=$(id),raw=el?el.value.trim():'',n=Number(raw);if(!raw||!Number.isInteger(n)||n<min||n>max)throw new Error('请检查规则中的数值范围');return n;}
function growthTags(value){var seen={};return String(value||'').split(/[,，;；\n]/).map(function(v){return v.trim();}).filter(function(v){if(!v||seen[v])return false;seen[v]=true;return true;});}
function saveGrowthRules(){
 if(GROWTH.busy||!S.me||S.me.role!=='teacher'||!GROWTH.teacher)return Promise.resolve();var ctx=GROWTH.teacher,r=JSON.parse(JSON.stringify(ctx.rules));
 try{r.xpPerTaskDay=growthNumber('grXP',1,1000);r.masteryScore=growthNumber('grMastery',0,100);r.comebackBelow=growthNumber('grBelow',1,100);r.requiredUnits=growthTags($('grUnits').value);r.weekdays=[];for(var i=0;i<7;i++)if($('grDay'+i).checked)r.weekdays.push(i);if(!r.weekdays.length)throw new Error('至少选择一个学习日');r.levels.forEach(function(l,i){l.name=$('grLevelName'+i).value.trim();l.xp=growthNumber('grLevelXP'+i,0,10000000);if(!l.name||(!i&&l.xp!==0)||(i&&l.xp<=r.levels[i-1].xp))throw new Error('等级名称不能为空；Lv.1需为0XP，之后的门槛必须递增');});r.honors.forEach(function(h,i){h.name=$('grHonorName'+i).value.trim();h.enabled=$('grHonorOn'+i).checked;if(!h.name)throw new Error('荣誉名称不能为空');if(h.id!=='first'&&h.id!=='legend')h.target=growthNumber('grHonorTarget'+i,1,['score','perfect','comeback','unit','improve'].indexOf(h.id)>=0?100:10000);});}catch(e){setMsg('gtMsg',e.message,'err');return Promise.resolve();}
 GROWTH.busy=true;r.__v=(r.__v||0)+1;r.updatedAt=nowStr();r.owner=ctx.owner;
 return CLD.putVerified('honor_definitions:'+ctx.owner,r,['levels','honors','xpPerTaskDay','requiredUnits','weekdays','masteryScore','comebackBelow']).then(function(){ctx.rules=r;setMsg('gtMsg','规则已保存；学生下次同步时生效。','ok');}).catch(function(e){setMsg('gtMsg',e.message||'保存失败','err');}).finally(function(){GROWTH.busy=false;});
}
function growthEditTask(){var ctx=GROWTH.teacher,id=$('grTask')&&$('grTask').value,t=ctx&&ctx.tasks[id];if(!t){setHTML('grTaskEditor','<div class="empty">请先发布任务</div>');return;}var m=t.growthMeta||{};
 setHTML('grTaskEditor','<label>知识主题</label><input id="grTheme" value="'+esc(m.theme||'')+'" placeholder="如：民主与法治"><label>知识点（逗号分隔）</label><input id="grKnowledge" value="'+esc((m.knowledge||[]).join('，'))+'" placeholder="如：人民当家作主，依法治国"><div class="sub">任务成绩达到规则中的掌握门槛，视为掌握这些知识点；同名知识点只计一次。</div><label><input style="width:auto" type="checkbox" id="grChallenge" '+(m.challenge?'checked':'')+'> 此任务是单元综合挑战</label><label>单元名称</label><input id="grUnit" value="'+esc(m.unit||'')+'"><label>单元勋章名称</label><input id="grBadge" value="'+esc(m.badge||'')+'" placeholder="如：法治守护者"><button class="ghost" onclick="saveGrowthTask()">保存任务成长标签</button>');
}
function saveGrowthTask(){
 var ctx=GROWTH.teacher,id=$('grTask')&&$('grTask').value;if(!ctx||!ctx.tasks[id]||GROWTH.busy||!S.me||S.me.code!==ctx.owner)return Promise.resolve();
 var m={theme:$('grTheme').value.trim(),knowledge:growthTags($('grKnowledge').value),challenge:$('grChallenge').checked,unit:$('grUnit').value.trim(),badge:$('grBadge').value.trim()};if(m.challenge&&!m.unit){setMsg('gtMsg','单元挑战需要填写单元名称','err');return Promise.resolve();}
 var t=ctx.tasks[id];GROWTH.busy=true;return CLD.update(t.kind==='practice'?'practice:'+t.practiceId:'task:'+id,function(cur){if(!cur||cur.owner!==ctx.owner)throw new Error('无权修改这个任务');cur.growthMeta=m;cur.__v=(cur.__v||0)+1;return cur;}).then(function(saved){ctx.tasks[id]=t.kind==='practice'?practiceTask(saved,t.cls):saved;setMsg('gtMsg','成长标签已保存，评分内容保持不变。','ok');}).catch(function(e){setMsg('gtMsg',e.message||'保存失败','err');}).finally(function(){GROWTH.busy=false;});
}

function growthWornLabel(x){
 var h=x.context.rules.honors.filter(function(h){return h.enabled&&h.id===x.honors.worn&&x.stats.eligible.indexOf(h.id)>=0;})[0];
 return h?h.icon+' '+h.name:'暂未佩戴';
}
function renderGrowthRanking(){
 var rows=GROWTH.rows.map(function(x,i){return {x:x,index:i};}).sort(function(a,b){return b.x.stats.xp-a.x.stats.xp||String(a.x.user.code).localeCompare(String(b.x.user.code));});
 if(!rows.length){setHTML('grStudents','<div class="empty">本班暂无学生成长记录。</div>');return;}
 var total=rows.reduce(function(n,r){return n+r.x.stats.xp;},0),wearing=rows.filter(function(r){return growthWornLabel(r.x)!=='暂未佩戴';}).length;
 var html='<div class="sub" style="margin:12px 0">本班 '+rows.length+' 人 · 平均经验 '+Math.round(total/rows.length)+' XP · 已佩戴头衔 '+wearing+' 人</div><div class="scroll-x"><table><tr><th>经验排名</th><th>学生</th><th>等级 / 经验</th><th>佩戴头衔</th><th>荣誉 / 勋章</th><th>成长与奖励</th></tr>';
 var rank=0;
 rows.forEach(function(row,i){var x=row.x,s=x.stats;if(!i||s.xp!==rows[i-1].x.stats.xp)rank=i+1;
 html+='<tr><td><strong>第 '+rank+' 名</strong></td><td>'+esc(x.user.name||x.user.code)+'<br><small>'+esc(x.user.code)+'</small></td><td>Lv.'+s.level+' · '+esc(s.levelName)+'<br><strong>'+s.xp+' XP</strong><br><small>'+(s.next===null?'已达最高等级':'距下一级 '+Math.max(0,s.next-s.xp)+' XP')+'</small></td><td><span class="tag">'+esc(growthWornLabel(x))+'</span></td><td>已解锁 '+s.eligible.length+' 个荣誉<br>单元勋章 '+(s.passedUnits||[]).length+' 枚</td><td><button class="sm ghost" onclick="growthInspect('+row.index+')">查看头衔与成长</button></td></tr>';
 });
 setHTML('grStudents',html+'</table></div>');
}

function growthRevoke(i){
 var x=GROWTH.rows[GROWTH.inspect];if(!x||GROWTH.busy||!S.me||S.me.role!=='teacher'||S.me.code!==x.context.owner)return Promise.resolve();
 var keys=Object.keys(x.ledger.entries).sort(function(a,b){return x.ledger.entries[b].day.localeCompare(x.ledger.entries[a].day);}),key=keys[i],entry=x.ledger.entries[key];if(!entry)return Promise.resolve();
 var reason=prompt((entry.revoked?'恢复':'撤销')+'这笔奖励的原因（不修改作答与成绩）：');if(!reason||!reason.trim())return Promise.resolve();var revoke=!entry.revoked;GROWTH.busy=true;
 return CLD.update('xp_transactions:'+x.scope,function(cur){if(!cur||!cur.entries[key])throw new Error('奖励记录已变化');var e=cur.entries[key];e.revoked=revoke;e.revokeReason=reason.trim();e.changedBy=S.me.code;e.changedAt=nowStr();e.audit=e.audit||[];e.audit.push({revoked:revoke,reason:reason.trim(),by:S.me.code,at:nowStr()});cur.__v=(cur.__v||0)+1;return cur;}).then(function(){return growthLoad(x.context.owner).then(function(ctx){return growthSync(x.user,ctx);});}).then(function(fresh){GROWTH.rows[GROWTH.inspect]=fresh;renderGrowthRanking();growthInspect(GROWTH.inspect);setMsg('grRevokeMsg',(revoke?'已撤销':'已恢复')+'奖励，经验和荣誉资格已重新计算。班级经验排名已同步更新。','ok');}).catch(function(e){setMsg('grRevokeMsg',e.message||'操作失败','err');}).finally(function(){GROWTH.busy=false;});
}

/* 自主练习、选择面板与学习交流 */
function loadPracticeCatalog(owner) {
  return CLD.get('idx:practice:'+owner).then(function(ix){return Promise.all(((ix||{}).ids||[]).map(function(id){return CLD.get('practice:'+id);}));}).then(function(a){return a.filter(function(p){return p&&p.owner===owner;});});
}
function practiceTask(p,cls) {
  return {id:'practice_'+p.id+'_'+cls,cls:cls,title:'道法大闯关 · '+p.name,owner:p.owner,kind:'practice',mode:p.mode||'recitation',practiceId:p.id,open:!!p.enabled,bankIds:[],practiceItems:p.items||[],growthMeta:p.growthMeta||{theme:p.name,knowledge:[]},at:p.at||'',date:''};
}
function loadClassTasks(cls,history) {
  return Promise.all([CLD.get('idx:task:'+cls),CLD.get('class:'+cls)]).then(function(res){
    return Promise.all([Promise.all(((res[0]||{}).ids||[]).map(function(id){return CLD.get('task:'+id);})),res[1]&&!res[1].deleted?loadPracticeCatalog(res[1].teacher):Promise.resolve([])]);
  }).then(function(res){var list=res[0].filter(function(t){return t&&(history||!t.deleted);});res[1].forEach(function(p){if(history||p.enabled)list.push(practiceTask(p,cls));});return list.sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});});
}
function loadLearningTask(id,cls){
  if(String(id).indexOf('practice_')!==0)return CLD.get('task:'+id);
  return loadClassTasks(cls,true).then(function(a){return a.filter(function(t){return t.id===id;})[0]||null;});
}
function paintPracticeControls(){
  if(!S.me||S.me.role!=='teacher')return Promise.resolve();
  return loadPracticeCatalog(S.me.code).then(function(list){(S.banks||[]).forEach(function(b){var p=list.filter(function(p){return p.id===b.id;})[0];var on=p&&p.enabled;
    setHTML('bankPractice_'+b.id,'<div class="sub">道法大闯关：'+(on?'已开放':'未开放')+'</div><button class="sm '+(on?'ghost':'gold')+'" onclick="publishPractice(\''+esc(b.id)+'\',true)">'+(on?'更新闯关题目':'发布到道法大闯关')+'</button>'+(on?'<button class="sm ghost" onclick="publishPractice(\''+esc(b.id)+'\',false)">下架闯关</button>':'')+'<div id="practiceMsg_'+esc(b.id)+'"></div>');
  });}).catch(function(e){setMsg('bkMsg','闯关状态加载失败：'+e.message,'err');});
}
var PRACTICE_BUSY={};
function publishPractice(id,enabled){
  if(!S.me||S.me.role!=='teacher'||PRACTICE_BUSY[id])return Promise.resolve();
  var owner=S.me.code;PRACTICE_BUSY[id]=true;setMsg('practiceMsg_'+id,'正在保存…','info');
  return CLD.get('bank:'+id).then(function(b){if(!b||b.owner!==owner)throw Error('无权发布此题库');if(enabled&&!(b.items||[]).length)throw Error('请先为题库添加题目');
    return CLD.update('practice:'+id,function(p){p=p||{id:id,owner:owner,at:nowStr()};if(p.owner!==owner)throw Error('无权修改此闯关');p.enabled=enabled;if(enabled){p.name=b.name;p.mode=b.mode||'recitation';p.items=JSON.parse(JSON.stringify(b.items));p.growthMeta=p.growthMeta||{theme:b.name,knowledge:[]};}p.updatedAt=nowStr();p.__v=(p.__v||0)+1;return p;});
  }).then(function(){return appendToIndex('idx:practice:'+owner,id,3);}).then(function(){return paintPracticeControls();}).catch(function(e){setMsg('practiceMsg_'+id,e.message||'发布失败','err');}).finally(function(){PRACTICE_BUSY[id]=false;});
}

var PUBLISH_BATCH=null,PUBLISH_BUSY=false;
function publishTask(){
  if(PUBLISH_BUSY)return Promise.resolve();
  var classes=selectedCards('tkClasses'),banks=selectedCards('tkBankCards'),title=$('tkTitle').value.trim(),ds=$('tkDateStart').value,de=$('tkDateEnd').value||ds;
  if(!classes.length||!banks.length||!title){setMsg('tkMsg','请填写标题，并至少勾选一个班级和一个题库。','err');return Promise.resolve();}
  if(!ymdParse(ds)||!ymdParse(de)||de<ds||(ymdParse(de)-ymdParse(ds))/86400000>=120){setMsg('tkMsg','请检查日期，范围须为 1–120 天。','err');return Promise.resolve();}
  var gm={theme:$('tkGrowthTheme').value.trim(),knowledge:growthTags($('tkGrowthKnowledge').value),challenge:$('tkGrowthChallenge').checked,unit:$('tkGrowthUnit').value.trim(),badge:$('tkGrowthBadge').value.trim()};
  if(gm.challenge&&!gm.unit){setMsg('tkMsg','请填写单元名称。','err');return Promise.resolve();}
  var selectedBanks=(S.banks||[]).filter(function(b){return banks.indexOf(b.id)>=0;}),examCount=selectedBanks.filter(function(b){return b.mode==='exam';}).length;
  if(examCount&&examCount!==selectedBanks.length){setMsg('tkMsg','试卷和背诵题库请分开发布，避免分值规则混在一起。','err');return Promise.resolve();}
  var owner=S.me.code,key=JSON.stringify([owner,classes,banks,title,ds,de,gm]);
  if(!PUBLISH_BATCH||PUBLISH_BATCH.key!==key)PUBLISH_BATCH={key:key,ids:{},done:{}};
  var batch=PUBLISH_BATCH;PUBLISH_BUSY=true;var failures=[];
  setMsg('tkMsg','正在向 '+classes.length+' 个班级发布…','info');
  return growthMapLimit(classes,function(cls){if(batch.done[cls])return true;
    var id=batch.ids[cls]||(batch.ids[cls]=newId(14));
    return CLD.get('class:'+cls).then(function(c){if(!c||c.deleted||c.teacher!==owner)throw Error('班级无效或无权发布');
      var task={id:id,cls:cls,title:title,mode:examCount?'exam':'recitation',date:ds,dateStart:ds,dateEnd:de,bankIds:banks.slice(),owner:owner,growthMeta:gm,open:true,at:nowStr(),__v:1};
      return CLD.putVerified('task:'+id,task,['id','cls','title','bankIds']);
    }).then(function(){return appendToIndex('idx:task:'+cls,id,3);}).then(function(){batch.done[cls]=true;}).catch(function(e){failures.push(cls+'：'+e.message);});
  }).then(function(){if(failures.length)setMsg('tkMsg','已成功 '+Object.keys(batch.done).length+' 个班级。失败：'+failures.join('；')+'。保持选项不变再次点击发布，只补发失败班级。','err');else{setMsg('tkMsg','已向 '+classes.length+' 个班级发布，每班独立记录提交与成绩。','ok');$('tkTitle').value='';PUBLISH_BATCH=null;}return renderTasks();}).finally(function(){PUBLISH_BUSY=false;});
}

}

function teacherSetSaving(busy){REVIEW.saving=busy;['reviewSave','reviewSaveBack','reviewSaveQuestion','reviewBack','reviewBottomBack','reviewAttempt','reviewQuestionSelect'].forEach(function(id){if($(id))$(id).disabled=busy;});}
function teacherPersistReview(r,mutator){
  var owner=S.me&&S.me.code,cls=S.gradeCls,tid=r.taskId;
  if(!S.me||S.me.role!=='teacher')return Promise.reject(Error('请使用教师账号'));return CLD.get('class:'+cls).then(function(c){if(!c||c.deleted||c.teacher!==owner)throw Error('无权复核此班级');return CLD.update('rec:'+r.rid,function(cur){if(!cur||cur.code!==r.code||cur.cls!==cls||cur.taskId!==tid)throw Error('作答记录已变化，请刷新');return mutator(cur,owner);});}).then(function(saved){if(S.me&&S.me.code===owner&&S.gradeCls===cls&&S.gradeTask&&S.gradeTask.id===tid){S.gradeRecs=(S.gradeRecs||[]).map(function(x){return x.rid===saved.rid?saved:x;});delete REVIEW.drafts[saved.rid];paintGradeOverview();}return saved;});
}
function saveReview(index,returnAfter){
  if(REVIEW.saving)return Promise.resolve();var r=(S.gradeRecs||[])[index];if(!r||REVIEW.rid!==r.rid)return Promise.resolve();rememberReviewDraft();var draft=REVIEW.drafts[r.rid],qs=draft.questions;
  var bad=qs.findIndex(function(q,k){return !teacherValidMark(q.score,teacherQMax(r.detail[k]));});if(bad>=0){setMsg('reviewMsg','第 '+(bad+1)+' 题尚未填写有效得分，请先复核该题。','err');return Promise.resolve();}
  var whole=Number(draft.score);if(!teacherExam(r)&&!teacherValidMark(draft.score,100)){setMsg('reviewMsg','请填写0–100的最终成绩。','err');return Promise.resolve();}
  teacherSetSaving(true);setMsg('reviewMsg','正在保存…','info');var ok=false;
  return teacherPersistReview(r,function(cur,owner){if((cur.detail||[]).length!==qs.length)throw Error('题目记录已变化');cur.detail.forEach(function(d,k){if(d.qid!==qs[k].qid)throw Error('题目记录已变化');d.teacherScore=Number(qs[k].score);d.teacherFeedback=qs[k].feedback.trim();d.teacherReviewed=true;d.reviewAt=nowStr();d.reviewBy=owner;});cur.feedback=draft.feedback.trim();return teacherFinalizeRecord(cur,owner,teacherExam(cur)?null:whole);}).then(function(){ok=true;}).catch(function(e){setMsg('reviewMsg',e.message||'保存失败，填写内容已保留','err');}).finally(function(){teacherSetSaving(false);if(ok&&REVIEW.rid===r.rid){if(returnAfter)closeReview();else{renderReviewDetail(index);setMsg('reviewMsg','整份复核已保存。','ok');}}});
}
function reviewMoveStudent(delta){if(REVIEW.saving)return;var people=questionReviewPeople(),pos=people.findIndex(function(x){return x.r.rid===REVIEW.rid;}),next=people[pos+delta];if(next)openReviewWorkspace(next.index,next.qindex);else setMsg('reviewMsg',delta>0?'已经是最后一位学生。':'已经是第一位学生。','info');}
function saveCurrentReviewQuestion(index){
  if(REVIEW.saving)return Promise.resolve();var r=(S.gradeRecs||[])[index],j=TEACHER_REVIEW.questionIndex;if(!r||!r.detail[j]||r.rid!==REVIEW.rid)return Promise.resolve();rememberReviewDraft();var q=REVIEW.drafts[r.rid].questions[j];if(!teacherValidMark(q.score,teacherQMax(r.detail[j]))){setMsg('reviewMsg','本题得分须在0–'+teacherQMax(r.detail[j])+'之间。','err');return Promise.resolve();}

  }).then(function(){ok=true;REVIEW.drafts[r.rid]=pendingDraft;}).catch(function(e){setMsg('reviewMsg',e.message||'保存失败，尚未切换学生','err');}).finally(function(){teacherSetSaving(false);if(!ok||REVIEW.rid!==r.rid)return;renderReviewDetail(index);setMsg('reviewMsg','本题成绩已保存。可单独点击下一位；所有学生的全部主观题完成后，点击统一保存本任务复核。','ok');});

function bulkReviewPlan(){return (S.gradeRecs||[]).filter(function(r){return !r.reviewed;}).map(function(r){var count=(r.detail||[]).filter(function(d){return !d.teacherReviewed&&d.type!=='subjective'&&teacherValidMark(d.score,teacherQMax(d));}).length,pending=(r.detail||[]).some(function(d){return d.type==='subjective'&&!d.teacherReviewed;});return {r:r,count:count,pending:pending};}).filter(function(x){return x.count>0;});}
function bulkReviewTask(){
  if(TEACHER_REVIEW.bulkBusy||!S.gradeTask||!S.me||S.me.role!=='teacher')return Promise.resolve();var plan=bulkReviewPlan(),pending=(S.gradeRecs||[]).filter(function(r){return !r.reviewed&&(r.detail||[]).some(function(d){return d.type==='subjective'&&!d.teacherReviewed;});}).length;
  if(!plan.length){setMsg('gdMsg',pending?'还有 '+pending+' 份试卷需要老师逐题复核主观题，没有可自动确认的题目。':'当前没有待批量复核的作答。','info');return Promise.resolve();}
  var questionCount=plan.reduce(function(n,x){return n+x.count;},0);if(!confirm('确认按现有系统建议分复核 '+plan.length+' 份作答中的 '+questionCount+' 道背诵/客观题？\n其中 '+pending+' 份仍需人工复核主观题；不会自动给主观题打分，也不会覆盖已有教师评分。'))return Promise.resolve();
  TEACHER_REVIEW.bulkBusy=true;var failed=[],completed=0,owner=S.me.code,cls=S.gradeCls,tid=S.gradeTask.id;
  return CLD.get('class:'+cls).then(function(c){if(!c||c.teacher!==owner||c.deleted)throw Error('无权复核此班级');return growthMapLimit(plan,function(x){return CLD.update('rec:'+x.r.rid,function(cur){if(!cur||cur.cls!==cls||cur.taskId!==tid)throw Error('记录已变化');(cur.detail||[]).forEach(function(d){if(!d.teacherReviewed&&d.type!=='subjective'&&teacherValidMark(d.score,teacherQMax(d))){d.teacherScore=Number(d.score);d.teacherReviewed=true;d.reviewAt=nowStr();d.reviewBy=owner;}});return teacherFinalizeRecord(cur,owner,null);}).then(function(saved){completed++;S.gradeRecs=(S.gradeRecs||[]).map(function(r){return r.rid===saved.rid?saved:r;});}).catch(function(e){failed.push((x.r.name||x.r.code)+'：'+e.message);});});}).then(function(){paintGradeOverview();setMsg('gdMsg','已处理 '+completed+' 份作答。'+(pending?'仍有主观题的 '+pending+' 份需人工复核。':'')+(failed.length?'失败 '+failed.length+' 份：'+failed.join('；')+'，可再次点击只补处理未完成部分。':''),failed.length?'warn':'ok');}).catch(function(e){setMsg('gdMsg',e.message,'err');}).finally(function(){TEACHER_REVIEW.bulkBusy=false;});
}

function examImportExample(){return '【填空题】\n题目：我国的根本法是____。\n答案：宪法\n\n【选择题】\n题目：我国的根本法是？\nA.宪法\nB.刑法\nC.民法典\nD.教育法\n答案：A\n\n【主观题】\n题目：简述尊重他人的做法。\n分值：6\n答案：积极关注、重视他人；平等对待他人；学会换位思考。';}
function parseExamImport(text){
 var rows;if(/^\s*\[/.test(text)){rows=JSON.parse(text);}else{
 rows=[];var cur=null,field='';text.split(/\r?\n/).forEach(function(line){line=line.trim();if(!line)return;var h=/^【(填空题|选择题|主观题)】$/.exec(line);if(h){cur={type:{填空题:'blank',选择题:'choice',主观题:'subjective'}[h[1]],q:'',a:'',options:[]};rows.push(cur);field='';return;}if(!cur)throw Error('请使用示例中的【题型】标记，或粘贴JSON题目数组');var m=/^(题目|答案|参考答案|分值)[：:](.*)$/.exec(line);if(m){field={题目:'q',答案:'a',参考答案:'a',分值:'maxScore'}[m[1]];cur[field]=m[2].trim();return;}var opt=/^([A-H])[.、．：:]\s*(.*)$/.exec(line);if(opt&&cur.type==='choice'){if(opt[1].charCodeAt(0)-65!==cur.options.length)throw Error('选择题选项请从A开始连续排列');cur.options.push(opt[2]);field='';return;}if(field==='q'||field==='a')cur[field]+='\n'+line;else throw Error('无法识别这一行：'+line.slice(0,30));});
 }
 if(!Array.isArray(rows)||!rows.length||rows.length>200)throw Error('每次请导入1–200道题');
 return rows.map(function(r,i){var type=r.type,q=String(r.q||'').trim(),a=String(r.a||'').trim(),opts=r.options||[],max=type==='blank'?1:type==='choice'?2:Number(r.maxScore);
 if(['blank','choice','subjective'].indexOf(type)<0||!q||!a)throw Error('第'+(i+1)+'题缺少题型、题目或答案');
 if(!Number.isInteger(max)||max<1||max>100)throw Error('第'+(i+1)+'题主观题分值须为1–100整数');
 if(type==='choice'){a=a.toUpperCase();if(!Array.isArray(opts)||opts.length<2||opts.length>8||opts.some(function(x){return typeof x!=='string'||!x.trim();})||!/^[A-H]$/.test(a)||a.charCodeAt(0)-65>=opts.length)throw Error('第'+(i+1)+'题选项或答案字母不正确');}
 return {qid:newId(10),type:type,q:q,a:a,maxScore:max,options:type==='choice'?opts:[],points:[],terms:[]};});
}

 var text=$('ansBox').value.trim(),images=EXAM_PHOTOS.slice(),note=$('ansNote').value.trim().slice(0,1000);
 PLAY.results=PLAY.results.filter(function(r){return r.qid!==it.qid;});

 PLAY.results.sort(function(a,b){return PLAY.items.findIndex(function(q){return q.qid===a.qid;})-PLAY.items.findIndex(function(q){return q.qid===b.qid;});});
 var draft={rid:PLAY.rid,code:S.me.code,cls:S.me.cls,taskId:PLAY.task.id,results:PLAY.results,at:nowStr(),savedAt:Date.now(),currentIndex:PLAY.idx,__v:1};

 if(TEACHER_REVIEW.bulkBusy||REVIEW.saving||!S.me||S.me.role!=='teacher'||!S.gradeTask)return Promise.resolve();
 var records=(S.gradeRecs||[]).filter(isExamRecord),pending=records.filter(function(r){return (r.detail||[]).some(function(d){return d.type==='subjective'&&(!d.teacherReviewed||!teacherValidMark(d.teacherScore,teacherQMax(d)));});});

/* 云端连通性自检：把真实原因显示出来，不再只甩一句 failed to fetch */
function probeCloud() {
  return CLD.rows('healthcheck').then(function () {
    return { ok: true };
  }).catch(function (e) {
    return { ok: false, msg: (e && e.message) || '连不上云端服务器' };
  });
}

(function boot() {
  var loading = document.createElement('div');
  loading.className = 'wrap';
  loading.innerHTML = '<div class="card" style="text-align:center;margin-top:40px">' +
    '<div class="empty">正在连接服务器…</div></div>';
  document.body.appendChild(loading);

  function done(probe, ok) {
    try { loading.remove(); } catch (e) {}
    if (ok) { enterApp(); return; }
    $('authView').className = '';
    $('appView').className = 'hide';
    if (!probe.ok) {
      setMsg('lgMsg',
        '云端连接失败：' + probe.msg +
        '。请确认网络可用后刷新页面；若持续失败，说明平台数据接口暂时不可达，请联系老师。',
        'err');
      var rb = $('rgMsg');
      if (rb) setMsg('rgMsg', '云端连接失败：' + probe.msg, 'err');
    }
  }

  /* 12 秒超时兜底：网络卡住也必须让登录界面可用 */
  var settled = false;
  setTimeout(function () {
    if (settled) return;
    settled = true;
    try { loading.remove(); } catch (e) {}
    $('authView').className = '';
    $('appView').className = 'hide';
    setMsg('lgMsg', '连接云端超时（12 秒）。请检查网络后刷新页面重试。', 'err');
  }, 12000);

  Promise.resolve().then(function () {
    return probeCloud();
  }).catch(function (e) {
    return { ok: false, msg: (e && e.message) || '连通性自检异常' };
  }).then(function (probe) {
    return restoreSession().catch(function () { return false; }).then(function (ok) {
      if (settled) return;
      settled = true;
      done(probe, ok);
    });
  });
})();
